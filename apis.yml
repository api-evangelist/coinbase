  description: >-
    Send funds from a CDP account you own to a Coinbase user account or an onchain address. Use disbursements
    for standalone refunds, rebates, and other payouts that are not associated with a payment session.


    ## Lifecycle


    Disbursements are created with `pending` status and transition to `succeeded` or `failed`. Successful
    disbursements include `onchainTransactions`; failed disbursements include `error` details.


    Subscribe to `acceptance.disbursement.pending`, `acceptance.disbursement.succeeded`, and `acceptance.disbursement.failed`
