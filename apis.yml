apis:
- aid: coinbase:wallet-sdk
  name: Coinbase Wallet SDK
  tags:
  - Cryptocurrency
  - DApps
  - SDK
  - Wallets
  - Web3
  tags_raw:
  - Cryptocurrency
  - DApps
  - SDK
  - Wallet
  - Web3
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.coinbase.com/developer-platform/products/wallet-sdk
  properties:
  - url: https://docs.cdp.coinbase.com/wallet-sdk/docs/welcome
    type: Documentation
  description: >-
    The Coinbase Wallet SDK allows developers to integrate Coinbase Wallet connectivity into decentralized
    applications. It provides a streamlined interface for users to connect their wallets, sign transactions,
    and interact with smart contracts across multiple blockchain networks. The SDK supports millions of
    Coinbase Wallet users and enables dapp developers to offer seamless wallet-based experiences for trading
    assets and managing NFTs.
  x-features:
  - EIP-1193 provider compatible with web3 libraries
  - Mobile and desktop wallet connection flows
  - Smart contract signing and transaction handling
  - NFT and asset management primitives
  x-use-cases:
  - Add Connect Wallet flows to dapps
  - Sign messages and transactions in mobile and web apps
  - Bridge web3 user identity to traditional UX patterns
- aid: coinbase:data-api
  name: Coinbase Data API
  tags:
  - Analytics
  - Blockchain
  - Cryptocurrency
  - Market Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.coinbase.com/developer-platform/products/data-api
  properties:
  - url: https://www.coinbase.com/developer-platform/products/data-api
    type: Documentation
  description: >-
    The Coinbase Data API provides developers with access to cryptocurrency market data, blockchain analytics,
    and pricing information. It delivers real-time and historical data for a wide range of digital assets,
    enabling developers to build data-driven applications, dashboards, and research tools. The API supports
    queries for price feeds, trading volumes, and on-chain metrics across supported networks.
  x-features:
  - Real-time and historical price feeds
  - On-chain analytics and metrics
  - Trading volume and liquidity insights
  x-use-cases:
  - Power research dashboards and reports
  - Drive risk and pricing models with on-chain signals
  - Display market data in consumer apps
- aid: coinbase:agentkit
  name: Coinbase AgentKit
  tags:
  - Agents
  - Artificial Intelligence
  - Blockchain
  - SDK
  - Wallets
  tags_raw:
  - Agents
  - AI
  - Blockchain
  - SDK
  - Wallet
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cdp.coinbase.com/agent-kit/welcome
  properties:
  - url: https://docs.cdp.coinbase.com/agent-kit/welcome
    type: Documentation
  description: >-
    Coinbase AgentKit is a toolkit that enables AI agents to interact with blockchain networks through
    secure wallet management and comprehensive onchain capabilities. Built on the Coinbase Developer Platform
    SDK, it is framework-agnostic and wallet-agnostic, supporting EVM and Solana networks.
  x-features:
  - Framework-agnostic and wallet-agnostic agent toolkit
  - EVM and Solana network support
  - Gasless transactions via CDP Smart Wallets
  - LangChain, MCP, and other framework integrations
  x-use-cases:
  - Build autonomous AI agents that transact on-chain
  - Automate token swaps, transfers, and contract calls
  - Connect agentic frameworks to wallet primitives
