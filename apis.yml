- aid: coinbase:coinbase-solana-accounts-api
  name: Coinbase Solana Accounts API
  description: >-
    The Solana Account APIs enable you to create and use Solana accounts across SVM-compatible blockchains.


    An **account** is a private/public key pair that is used to sign transactions and messages. The private
    key is generated and used only in CDP's Trusted Execution Environment (TEE), and never exposed to
    Coinbase or the developer.


    A Solana account is identified by its **address**, which is a base-58 encoded string.


    Accounts can optionally be assigned an **account name** at creation time for easier identification
    in subsequent API calls. Solana account names must be globally unique across all Solana accounts in
    the developer's CDP Project.


    ## Authentication


    The Solana Account APIs use two layers of authentication to ensure the security of your accounts'
    private keys:


    - **CDP Secret API Key**: This key is used to authenticate all requests to the entire suite of
       REST APIs offered on Coinbase Developer Platform.
    - **Wallet Secret**: This secret is used specifically to authenticate sensitive wallet operations
      to `POST` and `DELETE` endpoints in the EVM and Solana Account APIs.


    To learn more about creating and using these keys, visit our [Authentication docs](https://docs.cdp.coinbase.com/api-reference/v2/authentication).


    <Tip>



    **Use our SDK**



    The [CDP SDK](https://github.com/coinbase/cdp-sdk) automatically authenticates requests using your
    CDP Secret API Key and Wallet Secret. Use the CDP SDK for a more convenient access to our APIs.



    </Tip>
