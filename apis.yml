- aid: coinbase:coinbase-deposit-destinations-api
  name: Coinbase Deposit Destinations API
  description: >-
    Deposit Destinations allow you to manage where funds can be deposited into your accounts.


    ## Crypto Deposit Destinations


    Crypto deposit destinations are cryptocurrency addresses that you can generate and fetch via the API.
    Once created, these addresses can receive cryptocurrency payments on their specified network. By default,
    incoming funds are credited to your account balance (`target.accountId`); you can instead route funds
    directly to an external onchain address by setting `target` to an onchain address (`target.address`,
    `target.network`, `target.asset`, and optionally `target.destinationTag`).


    **Metadata:**

    You can attach metadata to any deposit destination you create to track the purpose or source of deposits.



    **Example (target: account balance):**

    ```json

    {
      "depositDestinationId": "depositDestination_123",
      "accountId": "account_456",
      "type": "crypto",
      "crypto": {
        "network": "base",
        "address": "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
      },
      "target": {
        "accountId": "account_789",
        "asset": "usd"
      },
      "status": "active",
      "metadata": {
        "customer_id": "cust_789",
        "reference": "order-12345"
      }
    }

    ```

    **Example (target: onchain address):**

    ```json

    {
      "depositDestinationId": "depositDestination_123",
      "accountId": "account_456",
      "type": "crypto",
      "crypto": {
        "network": "base",
        "address": "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
      },
      "target": {
        "address": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",
        "network": "base",
        "asset": "usdc"
      },
      "status": "active",
      "metadata": {
        "customer_id": "cust_789",
        "reference": "order-12345"
      }
    }

    ```

    Use the list endpoint to retrieve all deposit destinations.


    ## Fiat Deposit Destinations


    <Warning>

    Fiat deposit destinations are currently in **private beta** and require account enablement. Contact
    your Coinbase representative for access. Fields and behavior may change before general availability.

    </Warning>


    Fiat deposit destinations are bank accounts provisioned on your behalf that let an account receive
    USD deposits over a supported payment rail (for example, ACH). Each fiat deposit destination represents
    a single bank account at a single banking partner and is keyed by `accountType` (for example, `us_bank`).


    **Example:**

    ```json

    {
      "depositDestinationId": "depositDestination_cf4958d2-b068-6bf9-da01-eee44f157336",
      "accountId": "account_af2937b0-9846-4fe7-bfe9-ccc22d935114",
      "type": "fiat",
      "status": "pending",
      "fiat": {
        "accountType": "us_bank",
        "currency": "usd",
        "bankName": "Citibank N.A.",
        "beneficiaryName": "John Smith",
        "routingNumber": "987654321",
        "accountNumber": "123456789",
        "bankAddress": "399 Park Avenue, New York, NY 10022",
        "supportedRails": ["ach", "fedwire"]
      },
      "target": {
        "accountId": "account_af2937b0-9846-4fe7-bfe9-ccc22d935114",
        "asset": "usdc"
      }
    }

    ```

    Use the create endpoint to provision a fiat deposit destination for an account.
  humanURL: https://www.coinbase.com/developer-platform/products/wallet-sdk
