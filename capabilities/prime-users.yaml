naftiko: 1.0.0-alpha2
info:
  label: Coinbase Prime API — Users
  description: 'Coinbase Prime API — Users. 1 operations. Lead operation: List portfolio users. Self-contained Naftiko capability
    covering one Coinbase business surface.'
  tags:
  - Coinbase
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINBASE_API_KEY: COINBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: prime-users
    baseUri: https://api.prime.coinbase.com/v1
    description: Coinbase Prime API — Users business capability. Self-contained, no shared references.
    resources:
    - name: portfolios-portfolio_id-users
      path: /portfolios/{portfolio_id}/users
      operations:
      - name: listportfoliousers
        method: GET
        description: List portfolio users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-CB-ACCESS-KEY
      value: '{{env.COINBASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: prime-users-rest
    port: 8080
    description: REST adapter for Coinbase Prime API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/portfolios/{portfolio-id}/users
      name: portfolios-portfolio-id-users
      description: REST surface for portfolios-portfolio_id-users.
      operations:
      - method: GET
        name: listportfoliousers
        description: List portfolio users
        call: prime-users.listportfoliousers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: prime-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Coinbase Prime API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-portfolio-users
      description: List portfolio users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: prime-users.listportfoliousers
      outputParameters:
      - type: object
        mapping: $.
