naftiko: 1.0.0-alpha2
info:
  label: Coinbase Advanced Trade API — Accounts
  description: 'Coinbase Advanced Trade API — Accounts. 2 operations. Lead operation: List accounts. Self-contained Naftiko
    capability covering one Coinbase business surface.'
  tags:
  - Coinbase
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINBASE_API_KEY: COINBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: advanced-trade-accounts
    baseUri: https://api.coinbase.com/api/v3/brokerage
    description: Coinbase Advanced Trade API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: listaccounts
        method: GET
        description: List accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-account_id
      path: /accounts/{account_id}
      operations:
      - name: getaccount
        method: GET
        description: Get account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: CB-ACCESS-KEY
      value: '{{env.COINBASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: advanced-trade-accounts-rest
    port: 8080
    description: REST adapter for Coinbase Advanced Trade API — Accounts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/accounts
      name: accounts
      description: REST surface for accounts.
      operations:
      - method: GET
        name: listaccounts
        description: List accounts
        call: advanced-trade-accounts.listaccounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{account-id}
      name: accounts-account-id
      description: REST surface for accounts-account_id.
      operations:
      - method: GET
        name: getaccount
        description: Get account
        call: advanced-trade-accounts.getaccount
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: advanced-trade-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Coinbase Advanced Trade API — Accounts. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-accounts
      description: List accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: advanced-trade-accounts.listaccounts
      outputParameters:
      - type: object
        mapping: $.
    - name: get-account
      description: Get account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: advanced-trade-accounts.getaccount
      outputParameters:
      - type: object
        mapping: $.
