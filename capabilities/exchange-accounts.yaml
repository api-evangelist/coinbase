    port: 9090
    transport: http
    description: MCP adapter for Coinbase Exchange API — Accounts. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-accounts
      description: List accounts
      hints:
        readOnly: true
