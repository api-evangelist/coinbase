naftiko: 1.0.0-alpha2
info:
  label: Coinbase Prime API — Address Book
  description: 'Coinbase Prime API — Address Book. 1 operations. Lead operation: List address book entries. Self-contained
    Naftiko capability covering one Coinbase business surface.'
  tags:
  - Coinbase
  - Address Book
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINBASE_API_KEY: COINBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: prime-address-book
    baseUri: https://api.prime.coinbase.com/v1
    description: Coinbase Prime API — Address Book business capability. Self-contained, no shared references.
    resources:
    - name: portfolios-portfolio_id-address_book
      path: /portfolios/{portfolio_id}/address_book
      operations:
      - name: listaddressbook
        method: GET
        description: List address book entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: currency_symbol
          in: query
          type: string
          description: Filter by currency symbol
    authentication:
      type: apikey
      key: X-CB-ACCESS-KEY
      value: '{{env.COINBASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: prime-address-book-rest
    port: 8080
    description: REST adapter for Coinbase Prime API — Address Book. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/portfolios/{portfolio-id}/address-book
      name: portfolios-portfolio-id-address-book
      description: REST surface for portfolios-portfolio_id-address_book.
      operations:
      - method: GET
        name: listaddressbook
        description: List address book entries
        call: prime-address-book.listaddressbook
        with:
          currency_symbol: rest.currency_symbol
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: prime-address-book-mcp
    port: 9090
    transport: http
    description: MCP adapter for Coinbase Prime API — Address Book. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-address-book-entries
      description: List address book entries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: prime-address-book.listaddressbook
      with:
        currency_symbol: tools.currency_symbol
      outputParameters:
      - type: object
        mapping: $.
