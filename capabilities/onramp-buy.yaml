naftiko: 1.0.0-alpha2
info:
  label: Coinbase Onramp API — Buy
  description: 'Coinbase Onramp API — Buy. 3 operations. Lead operation: Get buy config. Self-contained Naftiko capability
    covering one Coinbase business surface.'
  tags:
  - Coinbase
  - Buy
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINBASE_API_KEY: COINBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: onramp-buy
    baseUri: https://api.developer.coinbase.com/onramp/v1
    description: Coinbase Onramp API — Buy business capability. Self-contained, no shared references.
    resources:
    - name: buy-config
      path: /buy/config
      operations:
      - name: getbuyconfig
        method: GET
        description: Get buy config
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: country
          in: query
          type: string
          description: ISO 3166-1 alpha-2 country code
          required: true
    - name: buy-options
      path: /buy/options
      operations:
      - name: getbuyoptions
        method: GET
        description: Get buy options
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: country
          in: query
          type: string
          description: ISO 3166-1 alpha-2 country code
          required: true
        - name: subdivision
          in: query
          type: string
          description: ISO 3166-2 subdivision code
    - name: buy-quote
      path: /buy/quote
      operations:
      - name: createbuyquote
        method: POST
        description: Create buy quote
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.COINBASE_API_KEY}}'
  exposes:
  - type: rest
    namespace: onramp-buy-rest
    port: 8080
    description: REST adapter for Coinbase Onramp API — Buy. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/buy/config
      name: buy-config
      description: REST surface for buy-config.
      operations:
      - method: GET
        name: getbuyconfig
        description: Get buy config
        call: onramp-buy.getbuyconfig
        with:
          country: rest.country
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/buy/options
      name: buy-options
      description: REST surface for buy-options.
      operations:
      - method: GET
        name: getbuyoptions
        description: Get buy options
        call: onramp-buy.getbuyoptions
        with:
          country: rest.country
          subdivision: rest.subdivision
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/buy/quote
      name: buy-quote
      description: REST surface for buy-quote.
      operations:
      - method: POST
        name: createbuyquote
        description: Create buy quote
        call: onramp-buy.createbuyquote
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: onramp-buy-mcp
    port: 9090
    transport: http
    description: MCP adapter for Coinbase Onramp API — Buy. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-buy-config
      description: Get buy config
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: onramp-buy.getbuyconfig
      with:
        country: tools.country
      outputParameters:
      - type: object
        mapping: $.
    - name: get-buy-options
      description: Get buy options
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: onramp-buy.getbuyoptions
      with:
        country: tools.country
        subdivision: tools.subdivision
      outputParameters:
      - type: object
        mapping: $.
    - name: create-buy-quote
      description: Create buy quote
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: onramp-buy.createbuyquote
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
