naftiko: 1.0.0-alpha2
info:
  label: Coinbase Prime API — Activities
  description: 'Coinbase Prime API — Activities. 1 operations. Lead operation: List activities. Self-contained Naftiko capability
    covering one Coinbase business surface.'
  tags:
  - Coinbase
  - Activities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINBASE_API_KEY: COINBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: prime-activities
    baseUri: https://api.prime.coinbase.com/v1
    description: Coinbase Prime API — Activities business capability. Self-contained, no shared references.
    resources:
    - name: portfolios-portfolio_id-activities
      path: /portfolios/{portfolio_id}/activities
      operations:
      - name: listactivities
        method: GET
        description: List activities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: symbols
          in: query
          type: string
          description: Filter by currency symbols
        - name: categories
          in: query
          type: array
          description: Filter by activity categories
        - name: statuses
          in: query
          type: array
          description: Filter by activity statuses
        - name: start_time
          in: query
          type: string
          description: Start time filter
        - name: end_time
          in: query
          type: string
          description: End time filter
    authentication:
      type: apikey
      key: X-CB-ACCESS-KEY
      value: '{{env.COINBASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: prime-activities-rest
    port: 8080
    description: REST adapter for Coinbase Prime API — Activities. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/portfolios/{portfolio-id}/activities
      name: portfolios-portfolio-id-activities
      description: REST surface for portfolios-portfolio_id-activities.
      operations:
      - method: GET
        name: listactivities
        description: List activities
        call: prime-activities.listactivities
        with:
          symbols: rest.symbols
          categories: rest.categories
          statuses: rest.statuses
          start_time: rest.start_time
          end_time: rest.end_time
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: prime-activities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Coinbase Prime API — Activities. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-activities
      description: List activities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: prime-activities.listactivities
      with:
        symbols: tools.symbols
        categories: tools.categories
        statuses: tools.statuses
        start_time: tools.start_time
        end_time: tools.end_time
      outputParameters:
      - type: object
        mapping: $.
