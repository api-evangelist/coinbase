naftiko: 1.0.0-alpha2
info:
  label: Coinbase Exchange API — Profiles
  description: 'Coinbase Exchange API — Profiles. 3 operations. Lead operation: List profiles. Self-contained Naftiko capability
    covering one Coinbase business surface.'
  tags:
  - Coinbase
  - Profiles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINBASE_API_KEY: COINBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: exchange-profiles
    baseUri: https://api.exchange.coinbase.com
    description: Coinbase Exchange API — Profiles business capability. Self-contained, no shared references.
    resources:
    - name: profiles
      path: /profiles
      operations:
      - name: listprofiles
        method: GET
        description: List profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: active
          in: query
          type: boolean
          description: Filter for active profiles only
    - name: profiles-transfer
      path: /profiles/transfer
      operations:
      - name: transferbetweenprofiles
        method: POST
        description: Transfer between profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: profiles-profile_id
      path: /profiles/{profile_id}
      operations:
      - name: getprofile
        method: GET
        description: Get profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: profile_id
          in: path
          type: string
          description: Profile ID
          required: true
    authentication:
      type: apikey
      key: CB-ACCESS-KEY
      value: '{{env.COINBASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: exchange-profiles-rest
    port: 8080
    description: REST adapter for Coinbase Exchange API — Profiles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/profiles
      name: profiles
      description: REST surface for profiles.
      operations:
      - method: GET
        name: listprofiles
        description: List profiles
        call: exchange-profiles.listprofiles
        with:
          active: rest.active
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/profiles/transfer
      name: profiles-transfer
      description: REST surface for profiles-transfer.
      operations:
      - method: POST
        name: transferbetweenprofiles
        description: Transfer between profiles
        call: exchange-profiles.transferbetweenprofiles
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/profiles/{profile-id}
      name: profiles-profile-id
      description: REST surface for profiles-profile_id.
      operations:
      - method: GET
        name: getprofile
        description: Get profile
        call: exchange-profiles.getprofile
        with:
          profile_id: rest.profile_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: exchange-profiles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Coinbase Exchange API — Profiles. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-profiles
      description: List profiles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: exchange-profiles.listprofiles
      with:
        active: tools.active
      outputParameters:
      - type: object
        mapping: $.
    - name: transfer-between-profiles
      description: Transfer between profiles
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: exchange-profiles.transferbetweenprofiles
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-profile
      description: Get profile
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: exchange-profiles.getprofile
      with:
        profile_id: tools.profile_id
      outputParameters:
      - type: object
        mapping: $.
