naftiko: 1.0.0-alpha2
info:
  label: Coinbase Prime API — Assets
  description: 'Coinbase Prime API — Assets. 1 operations. Lead operation: List products. Self-contained Naftiko capability
    covering one Coinbase business surface.'
  tags:
  - Coinbase
  - Assets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COINBASE_API_KEY: COINBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: prime-assets
    baseUri: https://api.prime.coinbase.com/v1
    description: Coinbase Prime API — Assets business capability. Self-contained, no shared references.
    resources:
    - name: portfolios-portfolio_id-products
      path: /portfolios/{portfolio_id}/products
      operations:
      - name: listproducts
        method: GET
        description: List products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-CB-ACCESS-KEY
      value: '{{env.COINBASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: prime-assets-rest
    port: 8080
    description: REST adapter for Coinbase Prime API — Assets. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/portfolios/{portfolio-id}/products
      name: portfolios-portfolio-id-products
      description: REST surface for portfolios-portfolio_id-products.
      operations:
      - method: GET
        name: listproducts
        description: List products
        call: prime-assets.listproducts
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: prime-assets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Coinbase Prime API — Assets. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-products
      description: List products
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: prime-assets.listproducts
      outputParameters:
      - type: object
        mapping: $.
