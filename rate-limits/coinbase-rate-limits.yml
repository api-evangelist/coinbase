specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Coinbase
providerId: coinbase
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Rate Limiting
  - Cryptocurrency
  - Trading
description: Coinbase Advanced Trade API enforces separate per-user (private) and per-IP (public) limits
  for REST, plus higher per-IP limits for WebSocket. Limits may tighten dynamically during high-volatility
  periods. Identical model is used for the Coinbase Exchange API.
sources:
  - https://docs.cloud.coinbase.com/advanced-trade/docs/rest-api-rate-limits
  - https://docs.cloud.coinbase.com/advanced-trade/docs/ws-rate-limits
  - https://docs.cdp.coinbase.com/exchange/rest-api/rate-limits
responseCodes:
  throttled: 429
limits:
  - name: Advanced Trade REST — private endpoints
    scope: user
    metric: requests_per_second
    limit: 30
    timeFrame: second
    notes: Throttled per authenticated user; can tighten during high-volume periods.
  - name: Advanced Trade REST — public endpoints
    scope: IP
    metric: requests_per_second
    limit: 10
    timeFrame: second
  - name: Advanced Trade WebSocket — connections
    scope: IP
    metric: connections_per_second
    limit: 750
    timeFrame: second
  - name: Advanced Trade WebSocket — unauthenticated messages
    scope: IP
    metric: requests_per_second
    limit: 8
    timeFrame: second
policies:
  - name: Backoff
    description: Honor 429 with exponential backoff and jitter.
  - name: Dynamic throttling
    description: Limits may tighten during periods of elevated trading volume; clients should not assume
      static ceilings.
  - name: Public vs private scope
    description: Public market-data endpoints share an IP-bound bucket; authenticated trading endpoints
      use a per-user bucket.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
