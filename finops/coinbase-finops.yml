specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Coinbase
providerId: coinbase
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Cryptocurrency
  - Trading
description: 'FOCUS-aligned FinOps for Coinbase: per-trade maker/taker take rates that scale by 30-day
  USD volume. API access itself is free; cost is realized at trade execution.'
sources:
  - https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/advanced-trade-fees
  - https://docs.cdp.coinbase.com/advanced-trade/docs/welcome
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Coinbase, Inc.
serviceCategory: Financial Services
billingModel:
  pricingCategory: Take Rate
  billingFrequency: Continuous Settlement
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Coinbase Advanced Trade
  ServiceCategory: Financial Services
  ProviderName: Coinbase
  PublisherName: Coinbase, Inc.
  InvoiceIssuerName: Coinbase, Inc.
  BillingCurrency: USD
meters:
  - name: maker_volume
    unit: USD
    aggregation: sum
    dimensions:
      - product_id
      - fee_tier
      - stable_pair_flag
  - name: taker_volume
    unit: USD
    aggregation: sum
    dimensions:
      - product_id
      - fee_tier
  - name: maker_fees
    unit: USD
    aggregation: sum
    dimensions:
      - product_id
      - fee_tier
  - name: taker_fees
    unit: USD
    aggregation: sum
    dimensions:
      - product_id
      - fee_tier
  - name: rolling_30d_volume
    unit: USD
    aggregation: max
    dimensions:
      - account
principles:
  - name: Visibility
    description: Pull executed-trade fee data from the Advanced Trade /orders/historical/fills endpoint;
      track 30-day rolling USD volume to anticipate tier transitions.
  - name: Allocation
    description: Tag orders with client_order_id metadata to attribute trading PnL and fees to strategy,
      desk, or product.
  - name: Optimization
    description: Use limit orders to qualify for maker pricing; route through 22 stable pairs (0.00% maker)
      where possible; consolidate volume across one entity to reach higher Advanced tiers; apply for fee
      upgrade program above $100M monthly volume.
  - name: Accountability
    description: Trading desk owns fee tier; finance reconciles maker/taker fees against fills nightly.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
