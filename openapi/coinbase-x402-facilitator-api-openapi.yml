      - jsonrpc
    x402SupportedPaymentKind:
      type: object
      description: The supported payment kind for the x402 protocol. A kind is comprised of a scheme and a network, which together uniquely identify a way to move money on the x402 protocol. For more details, please see [x402 Schemes](https://github.com/coinbase/x402?tab=readme-ov-file#schemes).
      properties:
        x402Version:
          $ref: '#/components/schemas/X402Version'
        scheme:
          type: string
          description: The scheme of the payment protocol.
          enum:
          - exact
          - upto
          - batch-settlement
          example: exact
        network:
          type: string
          description: 'The network of the blockchain. The format corresponds to the `x402Version` of the enclosing `x402SupportedPaymentKind`: v1 uses human-readable names (see `X402V1Network`); v2 uses CAIP-2 chain IDs (see `X402V2Network`).'
          example: base
          enum:
          - base-sepolia
          - base
          - solana-devnet
          - solana
          - eip155:8453
          - eip155:84532
          - eip155:137
          - eip155:42161
          - eip155:480
          - eip155:4801
          - solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
          - solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
        extra:
          type: object
          description: "The optional additional scheme-specific payment info.\nCommon scheme-specific fields:\n  - `exact` on Solana: `feePayer` — the base58-encoded Solana address that pays transaction fees.\n  - `upto` on EVM: `name`, `version`, and `facilitatorAddress` — the EVM address of the facilitator that the client must bind into the Permit2 witness when constructing the payment payload.\n  - `batch-settlement` on EVM: `name`, `version`, `receiverAuthorizer` (the EVM address authorized to sign claim batches), `withdrawDelay` (channel non-cooperative withdraw delay in seconds, 900–2,592,000), and optionally `assetTransferMethod` (e.g., `\"eip3009\"`)."
          additionalProperties: true
          example:
            feePayer: HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
      required:
