    x402V1PaymentPayload:
      type: object
      title: x402V1PaymentPayload
      description: The x402 v1 protocol payment payload. Uses human-readable network names and requires `scheme` and `network` alongside the inner `payload` object.
      properties:
        x402Version:
          allOf:
          - $ref: '#/components/schemas/X402Version'
