    x402PaymentPayload:
      type: object
      description: 'The x402 protocol payment payload that the client attaches to x402-paid API requests to the resource server in the PAYMENT-SIGNATURE header.

        For EVM networks, smart account signatures can be longer than 65 bytes.'
