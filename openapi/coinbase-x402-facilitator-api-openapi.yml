    x402SettleError:
      description: Unsuccessful payment settlement on the x402 protocol.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/x402SettlePaymentRejection'
          examples:
            unsuccessful_settlement:
              value:
                success: false
                errorReason: insufficient_funds
                errorMessage: Insufficient funds
                payer: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
    BadGatewayError:
      description: Bad gateway.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bad_gateway:
              value:
                errorType: bad_gateway
                errorMessage: Bad gateway. Please try again later.
    x402SettleResponse:
      description: Successfully settled payment on the x402 protocol.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                description: Indicates whether the payment settlement is successful.
                example: false
              errorReason:
                $ref: '#/components/schemas/x402SettleErrorReason'
              errorMessage:
                type: string
                description: The message describing the error reason.
                example: Insufficient funds
              payer:
                allOf:
                - $ref: '#/components/schemas/BlockchainAddress'
                description: 'The onchain address of the client that is paying for the resource.


                  For EVM networks, the payer will be a 0x-prefixed, checksum EVM address.


                  For Solana-based networks, the payer will be a base58-encoded Solana address.'
                example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
              transaction:
                type: string
                description: 'The transaction of the settlement.

                  For EVM networks, the transaction will be a 0x-prefixed, EVM transaction hash.

                  For Solana-based networks, the transaction will be a base58-encoded Solana signature.'
                pattern: ^(0x[a-fA-F0-9]{64}|[1-9A-HJ-NP-Za-km-z]{87,88})$
                example: '0x89c91c789e57059b17285e7ba1716a1f5ff4c5dace0ea5a5135f26158d0421b9'
              network:
                type: string
                description: The network where the settlement occurred.
                example: base
              amount:
                type: string
                description: The amount that was settled, in atomic units.
                example: '1000000'
              extra:
                type: object
                description: Optional scheme-specific success metadata returned by the facilitator.
                additionalProperties: true
                example:
                  chargedAmount: '1000000'
                  channelState:
                    channelId: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
                    balance: '9000000'
                    totalClaimed: '1000000'
                    withdrawRequestedAt: 0
                    refundNonce: '0'
                  voucherState:
                    signedMaxClaimable: '1000000'
                    signature: '0xf3746613c2d920b5fdabc0856f2aeb2d4f88ee6037b8cc5d04a71a4462f134801234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1b'
            required:
            - success
            - payer
            - transaction
            - network
    ServiceUnavailableError:
