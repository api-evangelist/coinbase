openapi: 3.2.0
info:
  title: Coinbase Developer Platform End User Account Management API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: End User Account Management
  x-audience: public
  x-slo-tier:
    tier: ga
  description: 'The End User Account Management APIs enable developers to manage the accounts belonging to their end users. End user accounts are typically created by end users themselves when they sign in to the developer''s application via the CDP Web SDK. However, developers also have the option of creating end user accounts on behalf of their end users. Critically, developers do not have the ability to sign transactions or messages on behalf of the end user; only end users can do this.


    End User Account Management APIs are accessed by the developer''s servers and authenticated by the developer''s CDP API key.'
paths:
  /v2/end-users:
    post:
      summary: Create end user
      description: 'Creates an end user. An end user is an entity that can own CDP EVM accounts, EVM smart accounts, and/or Solana accounts. 1 or more authentication methods must be associated with an end user. By default, no accounts are created unless the optional `evmAccount` and/or `solanaAccount` fields are provided.

        This API is intended to be used by the developer''s own backend, and is authenticated using the developer''s CDP API key.'
      operationId: createEndUser
      tags:
      - End User Account Management
      x-audience: public
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XWalletAuth'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  description: 'A stable, unique identifier for the end user. The `userId` must be unique across all end users in the developer''s CDP Project. It must be between 1 and 100 characters long and can only contain alphanumeric characters and hyphens.


                    If `userId` is not provided in the request, the server will generate a random UUID.'
                  type: string
                  pattern: ^[a-zA-Z0-9-]{1,100}$
                  example: e051beeb-7163-4527-a5b6-35e301529ff2
                authenticationMethods:
                  $ref: '#/components/schemas/AuthenticationMethods'
                evmAccount:
                  type: object
                  description: Configuration for creating an EVM account for the end user.
                  properties:
                    createSmartAccount:
                      type: boolean
                      description: If true, creates an EVM smart account and a default EVM EOA account as the owner. If false, only a EVM EOA account is created.
                      default: false
                      example: true
                    enableSpendPermissions:
                      type: boolean
                      description: If true, enables spend permissions for the EVM smart account.
                      example: true
                solanaAccount:
                  type: object
                  description: Configuration for creating a Solana account for the end user.
                  properties:
                    createSmartAccount:
                      type: boolean
                      description: Only false is a valid option since currently smart accounts on Solana are not supported.
                      default: false
                      example: false
              required:
              - authenticationMethods
            examples:
              default_behavior:
                summary: Default (no accounts created)
                value:
                  authenticationMethods:
                  - type: email
                    email: user@example.com
              evm_only:
                summary: EVM account only
                value:
                  authenticationMethods:
                  - type: email
                    email: user@example.com
                  evmAccount: {}
              evm_with_smart_account:
                summary: EVM only with smart account
                value:
                  authenticationMethods:
                  - type: email
                    email: user@example.com
                  evmAccount:
                    createSmartAccount: true
              solana_only:
                summary: Solana account only
                value:
                  authenticationMethods:
                  - type: sms
                    phoneNumber: '+15555551234'
                  solanaAccount:
                    createSmartAccount: false
              evm_and_solana:
                summary: Both EVM and Solana accounts
                value:
                  authenticationMethods:
                  - type: sms
                    phoneNumber: '+15555551234'
                  evmAccount:
                    createSmartAccount: true
                  solanaAccount:
                    createSmartAccount: false
      responses:
        '201':
          description: Successfully created end user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndUser'
              examples:
                default_no_accounts:
                  summary: Default behavior - No accounts created
                  value:
                    userId: user-001
                    authenticationMethods:
                    - type: email
                      email: user@example.com
                    evmAccounts: []
                    evmAccountObjects: []
                    evmSmartAccounts: []
                    evmSmartAccountObjects: []
                    solanaAccounts: []
                    solanaAccountObjects: []
                    createdAt: '2025-11-17T10:00:00Z'
                evm_smart_account_only:
                  summary: EVM smart account only
                  value:
                    userId: user-003
                    authenticationMethods:
                    - type: email
                      email: user@example.com
                    evmAccounts:
                    - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                    evmAccountObjects:
                    - address: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                      createdAt: '2025-11-17T10:00:00Z'
                    evmSmartAccounts:
                    - '0x842d35Cc6634C0532925a3b844Bc454e4438f55f'
                    evmSmartAccountObjects:
                    - address: '0x842d35Cc6634C0532925a3b844Bc454e4438f55f'
                      ownerAddresses:
                      - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                      createdAt: '2025-11-17T10:00:00Z'
                    solanaAccounts: []
                    solanaAccountObjects: []
                    createdAt: '2025-11-17T10:00:00Z'
                solana_only:
                  summary: Solana account only
                  value:
                    userId: user-004
                    authenticationMethods:
                    - type: sms
                      phoneNumber: '+15555551234'
                    evmAccounts: []
                    evmAccountObjects: []
                    evmSmartAccounts: []
                    evmSmartAccountObjects: []
                    solanaAccounts:
                    - HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
                    solanaAccountObjects:
                    - address: HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
                      createdAt: '2025-11-17T10:00:00Z'
                    createdAt: '2025-11-17T10:00:00Z'
                evm_no_smart_account:
                  summary: EVM without smart account
                  value:
                    userId: user-004
                    authenticationMethods:
                    - type: email
                      email: user@example.com
                    evmAccounts:
                    - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                    evmAccountObjects:
                    - address: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                      createdAt: '2025-11-17T10:00:00Z'
                    evmSmartAccounts: []
                    evmSmartAccountObjects: []
                    solanaAccounts: []
                    solanaAccountObjects: []
                    createdAt: '2025-11-17T10:00:00Z'
                multiple_accounts:
                  summary: End user with multiple accounts created
                  value:
                    userId: user-005
                    authenticationMethods:
                    - type: email
                      email: user@example.com
                    evmAccounts:
                    - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                    - '0x8F2A9B5C3D4E6F7A8B9C0D1E2F3A4B5C6D7E8F9A'
                    - '0xA1B2C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7F8A9B0'
                    evmAccountObjects:
                    - address: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                      createdAt: '2025-11-17T10:00:00Z'
                    - address: '0x8F2A9B5C3D4E6F7A8B9C0D1E2F3A4B5C6D7E8F9A'
                      createdAt: '2025-11-17T10:05:00Z'
                    - address: '0xA1B2C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7F8A9B0'
                      createdAt: '2025-11-17T10:10:00Z'
                    evmSmartAccounts:
                    - '0x842d35Cc6634C0532925a3b844Bc454e4438f55f'
                    - '0x9D3E4F5A6B7C8D9E0F1A2B3C4D5E6F7A8B9C0D1E'
                    evmSmartAccountObjects:
                    - address: '0x842d35Cc6634C0532925a3b844Bc454e4438f55f'
                      ownerAddresses:
                      - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                      createdAt: '2025-11-17T10:02:00Z'
                    - address: '0x9D3E4F5A6B7C8D9E0F1A2B3C4D5E6F7A8B9C0D1E'
                      ownerAddresses:
                      - '0x8F2A9B5C3D4E6F7A8B9C0D1E2F3A4B5C6D7E8F9A'
                      createdAt: '2025-11-17T10:07:00Z'
                    solanaAccounts:
                    - HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
                    - 9ZN8wT6gKxLmJvP4rQnYt7VxKwL3mN9rT8Qx2WzJpK5s
                    solanaAccountObjects:
                    - address: HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
                      createdAt: '2025-11-17T10:15:00Z'
                    - address: 9ZN8wT6gKxLmJvP4rQnYt7VxKwL3mN9rT8Qx2WzJpK5s
                      createdAt: '2025-11-17T10:20:00Z'
                    createdAt: '2025-11-17T10:00:00Z'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: At least one authentication method must be provided.
                solana_smart_account_not_supported:
                  value:
                    errorType: invalid_request
                    errorMessage: The request contains one or more unsupported options.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    errorType: unauthorized
                    errorMessage: Wallet authentication error.
        '402':
          $ref: '#/components/responses/PaymentMethodRequiredError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      x-audience: public
      summary: List end users
      description: 'Lists the end users belonging to the developer''s CDP Project.

        By default, the response is sorted by creation date in ascending order and paginated to 20 users per page.'
      operationId: listEndUsers
      tags:
      - End User Account Management
      security:
      - apiKeyAuth: []
      parameters:
      - name: pageSize
        description: The number of end users to return per page.
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        example: 10
      - name: pageToken
        description: The token for the desired page of end users. Will be empty if there are no more end users to fetch.
        in: query
        required: false
        schema:
          type: string
        example: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
      - name: sort
        description: Sort end users. Defaults to ascending order (oldest first).
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - createdAt=asc
            - createdAt=desc
        example:
        - createdAt=asc
        style: form
        explode: false
      responses:
        '200':
          description: Successfully retrieved end users.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - endUsers
                  properties:
                    endUsers:
                      type: array
                      description: The list of end users.
                      items:
                        $ref: '#/components/schemas/EndUser'
                - $ref: '#/components/schemas/ListResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid project ID.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/end-users/auth/validate-token:
    post:
      x-audience: public
      summary: Validate end user access token
      description: 'Validates the end user''s access token and returns the end user''s information. Returns an error if the access token is invalid or expired.


        This API is intended to be used by the developer''s own backend, and is authenticated using the developer''s CDP API key.'
      operationId: validateEndUserAccessToken
      tags:
      - End User Account Management
      security:
      - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The request body for a developer to verify an end user's access token.
              properties:
                accessToken:
                  type: string
                  description: The access token in JWT format to verify.
                  example: eyJhbGciOiJFUzI1NiIsImtpZCI6IjA1ZGNmYTU1LWY1NzktNDg5YS1iNThhLTFlMDI5Nzk0N2VlNiIsInR5cCI6IkpXVCJ9..1SU0pOy-WR002qUw4hd_UmZWRSLz-ZL6v7PvQvZMKVE6a51x_tqeUeRGaTGuYl1whg0eccMObmK7FqXKRH6E4g
              required:
              - accessToken
      responses:
        '200':
          description: Confirms that the access token is valid and returns the end user's information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndUser'
        '400':
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Missing access token.
        '401':
          description: Request is not properly authenticated, or the access token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    errorType: unauthorized
                    errorMessage: 'Invalid JWT issuer: not-cdp-api, expected: cdp-api.'
        '404':
          description: End user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: End user not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/end-users/{userId}:
    get:
      x-audience: public
      summary: Get end user
      description: 'Gets an end user by ID.


        This API is intended to be used by the developer''s own backend, and is authenticated using the developer''s CDP API key.'
      operationId: getEndUser
      tags:
      - End User Account Management
      security:
      - apiKeyAuth: []
      parameters:
      - name: userId
        in: path
        required: true
        description: The ID of the end user to get.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,100}$
        example: e051beeb-7163-4527-a5b6-35e301529ff2
      responses:
        '200':
          description: Successfully got end user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndUser'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: End user with the given ID not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/end-users/lookup:
    get:
      x-audience: public
      summary: Look up end users by identity
      description: 'Looks up end users. Exactly one lookup type must be provided per request:


        - **email**: searches across all email-based authentication methods

        (email, Google, Apple, GitHub). May return multiple end users if the

        same email address appears across different auth methods.


        - **oauthProvider + oauthSubject**: looks up a user by their OAuth

        provider and subject (the `sub` claim from the provider''s ID token).

        Both params must be provided together.


        - **phoneNumber**: looks up a user by their SMS-verified phone number.

        - **siweAddress**: looks up a user by the Ethereum address they authenticated

        with via Sign In With Ethereum (EIP-4361).


        Returns all matching end users. If no end users match, an empty array is returned.


        This API is intended to be used by the developer''s own backend, and is authenticated using the developer''s CDP API key.'
      operationId: lookupEndUser
      tags:
      - End User Account Management
      security:
      - apiKeyAuth: []
      parameters:
      - name: email
        in: query
        required: false
        description: The email address to search for across all email-based authentication methods.
        schema:
          $ref: '#/components/schemas/Email'
        example: user@example.com
      - name: oauthProvider
        in: query
        required: false
        description: The OAuth provider to search by. Must be provided together with oauthSubject.
        schema:
          $ref: '#/components/schemas/OAuth2ProviderType'
        example: google
      - name: oauthSubject
        in: query
        required: false
        description: The OAuth subject (the `sub` claim from the provider's ID token). Must be provided together with oauthProvider.
        schema:
          type: string
        example: '1234567890'
      - name: phoneNumber
        in: query
        required: false
        description: The E.164-formatted phone number to search for. Must be URL-encoded when passed as a query parameter (e.g. `+14155552671` → `%2B14155552671`).
        schema:
          $ref: '#/components/schemas/PhoneNumber'
        example: '+14155552671'
      - name: siweAddress
        in: query
        required: false
        description: The ERC-55 checksummed Ethereum address to search for. Looks up a user by the address they authenticated with via Sign In With Ethereum (EIP-4361).
        schema:
          $ref: '#/components/schemas/BlockchainAddress'
        example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
      responses:
        '200':
          description: Successfully looked up end users.
          content:
            application/json:
              schema:
                type: object
                required:
                - endUsers
                properties:
                  endUsers:
                    type: array
                    description: The list of end users matching the lookup.
                    items:
                      $ref: '#/components/schemas/EndUser'
              examples:
                email_match:
                  summary: End user found by email
                  value:
                    endUsers:
                    - userId: user-001
                      authenticationMethods:
                      - type: email
                        email: user@example.com
                      evmAccounts: []
                      evmAccountObjects: []
                      evmSmartAccounts: []
                      evmSmartAccountObjects: []
                      solanaAccounts: []
                      solanaAccountObjects: []
                      createdAt: '2025-11-17T10:00:00Z'
                multiple_email_matches:
                  summary: Multiple end users with same email across auth methods
                  value:
                    endUsers:
                    - userId: user-001
                      authenticationMethods:
                      - type: email
                        email: user@example.com
                      evmAccounts: []
                      evmAccountObjects: []
                      evmSmartAccounts: []
                      evmSmartAccountObjects: []
                      solanaAccounts: []
                      solanaAccountObjects: []
                      createdAt: '2025-11-17T10:00:00Z'
                    - userId: user-002
                      authenticationMethods:
                      - type: google
                        sub: google-sub-123
                        email: user@example.com
                      evmAccounts: []
                      evmAccountObjects: []
                      evmSmartAccounts: []
                      evmSmartAccountObjects: []
                      solanaAccounts: []
                      solanaAccountObjects: []
                      createdAt: '2025-11-17T11:00:00Z'
                oauth_match:
                  summary: End user found by OAuth subject
                  value:
                    endUsers:
                    - userId: user-003
                      authenticationMethods:
                      - type: google
                        sub: '1234567890'
                        email: user@example.com
                      evmAccounts: []
                      evmAccountObjects: []
                      evmSmartAccounts: []
                      evmSmartAccountObjects: []
                      solanaAccounts: []
                      solanaAccountObjects: []
                      createdAt: '2025-11-17T12:00:00Z'
                phone_match:
                  summary: End user found by phone number
                  value:
                    endUsers:
                    - userId: user-004
                      authenticationMethods:
                      - type: sms
                        phoneNumber: '+14155552671'
                      evmAccounts: []
                      evmAccountObjects: []
                      evmSmartAccounts: []
                      evmSmartAccountObjects: []
                      solanaAccounts: []
                      solanaAccountObjects: []
                      createdAt: '2025-11-17T13:00:00Z'
                siwe_match:
                  summary: End user found by SIWE address
                  value:
                    endUsers:
                    - userId: user-005
                      authenticationMethods:
                      - type: siwe
                        address: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                      evmAccounts: []
                      evmAccountObjects: []
                      evmSmartAccounts: []
                      evmSmartAccountObjects: []
                      solanaAccounts: []
                      solanaAccountObjects: []
                      createdAt: '2025-11-17T14:00:00Z'
                no_matches:
                  summary: No end users found
                  value:
                    endUsers: []
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_lookup_param:
                  summary: No lookup parameter provided
                  value:
                    errorType: invalid_request
                    errorMessage: 'Exactly one lookup type must be provided: email, phoneNumber, siweAddress, or oauthProvider+oauthSubject.'
                multiple_lookup_params:
                  summary: Multiple lookup parameters provided
                  value:
                    errorType: invalid_request
                    errorMessage: 'Exactly one lookup type must be provided: email, phoneNumber, siweAddress, or oauthProvider+oauthSubject.'
                oauth_missing_subject:
                  summary: oauthProvider provided without oauthSubject
                  value:
                    errorType: invalid_request
                    errorMessage: oauthProvider and oauthSubject must be provided together.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/end-users/{userId}/evm:
    post:
      summary: Add EVM account to end user
      description: 'Adds a new EVM EOA account to an existing end user. End users can have up to 10 EVM accounts.

        This API is intended to be used by the developer''s own backend, and is authenticated using the developer''s CDP API key.'
      operationId: addEndUserEvmAccount
      tags:
      - End User Account Management
      x-audience: public
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/EndUserUserId'
      - $ref: '#/components/parameters/XWalletAuth'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            examples:
              default:
                summary: Create EVM EOA account
                value: {}
      responses:
        '201':
          description: Successfully added EVM account to end user.
          content:
            application/json:
              schema:
                type: object
                required:
                - evmAccount
                properties:
                  evmAccount:
                    $ref: '#/components/schemas/EndUserEvmAccount'
              examples:
                default:
                  summary: EVM EOA account created
                  value:
                    evmAccount:
                      address: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                      createdAt: '2025-11-17T10:00:00Z'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                max_accounts_reached:
                  value:
                    errorType: invalid_request
                    errorMessage: Maximum number of EVM accounts (10) reached for this end user.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    errorType: unauthorized
                    errorMessage: Wallet authentication error.
        '402':
          $ref: '#/components/responses/PaymentMethodRequiredError'
        '404':
          description: End user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: End user with the given ID not found.
        '422':
