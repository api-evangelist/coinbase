      - CustodyCrypto
      - CustodyFiat
      - CustodyStablecoin
      - TradeCrypto
      - TradeStablecoin
      - TransferCrypto
      - TransferFiat
      - TransferStablecoin
      example: custodyCrypto
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      description: A phone number in [E.164](https://en.wikipedia.org/wiki/E.164) format.
      example: '+12055555555'
    EndUserEvmAccount:
