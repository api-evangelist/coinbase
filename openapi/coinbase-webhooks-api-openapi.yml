openapi: 3.2.0
info:
  title: Coinbase Developer Platform Webhooks API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Webhooks
  x-audience: public
  x-slo-tier:
    tier: ga
  description: Subscribe to real-time events across CDP products. Monitor onchain activity on Base mainnet, track onramp/offramp transactions, and receive instant notifications for wallet events.
paths:
  /v2/data/webhooks/subscriptions:
    get:
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      x-audience: public
      x-required-permissions:
        permissions:
        - accounts:read@entity
        enforcement: any
      description: 'Retrieve a paginated list of webhook subscriptions for the authenticated project.

        Returns subscriptions for all CDP product events (onchain, onramp/offramp, wallet, etc.)

        in descending order by creation time.


        ### Use Cases

        - Monitor all active webhook subscriptions across CDP products

        - Audit webhook configurations

        - Manage subscription lifecycle'
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      parameters:
      - name: pageSize
        description: The number of subscriptions to return per page.
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        example: 10
      - name: pageToken
        description: The token for the next page of subscriptions, if any.
        in: query
        required: false
        schema:
          type: string
        example: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
      responses:
        '200':
          description: Webhook subscriptions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionListResponse'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid request.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limit_exceeded:
                  value:
                    errorType: rate_limit_exceeded
                    errorMessage: Rate limit exceeded. Please try again in a few seconds.
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createWebhookSubscription
      summary: Create webhook subscription
      x-audience: public
      x-required-permissions:
        permissions:
        - accounts:write@entity
        enforcement: any
      description: 'Subscribe to real-time events across CDP products. A webhook subscription provides a `targetURL` and other relevant endpoint configuration to enable receiving webhooks when events occur.


        An entity can have up to 100 webhook subscriptions. Once this limit is reached, new webhook subscription creation requests return a `400` error with `errorType: subscription_limit_exceeded`.


        ### Webhook Signature Verification


        All webhooks include an HMAC-SHA256 signed header for security. The signature is signed with the secret that is returned in the `secret` field when creating a subscription.


        Do not lose the secret, as you will not be able to recreate it. If you lose the secret, you will need to create a new subscription.


        See the verification guide for implementation details.'
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionRequest'
            examples:
              onchain_liquidity_pool:
                summary: 'Onchain: Monitor liquidity pool burns'
                value:
                  description: Liquidity pool burn events.
                  eventTypes:
                  - onchain.activity.detected
                  labels:
                    network: base-mainnet
                    contract_address: '0xcd1f9777571493aeacb7eae45cd30a226d3e612d'
                    event_name: Burn
                  target:
                    url: https://api.example.com/webhooks
                  isEnabled: true
              wallet_outgoing_transactions:
                summary: 'Wallet: Monitor outgoing transactions'
                value:
                  description: Outgoing transactions.
                  eventTypes:
                  - wallet.activity.detected
                  labels:
                    network: base-mainnet
                    params.from: '0xB7f5BF799fB265657c628ef4a13f90f83a3a616A'
                  target:
                    url: https://api.example.com/webhooks
                  isEnabled: true
              health_status_updates:
                summary: 'Health: Monitor webhook service status'
                value:
                  description: Webhook service status updates.
                  eventTypes:
                  - health.status.updated
                  labels:
                    service: webhooks
                  target:
                    url: https://api.example.com/webhooks
                  isEnabled: true
      responses:
        '201':
          description: Webhook subscription created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionResponse'
        '400':
          description: Invalid subscription configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_webhook_url:
                  value:
                    errorType: invalid_webhook_url
                    errorMessage: Webhook URL validation failed.
                invalid_webhook_headers:
                  value:
                    errorType: invalid_webhook_headers
                    errorMessage: header "Cookie" is not allowed
                incompatible_event_types:
                  value:
                    errorType: incompatible_event_types
                    errorMessage: Cannot mix event types. Please create separate subscriptions for these event types.
                subscription_limit_exceeded:
                  value:
                    errorType: subscription_limit_exceeded
                    errorMessage: Maximum subscription limit reached (100 subscriptions per project). Please delete unused subscriptions before creating new ones.
                empty_event_types:
                  value:
                    errorType: invalid_request
                    errorMessage: 'At least one event type is required. See available types: https://docs.cdp.coinbase.com/api-reference/v2/rest-api/webhooks/create-webhook-subscription'
                labels_required:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels'' is required.'
                required_label:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.contract_address'' is required.'
                unsupported_label_value:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.network'' contains an unsupported value.'
                unsupported_label:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.unknown'' is not supported.'
                too_many_labels:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels'' accepts at most 20 properties.'
                labels_schema_mismatch:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels'' must match one of the allowed schemas.'
                invalid_label_format:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.wallet_addresses'' has an invalid format.'
                label_too_long:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.wallet_addresses'' must contain at most 4299 characters.'
                labels_not_allowed:
                  value:
                    errorType: invalid_request
                    errorMessage: request body does not satisfy the allowed schema.
                unsupported_event_type:
                  value:
                    errorType: invalid_request
                    errorMessage: '''eventTypes.0'' contains an unsupported value.'
                invalid_metadata_key:
                  value:
                    errorType: invalid_request
                    errorMessage: '''metadata'' contains an invalid property name.'
                metadata_value_too_short:
                  value:
                    errorType: invalid_request
                    errorMessage: '''metadata.key'' must contain at least 1 character.'
                metadata_value_too_long:
                  value:
                    errorType: invalid_request
                    errorMessage: '''metadata.key'' must contain at most 50 characters.'
                too_many_metadata_entries:
                  value:
                    errorType: invalid_request
                    errorMessage: '''metadata'' accepts at most 10 properties.'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limit_exceeded:
                  value:
                    errorType: rate_limit_exceeded
                    errorMessage: Rate limit exceeded. Please try again in a few seconds.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/data/webhooks/subscriptions/{subscriptionId}:
    get:
      operationId: getWebhookSubscription
      summary: Get webhook subscription
      x-audience: public
      x-required-permissions:
        permissions:
        - accounts:read@entity
        enforcement: any
      description: 'Retrieve detailed information about a specific webhook subscription including

        configuration, status, creation timestamp, and webhook signature secret.


        ### Response Includes

        - Subscription configuration and filters

        - Target URL and custom headers

        - Webhook signature secret for verification

        - Creation timestamp and status'
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Unique identifier for the webhook subscription.
        schema:
          type: string
          format: uuid
          pattern: ^[a-f0-9\-]{36}$
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Webhook subscription details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Webhook subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                subscription_not_found:
                  value:
                    errorType: not_found
                    errorMessage: 'Webhook subscription not found: 123e4567-e89b-12d3-a456-426614174000'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limit_exceeded:
                  value:
                    errorType: rate_limit_exceeded
                    errorMessage: Rate limit exceeded. Please try again in a few seconds.
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateWebhookSubscription
      summary: Update webhook subscription
      x-audience: public
      x-required-permissions:
        permissions:
        - accounts:write@entity
        enforcement: any
      description: 'Update an existing webhook subscription''s configuration including

        event types, target URL, filtering criteria, and enabled status.

        All required fields must be provided, even if they are not being changed.


        ### Common Updates

        - Change target URL or headers

        - Add/remove event type filters

        - Update multi-label filtering criteria

        - Enable/disable subscription'
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Unique identifier for the webhook subscription.
        schema:
          type: string
          format: uuid
          pattern: ^[a-f0-9\-]{36}$
        example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest'
      responses:
        '200':
          description: Webhook subscription updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionResponse'
        '400':
          description: Invalid subscription update configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_webhook_url:
                  value:
                    errorType: invalid_webhook_url
                    errorMessage: Webhook URL validation failed.
                invalid_webhook_headers:
                  value:
                    errorType: invalid_webhook_headers
                    errorMessage: header "Cookie" is not allowed
                incompatible_event_types:
                  value:
                    errorType: incompatible_event_types
                    errorMessage: Cannot mix event types. Please create separate subscriptions for these event types.
                empty_event_types:
                  value:
                    errorType: invalid_request
                    errorMessage: 'At least one event type is required. See available types: https://docs.cdp.coinbase.com/api-reference/v2/rest-api/webhooks/create-webhook-subscription'
                labels_required:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels'' is required.'
                required_label:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.contract_address'' is required.'
                unsupported_label_value:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.network'' contains an unsupported value.'
                unsupported_label:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.unknown'' is not supported.'
                too_many_labels:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels'' accepts at most 20 properties.'
                labels_schema_mismatch:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels'' must match one of the allowed schemas.'
                invalid_label_format:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.wallet_addresses'' has an invalid format.'
                label_too_long:
                  value:
                    errorType: invalid_request
                    errorMessage: '''labels.wallet_addresses'' must contain at most 4299 characters.'
                labels_not_allowed:
                  value:
                    errorType: invalid_request
                    errorMessage: request body does not satisfy the allowed schema.
                unsupported_event_type:
                  value:
                    errorType: invalid_request
                    errorMessage: '''eventTypes.0'' contains an unsupported value.'
                invalid_metadata_key:
                  value:
                    errorType: invalid_request
                    errorMessage: '''metadata'' contains an invalid property name.'
                metadata_value_too_short:
                  value:
                    errorType: invalid_request
                    errorMessage: '''metadata.key'' must contain at least 1 character.'
                metadata_value_too_long:
                  value:
                    errorType: invalid_request
                    errorMessage: '''metadata.key'' must contain at most 50 characters.'
                too_many_metadata_entries:
                  value:
                    errorType: invalid_request
                    errorMessage: '''metadata'' accepts at most 10 properties.'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Webhook subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                subscription_not_found:
                  value:
                    errorType: not_found
                    errorMessage: 'Webhook subscription not found: 123e4567-e89b-12d3-a456-426614174000'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limit_exceeded:
                  value:
                    errorType: rate_limit_exceeded
                    errorMessage: Rate limit exceeded. Please try again in a few seconds.
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteWebhookSubscription
      summary: Delete webhook subscription
      x-audience: public
      x-required-permissions:
        permissions:
        - accounts:write@entity
        enforcement: any
      description: 'Permanently delete a webhook subscription and stop all event deliveries.

        This action cannot be undone.


        ### Important Notes

        - All webhook deliveries will cease immediately

        - Subscription cannot be recovered after deletion

        - Consider disabling instead of deleting for temporary pauses'
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Unique identifier for the webhook subscription.
        schema:
          type: string
          format: uuid
          pattern: ^[a-f0-9\-]{36}$
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '204':
          description: Webhook subscription deleted successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Webhook subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                subscription_not_found:
                  value:
                    errorType: not_found
                    errorMessage: Resource not found.
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limit_exceeded:
                  value:
                    errorType: rate_limit_exceeded
                    errorMessage: Rate limit exceeded. Please try again in a few seconds.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/data/webhooks/subscriptions/{subscriptionId}/events:
    get:
      operationId: listWebhookSubscriptionEvents
      summary: List webhook subscription events
      x-audience: public
      x-required-permissions:
        permissions:
        - accounts:read@entity
        enforcement: any
      description: 'Retrieve webhook event delivery attempts for a specific subscription.

        Returns event deliveries in descending order by creation time (newest first),

        including delivery status, retry count, and response details.


        ### Use Cases

        - Debug webhook delivery failures and inspect response codes

        - Monitor delivery status and retry counts

        - Audit event delivery history for a subscription

        - Verify that expected events were sent to webhook URLs


        ### Filtering

        Use optional query parameters to narrow results:

        - `eventId` — find a specific event by ID

        - `minCreatedAt` / `maxCreatedAt` — filter by time range

        - `eventTypeNames` — filter by event type (comma-separated)


        **Note:** Results are limited to the 50 most recent events (newest first). No pagination is supported.'
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Unique identifier for the webhook subscription.
        schema:
          type: string
          format: uuid
          pattern: ^[a-f0-9\-]{36}$
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: eventId
        in: query
        required: false
        description: Filter by a specific event ID.
        schema:
          type: string
          format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      - name: minCreatedAt
        in: query
        required: false
        description: Filter events created at or after this timestamp (RFC 3339 format).
        schema:
          type: string
          format: date-time
        example: '2025-01-15T00:00:00Z'
      - name: maxCreatedAt
        in: query
        required: false
        description: Filter events created at or before this timestamp (RFC 3339 format).
        schema:
          type: string
          format: date-time
        example: '2025-01-16T00:00:00Z'
      - name: eventTypeNames
        in: query
        required: false
        description: Filter by event type names (comma-separated).
        schema:
          type: string
        example: onchain.activity.detected
      responses:
        '200':
          description: Webhook events retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventListResponse'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid request.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Webhook subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                subscription_not_found:
                  value:
                    errorType: not_found
                    errorMessage: 'Webhook subscription not found: 123e4567-e89b-12d3-a456-426614174000'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limit_exceeded:
                  value:
                    errorType: rate_limit_exceeded
                    errorMessage: Rate limit exceeded. Please try again in a few seconds.
        '500':
          $ref: '#/components/responses/InternalServerError'
