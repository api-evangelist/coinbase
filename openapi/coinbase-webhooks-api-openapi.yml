        event_name: Burn
      - network: base-mainnet
        params.from: '0x3E16D476D8Df15e3E776EAa5A46f37EC44C830cD'
      - network: base-mainnet
        wallet_addresses: '0x3e16d476d8df15e3e776eaa5a46f37ec44c830cd'
      - service: webhooks
      - project: project_123e4567-e89b-12d3-a456-426614174000
      - entity: entity_123e4567-e89b-12d3-a456-426614174000
      - user_uuid: 123e4567-e89b-12d3-a456-426614174000
        sandbox: 'false'
