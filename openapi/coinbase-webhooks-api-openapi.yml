    WebhookRequestLabels:
      type: object
      description: 'String-valued filters supplied when creating or updating a webhook subscription.

        The subscription''s `eventTypes` determine whether labels are required and which

        label keys are accepted. A subscription accepts at most 20 client-supplied labels.


        #### Label Behavior


        An event must match ALL labels to fire to your subscription `targetURL`. When multiple labels are supplied, the event must match ALL labels to fire to your subscription `targetURL`.

        '
      additionalProperties:
        type: string
      examples:
      - network: base-mainnet
        contract_address: '0xcd1f9777571493aeacb7eae45cd30a226d3e612d'
        event_name: Burn
      - network: base-mainnet
        contract_address: '0xbac4a9428ea707c51f171ed9890c3c2fa810305d'
        event_name: PriceUpdated
      - network: base-mainnet
        contract_address: '0x45c6e6a47a711b14d8357d5243f46704904578e3'
        event_name: Deposit
    WebhookSubscriptionRequest:
      type: object
      if:
        properties:
          eventTypes:
            contains:
              const: onchain.activity.detected
      then:
        required:
        - labels
        properties:
          labels:
            $ref: '#/components/schemas/OnchainActivityWebhookLabels'
      else:
        if:
          properties:
            eventTypes:
              contains:
                const: wallet.activity.detected
        then:
          required:
          - labels
          properties:
            labels:
              $ref: '#/components/schemas/WalletActivityDetectedWebhookLabels'
        else:
          if:
            properties:
              eventTypes:
                contains:
                  const: wallet.activity.multi
          then:
            required:
            - labels
            properties:
              labels:
                $ref: '#/components/schemas/WalletActivityMultiWebhookLabels'
          else:
            if:
              properties:
                eventTypes:
                  contains:
                    pattern: ^health\.
            then:
              required:
              - labels
              properties:
                labels:
                  $ref: '#/components/schemas/HealthWebhookLabels'
            else:
              not:
                required:
                - labels
      description: 'Request to create a new webhook subscription with support for multi-label filtering.

        '
      properties:
        description:
          $ref: '#/components/schemas/WebhookDescription'
        eventTypes:
          type: array
          description: 'Types of events to subscribe to. Event types follow a dot-separated format:

            service.resource.verb (e.g., "onchain.activity.detected", "wallet.activity.detected", "onramp.transaction.created",

            "acceptance.payment_session.authorization_succeeded").

            The subscription will only receive events matching these types AND the label filter(s).

            '
          items:
            $ref: '#/components/schemas/EventType'
          example:
          - onchain.activity.detected
        isEnabled:
          type: boolean
          description: Whether the subscription is enabled.
          example: true
        target:
          $ref: '#/components/schemas/WebhookTarget'
        metadata:
          $ref: '#/components/schemas/WebhookMetadata'
        labels:
          $ref: '#/components/schemas/WebhookRequestLabels'
      required:
      - eventTypes
      - isEnabled
      - target
