openapi: 3.2.0
info:
  title: Coinbase Developer Platform Customers API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Customers
  x-audience: public
  x-slo-tier:
    tier: beta
  description: The Customers APIs enable developers to create and manage their end-user customers. Customers can be individuals or businesses and have various capabilities like sending/receiving fiat and crypto, trading, etc. Customer information includes KYC/compliance data, verification requirements, and capability management.
paths:
  /v2/customers:
    post:
      summary: Create a customer
      description: 'Create a new customer record. You can optionally request capabilities

        and submit verification requirements in the same request.


        This endpoint supports creating a customer with:

        - Minimal data (customer type only)

        - Capability requests

        - KYC data submission

        - Combined request for capability and required info for verification'
      operationId: createCustomer
      x-audience: public
      x-required-permissions:
        permissions:
        - customers:write@entity
        enforcement: any
      tags:
      - Customers
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            examples:
              createWithCapabilities:
                summary: Create customer with capability requests
                value:
                  type: individual
                  individual:
                    firstName: Jane
                    lastName: Doe
                    address:
                      line1: 500 Main St
                      city: Boston
                      state: MA
                      postCode: 02108
                      countryCode: US
                  capabilities:
                    custodyCrypto:
                      requested: true
                    transferCrypto:
                      requested: true
              createWithTosAcceptances:
                summary: Create customer and record Terms of Service acceptance
                value:
                  type: individual
                  individual:
                    firstName: Jane
                    lastName: Doe
                    address:
                      line1: 500 Main St
                      city: Boston
                      state: MA
                      postCode: 02108
                      countryCode: US
                  capabilities:
                    custodyCrypto:
                      requested: true
                    transferCrypto:
                      requested: true
                  tosAcceptances:
                  - versionId: us_individual_2026-05-29
                    language: en
                    acceptedAt: '2026-04-10T12:00:00Z'
              createWithTaxAttestations:
                summary: Create customer and record a tax attestation
                value:
                  type: individual
                  individual:
                    firstName: Jane
                    lastName: Doe
                    address:
                      line1: 500 Main St
                      city: Boston
                      state: MA
                      postCode: 02108
                      countryCode: US
                  capabilities:
                    transferFiat:
                      requested: true
                  taxAttestations:
                  - form: us_w9
                    isExemptBackupWithholding: true
                    edeliveryConsent: true
                    acceptedAt: '2026-04-17T20:00:00Z'
              createMinimal:
                summary: Create customer without capabilities
                value:
                  type: individual
                  individual: {}
      responses:
        '201':
          description: Customer created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customerId: customer_af2937b0-9846-4fe7-bfe9-ccc22d935114
                type: individual
                individual: {}
                capabilities:
                  custodyCrypto:
                    requested: true
                    status: pending
                  custodyFiat:
                    requested: false
                    status: unrequested
                  custodyStablecoin:
                    requested: false
                    status: unrequested
                  tradeCrypto:
                    requested: false
                    status: unrequested
                  tradeStablecoin:
                    requested: false
                    status: unrequested
                  transferCrypto:
                    requested: true
                    status: pending
                  transferFiat:
                    requested: false
                    status: unrequested
                  transferStablecoin:
                    requested: false
                    status: unrequested
                requirements:
                  firstName:
                    status: due
                    impact:
                    - custodyCrypto
                    - transferCrypto
                  lastName:
                    status: due
                    impact:
                    - custodyCrypto
                    - transferCrypto
                  ssnLast4:
                    status: due
                createdAt: '2026-01-10T14:25:00Z'
                updatedAt: '2026-01-10T14:25:00Z'
        '400':
          description: 'Invalid request. `unsupported_tos_language` is returned when a

            `tosAcceptances[].language` is not published for the matching

            `versionId` (i.e. not listed under `Customer.requirements.tos.tosVersions[].languages`).

            Other validation failures return `invalid_request`. See

            `x-error-instructions` on `ErrorType` for remediation steps;

            `errorMessage` carries human-readable detail. Missing Terms of

            Service acceptances are surfaced on `Customer.requirements.tos.tosVersions[]`

            (returned on success) rather than as an error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: Generic invalid request
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid customer creation request.
                unsupported_tos_language:
                  summary: A `tosAcceptances[].language` is not in the matching version's `languages`
                  value:
                    errorType: unsupported_tos_language
                    errorMessage: 'Terms of Service version ''us_individual_2026-05-29'' is not published in language ''fr''. Supported languages: [''en''].'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      summary: List customers
      description: 'List all customers. The API will return all customers that the API Key has

        permissions to access. Results are not returned in any guaranteed order.'
      operationId: listCustomers
      x-audience: public
      x-required-permissions:
        permissions:
        - customers:read@entity
        enforcement: any
      tags:
      - Customers
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Successfully listed customers.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - customers
                  properties:
                    customers:
                      type: array
                      description: The list of customers.
                      items:
                        $ref: '#/components/schemas/Customer'
                - $ref: '#/components/schemas/ListResponse'
              example:
                customers:
                - customerId: customer_af2937b0-9846-4fe7-bfe9-ccc22d935114
                  type: individual
                  individual:
                    firstName: Jane
                    lastName: Doe
                    email: jane.doe@example.com
                  capabilities:
                    custodyCrypto:
                      requested: true
                      status: active
                    custodyFiat:
                      requested: false
                      status: unrequested
                    custodyStablecoin:
                      requested: false
                      status: unrequested
                    tradeCrypto:
                      requested: true
                      status: pending
                    tradeStablecoin:
                      requested: false
                      status: unrequested
                    transferCrypto:
                      requested: true
                      status: active
                    transferFiat:
                      requested: false
                      status: unrequested
                    transferStablecoin:
                      requested: false
                      status: unrequested
                  requirements:
                    fullSsn:
                      status: rejected
                      impact:
                      - tradeCrypto
                    sourceOfFunds:
                      status: due
                    citizenship:
                      status: due
                    tos:
                      status: due
                      impact:
                      - tradeCrypto
                      - transferFiat
                      tosVersions:
                      - versionId: us_individual_2026-05-29
                        languages:
                        - en
                        url: https://www.coinbase.com/legal/user-agreements-third-party-provider
                  createdAt: '2026-01-10T14:25:00Z'
                  updatedAt: '2026-01-10T14:30:00Z'
                nextPageToken: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid request. Please check the request body and parameters.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/customers/requirements:
    get:
      summary: Get customer requirements
      description: 'Preview the requirements a hypothetical customer of the given

        `customerType` and jurisdiction would need to satisfy to enable the

        requested `capabilities`, without creating a customer record.

        Partner onboarding UIs can use this to render the collection flow

        before any customer state exists.


        Today this endpoint only previews the Terms of Service requirement:

        the response''s `RequirementsMap` will only ever contain a `tos` key.

        Other requirement families (PII / CDD inputs) are not yet available

        through this endpoint; use `POST /v2/customers` or

        `PUT /v2/customers/{customerId}` to discover those via

        `Customer.requirements`.


        Only `customerType: individual` customers resident in or citizens

        of the US are currently supported; every other combination returns

        `400 invalid_request`.'
      operationId: getCustomerRequirements
      x-audience: public
      x-required-permissions:
        permissions:
        - customers:read@entity
        enforcement: any
      tags:
      - Customers
      security:
      - apiKeyAuth: []
      parameters:
      - name: customerType
        in: query
        required: true
        description: The type of the hypothetical customer.
        schema:
          $ref: '#/components/schemas/CustomerType'
        example: individual
      - name: capabilities
        in: query
        required: true
        description: 'The capabilities the hypothetical customer would request.

          Repeat the parameter to specify multiple capabilities, for

          example `capabilities=custodyCrypto&capabilities=transferCrypto`.

          '
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CapabilityName'
        example:
        - custodyCrypto
        - transferCrypto
      - name: countryCode
        in: query
        required: false
        description: 'The hypothetical customer''s country of residence. At least one

          of `countryCode` or `citizenship` is required. When both are

          present, `countryCode` takes precedence.

          '
        schema:
          $ref: '#/components/schemas/CountryCode'
        example: US
      - name: citizenship
        in: query
        required: false
        description: 'The hypothetical customer''s citizenship. At least one of

          `countryCode` or `citizenship` is required.

          '
        schema:
          $ref: '#/components/schemas/CountryCode'
        example: US
      responses:
        '200':
          description: Successfully previewed requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsMap'
              example:
                tos:
                  status: due
                  impact:
                  - custodyCrypto
                  - transferCrypto
                  tosVersions:
                  - versionId: us_individual_2026-05-29
                    languages:
                    - en
                    url: https://www.coinbase.com/legal/user-agreements-third-party-provider
        '400':
          description: 'Invalid request. Distinct causes include a missing required

            parameter, both `countryCode` and `citizenship` omitted, an

            unrecognized `capabilities` value, and a

            `(customerType, jurisdiction)` combination that is not yet

            supported (currently only `individual` customers resident in or

            citizens of the US).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: Generic invalid request
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid request. Please check the request parameters.
                missing_required_parameter:
                  summary: Missing required `customerType`
                  value:
                    errorType: invalid_request
                    errorMessage: Query parameter 'customerType' is required.
                unrecognized_capability:
                  summary: Unrecognized `capabilities` value
                  value:
                    errorType: invalid_request
                    errorMessage: Unknown capability 'notACapability'.
                missing_jurisdiction:
                  summary: Neither `countryCode` nor `citizenship` provided
                  value:
                    errorType: invalid_request
                    errorMessage: At least one of 'countryCode' or 'citizenship' is required.
                unsupported_combination:
                  summary: '`(customerType, jurisdiction)` combination is not yet supported'
                  value:
                    errorType: invalid_request
                    errorMessage: Requirements are not yet supported for customerType 'business' outside the US.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/customers/{customerId}:
    get:
      summary: Get a customer
      description: Get a customer by their ID. Returns the full customer object.
      operationId: getCustomerById
      x-audience: public
      x-required-permissions:
        permissions:
        - customers:read@entity
        enforcement: any
      tags:
      - Customers
      security:
      - apiKeyAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: The ID of the customer.
        schema:
          $ref: '#/components/schemas/CustomerId'
        example: customer_af2937b0-9846-4fe7-bfe9-ccc22d935114
      responses:
        '200':
          description: Successfully retrieved customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customerId: customer_af2937b0-9846-4fe7-bfe9-ccc22d935114
                type: individual
                individual:
                  firstName: Jane
                  lastName: Doe
                  email: jane.doe@example.com
                capabilities:
                  custodyCrypto:
                    requested: true
                    status: active
                  custodyFiat:
                    requested: false
                    status: unrequested
                  custodyStablecoin:
                    requested: false
                    status: unrequested
                  tradeCrypto:
                    requested: true
                    status: pending
                  tradeStablecoin:
                    requested: false
                    status: unrequested
                  transferCrypto:
                    requested: true
                    status: active
                  transferFiat:
                    requested: false
                    status: unrequested
                  transferStablecoin:
                    requested: false
                    status: unrequested
                requirements:
                  fullSsn:
                    status: rejected
                    impact:
                    - tradeCrypto
                  sourceOfFunds:
                    status: due
                  citizenship:
                    status: due
                  tos:
                    status: due
                    impact:
                    - tradeCrypto
                    - transferFiat
                    tosVersions:
                    - versionId: us_individual_2026-05-29
                      languages:
                      - en
                      url: https://www.coinbase.com/legal/user-agreements-third-party-provider
                createdAt: '2026-01-10T14:25:00Z'
                updatedAt: '2026-01-10T14:30:00Z'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid request. Please check the request body and parameters.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Customer not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    delete:
      summary: Delete a customer
      description: 'Initiates deletion of the customer and all associated data. This operation

        is idempotent — repeated calls for an already-deleted customer return 204.

        A 404 is returned only when no customer with the given ID exists for the

        caller''s entity.'
      operationId: deleteCustomerById
      x-audience: public
      x-required-permissions:
        permissions:
        - customers:write@entity
        enforcement: any
      tags:
      - Customers
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: customerId
        in: path
        required: true
        description: The ID of the customer.
        schema:
          $ref: '#/components/schemas/CustomerId'
        example: customer_af2937b0-9846-4fe7-bfe9-ccc22d935114
      responses:
        '204':
          description: Customer deletion initiated successfully.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid request. Please check the request body and parameters.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: No customer with the given ID exists for the caller's entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Customer not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    put:
      summary: Update a customer
      description: 'Update customer information and/or request capability changes.

        This endpoint supports partial updates. Provide only the fields you wish to change.'
      operationId: updateCustomerById
      x-audience: public
      x-required-permissions:
        permissions:
        - customers:write@entity
        enforcement: any
      tags:
      - Customers
      security:
      - apiKeyAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: The ID of the customer.
        schema:
          $ref: '#/components/schemas/CustomerId'
        example: customer_af2937b0-9846-4fe7-bfe9-ccc22d935114
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: 'Customer fields to update. All fields are optional; omit a field to

          leave it unchanged.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
            examples:
              requestCapability:
                summary: Request a capability
                value:
                  capabilities:
                    custodyFiat:
                      requested: true
              submitRequirements:
                summary: Submit verification requirements
                value:
                  individual:
                    firstName: Jane
                    lastName: Doe
                    fullSsn: 123-45-6789
                    address:
                      line1: 123 Main St
                      city: New York
                      state: NY
                      postCode: '10001'
                      countryCode: US
                  tosAcceptances:
                  - versionId: us_individual_2026-05-29
                    language: en
                    acceptedAt: '2026-04-10T12:00:00Z'
                  taxAttestations:
                  - form: us_w9
                    isExemptBackupWithholding: true
                    edeliveryConsent: true
                    acceptedAt: '2026-04-17T20:00:00Z'
              requestWithRequirements:
                summary: Request capability with verification requirements
                value:
                  capabilities:
                    custodyFiat:
                      requested: true
                  individual:
                    firstName: Jane
                    lastName: Doe
                    dateOfBirth:
                      day: '15'
                      month: '01'
                      year: '1990'
      responses:
        '200':
          description: Successfully updated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customerId: customer_af2937b0-9846-4fe7-bfe9-ccc22d935114
                type: individual
                individual: {}
                capabilities:
                  custodyCrypto:
                    requested: true
                    status: active
                  custodyFiat:
                    requested: true
                    status: pending
                  custodyStablecoin:
                    requested: false
                    status: unrequested
                  tradeCrypto:
                    requested: false
                    status: unrequested
                  tradeStablecoin:
                    requested: false
                    status: unrequested
                  transferCrypto:
                    requested: true
                    status: active
                  transferFiat:
                    requested: false
                    status: unrequested
                  transferStablecoin:
                    requested: false
                    status: unrequested
                requirements:
                  dateOfBirth:
                    status: pending
                    impact:
                    - custodyFiat
                  sourceOfFunds:
                    status: due
                createdAt: '2026-01-10T14:25:00Z'
                updatedAt: '2026-01-10T14:25:00Z'
        '400':
          description: 'Invalid request. `unsupported_tos_language` is returned when a

            `tosAcceptances[].language` is not published for the matching

            `versionId` (i.e. not listed under `Customer.requirements.tos.tosVersions[].languages`).

            Other validation failures return `invalid_request`. See

            `x-error-instructions` on `ErrorType` for remediation steps;

            `errorMessage` carries human-readable detail. Missing Terms of

            Service acceptances are surfaced on `Customer.requirements.tos.tosVersions[]`

            (returned on success) rather than as an error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: Generic invalid request
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid request. Please check the request body and parameters.
                unsupported_tos_language:
                  summary: A `tosAcceptances[].language` is not in the matching version's `languages`
                  value:
                    errorType: unsupported_tos_language
                    errorMessage: 'Terms of Service version ''us_individual_2026-05-29'' is not published in language ''fr''. Supported languages: [''en''].'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: The customer cannot be modified at this time. This may occur when one or more capabilities are permanently inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                customer_not_modifiable:
                  value:
                    errorType: forbidden
                    errorMessage: This customer cannot be modified at this time.
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Customer not found.
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
webhooks:
  customersCapabilityChanged:
    post:
      summary: Customers capability changed
      description: Triggered when the `customers.capability.changed` webhook event is emitted. Your API will receive a POST request at the webhook URL you configured.
      operationId: customersCapabilityChangedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Customers
      requestBody:
        description: The `customers.capability.changed` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomersCapabilityChangedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  customersCustomerDeleted:
    post:
      summary: Customer deleted
      description: Triggered when the `customers.customer.deleted` webhook event is emitted. Your API will receive a POST request at the webhook URL you configured.
      operationId: customersCustomerDeletedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Customers
      requestBody:
        description: The `customers.customer.deleted` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomersCustomerDeletedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  customersRequirementChanged:
    post:
      summary: Customers requirement changed
      description: Triggered when the `customers.requirement.changed` webhook event is emitted. Your API will receive a POST request at the webhook URL you configured.
      operationId: customersRequirementChangedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Customers
      requestBody:
        description: The `customers.requirement.changed` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomersRequirementChangedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
components:
  schemas:
    ErrorType:
      description: The code that indicates the type of error that occurred. These error codes can be used to determine how to handle the error.
      type: string
      example: invalid_request
      enum:
