    CreateCustomerRequest:
      allOf:
      - $ref: '#/components/schemas/CustomerWriteBase'
      - type: object
        required:
        - type
    RequirementsMap:
      type: object
      description: 'Map of requirements to be submitted. Each key is the field name

        (e.g., "ssnLast4"), with values to describe its state. Requirements

        are only shown for requested capabilities. When a requirement is

        verified, it disappears from this map.


        For the `tos` key, each entry in `tosVersions[]` has its own optional

        deadline. The requirement-level `deadline` is an aggregate of those rows:

        the earliest set deadline among unaccepted versions, not a separate clock.

        A version with no deadline requires immediate acceptance but keeps the

        aggregate status `due`. A future deadline is also `due` and represents

        non-blocking grace. The aggregate status is `past_due` only when at least

        one unaccepted version has a deadline set in the past. Do not infer status

        or blocking behavior from omission of the aggregate deadline.

        '
      additionalProperties:
        $ref: '#/components/schemas/Requirement'
      example:
        firstName:
          status: due
          impact:
          - custodyCrypto
          - transferCrypto
        fullSsn:
          status: rejected
          impact:
          - custodyCrypto
        ssnLast4:
          status: pending
          impact:
          - custodyCrypto
        sourceOfFunds:
          status: due
        citizenship:
          status: due
        tos:
          status: due
          impact:
          - transferFiat
          tosVersions:
          - versionId: us_individual_2026-05-29
            languages:
            - en
            url: https://www.coinbase.com/legal/user-agreements-third-party-provider
        taxAttestation:
          status: due
          impact:
          - transferFiat
          taxForms:
          - us_w9
    ListResponse:
      type: object
      properties:
        nextPageToken:
          type: string
          description: The token for the next page of items, if any.
          example: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
    RequirementStatus:
      type: string
      description: 'The current status of a requirement:

        - `due`: Must be submitted and no set deadline has passed

        - `past_due`: Must be submitted and a set deadline has passed

        - `pending`: Submitted, awaiting verification

        - `rejected`: Verification failed - customer must resubmit


        For a Terms of Service requirement, `past_due` applies if any unaccepted

        version has a deadline set in the past. Otherwise the status is `due`,

        including when a version has no deadline and requires immediate acceptance,

        or when every set deadline is in the future and acceptance is in grace.


        When verification passes, the requirement disappears from the response entirely.

        '
      enum:
      - due
      - past_due
      - pending
      - rejected
      example: due
    DateOfBirthLenient:
      type: object
      description: 'Date of birth with lenient formatting. Accepts both zero-padded ("04", "07")

        and single-digit ("4", "7") values for day and month.

        '
      additionalProperties: false
      properties:
        day:
          type: string
          description: Day of birth (1-31). Both single-digit ("7") and zero-padded ("07") formats are accepted.
          minLength: 1
          maxLength: 2
          pattern: ^(?:0?[1-9]|[12][0-9]|3[01])$
          example: '15'
        month:
          type: string
          description: Month of birth (1-12). Both single-digit ("4") and zero-padded ("04") formats are accepted.
          minLength: 1
          maxLength: 2
          pattern: ^(?:0?[1-9]|1[0-2])$
          example: 08
        year:
          type: string
          description: Year of birth (four digits).
          minLength: 4
          maxLength: 4
          pattern: ^[0-9]{4}$
          example: '1990'
      example:
        day: '15'
        month: 08
        year: '1990'
    TosVersionId:
      type: string
      minLength: 1
      maxLength: 64
      description: 'Stable, opaque identifier for a specific Terms of Service version

        (for example, `us_individual_2026-05-29`). The same identifier is

        surfaced on `Customer.requirements.tos.tosVersions[].versionId` (the

        versions a Customer still needs to accept) and on

        `Customer.tosAcceptances[].versionId` (the versions the Customer has

        accepted). Treat the value as opaque and submit it verbatim; the

        identifier format is stable across API versions, but the set of

        valid values grows over time as new Terms of Service versions are

        published.

        '
      example: us_individual_2026-05-29
    CountryCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
      description: An ISO 3166-1 alpha-2 country code.
      example: US
    Email:
      type: string
      format: email
      maxLength: 254
      pattern: ^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}/-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$
      description: An email address. Maximum length 254 characters per [RFC 5321](https://www.rfc-editor.org/rfc/rfc5321).
      example: user@example.com
    CustomersEventBase:
      type: object
      description: Common envelope fields included in every Customers webhook event payload.
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique identifier for this logical webhook event. Webhooks are delivered at least once, so your endpoint may receive duplicate deliveries for the same event. Use this `eventId` as the idempotency/deduplication key.
          example: 3a7f8b2e-1c4d-4e9a-b5f6-d8a2c0e7f194
        eventType:
          type: string
          description: The type of webhook event.
          example: customers.customer.deleted
        timestamp:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the underlying state change occurred, not the time at which this webhook was delivered.
          example: '2026-04-01T12:00:02Z'
      required:
      - eventId
      - eventType
      - timestamp
    CustomerWriteBase:
      type: object
      description: 'Fields accepted on customer create and update requests. Shared by

        `CreateCustomerRequest` and `UpdateCustomerRequest`; excludes the

        server-managed response-only fields that appear on `Customer`.

        '
      additionalProperties: false
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/CustomerType'
          description: 'The type of the customer. Required on create; accepted but ignored on

            update.

            '
          example: individual
        capabilities:
          allOf:
          - $ref: '#/components/schemas/CapabilitiesMapInput'
          description: Capabilities to request for the customer.
          example: {}
        individual:
          allOf:
          - $ref: '#/components/schemas/IndividualInput'
          description: 'Information about an Individual customer. Not all fields are required

            for all customers; the requirements depend on which capabilities are

            requested. Submit only fields that are required by the capabilities

            that have been requested.

            '
          example:
            firstName: Jane
            lastName: Doe
        projectIds:
          type: array
          description: The project IDs that this customer is associated with.
          items:
            $ref: '#/components/schemas/ProjectId'
          example: []
        tosAcceptances:
          type: array
          description: 'Terms of Service acceptances to record on the customer. Submit one

            entry per required version surfaced inline on

            `requirements.tos.tosVersions[]` (returned by `Get Customer`,

            `Create Customer`, and `Update Customer` whenever a `tos` requirement

            is unsatisfied). The server rejects each acceptance whose `language`

            is not listed under `languages` on the matching required version with

            `errorType: "unsupported_tos_language"`.


            When new required Terms of Service versions are published, only the

            new `versionId`s appear in `requirements.tos.tosVersions[]`; submit

            acceptances for only those new version(s).


            Omit `tosAcceptances` on a partial update to leave previously recorded

            acceptances unchanged. Sending `tosAcceptances: []` is invalid

            (`errorType: "invalid_request"`) because it would clear all acceptances

            without replacing them; omit the field entirely when you are not

            updating Terms of Service acceptances.

            '
          items:
            $ref: '#/components/schemas/TosAcceptance'
          example:
          - versionId: us_individual_2026-05-29
            language: en
            acceptedAt: '2026-04-10T12:00:00Z'
        taxAttestations:
          type: array
          writeOnly: true
          description: 'Tax attestations to record on the customer. Submit one entry per

            required form surfaced inline on

            `requirements.taxAttestation.taxForms[]` (returned by `Get Customer`,

            `Create Customer`, and `Update Customer` whenever a `taxAttestation`

            requirement is unsatisfied). The required fields per entry depend on

            `form`; see `TaxAttestation`. This field is ingestion-only and is

            never returned on read.


            Omit `taxAttestations` on a partial update to leave previously

            recorded attestations unchanged. Sending `taxAttestations: []` is

            invalid (`errorType: "invalid_request"`) because it would clear all

            attestations without replacing them; omit the field entirely when you

            are not updating tax attestations.

            '
          items:
            $ref: '#/components/schemas/TaxAttestation'
          example:
          - form: us_w9
            isExemptBackupWithholding: true
            edeliveryConsent: true
            acceptedAt: '2026-04-17T20:00:00Z'
        compliance:
          $ref: '#/components/schemas/Compliance'
          writeOnly: true
    ProjectId:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: The ID of the Project, a UUID v4.
      example: af2937b0-9846-4fe7-bfe9-ccc22d935114
    CapabilityInput:
      type: object
      description: Request to enable or disable a capability.
      additionalProperties: false
      properties:
        requested:
          type: boolean
          description: Whether to request this capability.
          example: true
      required:
      - requested
    Error:
      description: An error response including the code for the type of error and a human-readable message describing the error.
      type: object
      properties:
        errorType:
          $ref: '#/components/schemas/ErrorType'
        errorMessage:
          description: The error message.
          type: string
          example: Unable to create EVM account
        correlationId:
          description: A unique identifier for the request that generated the error. This can be used to help debug issues with the API.
          type: string
          example: 41deb8d59a9dc9a7-IAD
        errorLink:
          allOf:
          - $ref: '#/components/schemas/Url'
          description: A link to the corresponding error documentation.
          example: https://docs.cdp.coinbase.com/api-reference/v2/errors#invalid-request
        unauthorizedCapabilities:
          description: 'The capability code(s) that were not authorized for the customer on

            this request. Present only when `errorType` is

            `customer_not_authorized`; absent for every other error type.


            Use this list to render onboarding UX for the listed capabilities, or

            fetch `GET /v2/customers/{customerId}` and inspect each entry''s

            `status` / `requirements` to discover what (if anything) can be

            submitted to resolve the block.

            '
          type: array
          items:
            $ref: '#/components/schemas/CapabilityName'
      required:
      - errorType
      - errorMessage
      example:
        errorType: invalid_request
        errorMessage: Invalid request.
        correlationId: 41deb8d59a9dc9a7-IAD
        errorLink: https://docs.cdp.coinbase.com/api-reference/v2/errors#invalid-request
    RequirementFieldName:
      type: string
      description: 'Flat camelCase field name of a customer data requirement

        (e.g., `ssnLast4`, `addressCity`).

        '
      enum:
      - firstName
      - lastName
      - dateOfBirth
      - ssnLast4
      - fullSsn
      - addressLine1
      - addressLine2
      - addressCity
      - addressSubdivision
      - addressPostalCode
      - addressCountryCode
      - email
      - phoneNumber
      - citizenship
      - purposeOfAccount
      - sourceOfFunds
      - employmentStatus
      - occupation
      - expectedVolume
      - tos
      - taxAttestation
      example: ssnLast4
    Requirement:
      type: object
      description: 'A single requirement that a customer must submit to enable capabilities.

        Requirements are only shown for requested capabilities.

        '
      properties:
        status:
          $ref: '#/components/schemas/RequirementStatus'
        deadline:
          type: string
          format: date-time
          description: 'Optional aggregate deadline by which this requirement must be satisfied.


            For the `tos` requirement, this is the earliest set deadline among the

            unaccepted required Terms of Service versions listed in `tosVersions`.

            It is omitted only when none of the unaccepted versions has a deadline.

            Do not infer `past_due` or whether the requirement blocks from this

            aggregate field alone; inspect each version''s deadline.

            '
        impact:
          type: array
          description: 'List of capabilities affected by this requirement, sorted alphabetically.

            Only present for `due`, `past_due`, `pending`, or `rejected` statuses.

            '
          items:
            $ref: '#/components/schemas/CapabilityName'
          example:
          - custodyCrypto
          - transferCrypto
        tosVersions:
          type: array
          description: 'Required Terms of Service versions the Customer has not yet

            accepted, with the metadata needed to render an acceptance UI

            (each entry carries a stable `versionId`, the BCP 47

            `languages` the version is published in, an optional per-version

            `deadline`, and a language-agnostic `url`). A missing deadline means

            acceptance is required immediately while the requirement status remains

            `due`; only a set deadline in the past produces `past_due`. This field

            appears only under the requirement key `tos`; do not infer meaning from

            `tosVersions` on other requirement keys. Only populated for the `tos`

            requirement; omitted on every other requirement key. Submit each

            `versionId` back via `tosAcceptances[].versionId` on `Update Customer`

            (or `Create Customer`) together with `language` and `acceptedAt` to

            clear the requirement.

            '
          items:
            $ref: '#/components/schemas/TermsOfService'
          example:
          - versionId: us_individual_2026-05-29
            languages:
            - en
            url: https://www.coinbase.com/legal/user-agreements-third-party-provider
        taxForms:
          type: array
          description: 'Required tax attestation forms the Customer has not yet completed.

            This field appears only under the requirement key `taxAttestation`.

            Submit each `form` back via `taxAttestations[].form` on

            `Update Customer` (or `Create Customer`) together with the other

            fields required for that form to clear the requirement.

            '
          items:
            $ref: '#/components/schemas/TaxForm'
          example:
          - us_w9
      required:
      - status
      example:
        status: due
        impact:
        - custodyCrypto
        - transferCrypto
    Url:
      type: string
      format: uri
      minLength: 11
      maxLength: 2048
      pattern: ^https?://.*$
      description: A valid HTTP or HTTPS URL.
      example: https://example.com
    Customer:
      type: object
      description: A customer record returned on read (Get / Create / Update Customer).
      properties:
        customerId:
          $ref: '#/components/schemas/CustomerId'
        type:
          $ref: '#/components/schemas/CustomerType'
        capabilities:
          allOf:
          - $ref: '#/components/schemas/CapabilitiesMap'
          description: 'Current state of each capability for this customer. Each capability

            shows whether it has been requested and its current status.

            '
          readOnly: true
          example: {}
        requirements:
          allOf:
          - $ref: '#/components/schemas/RequirementsMap'
          description: 'Map of requirements to be submitted. Each key is the field name, with

            values to describe its state. Requirements are only shown for requested

            capabilities. When a requirement is fulfilled, it disappears from this map.

            '
          readOnly: true
          example: {}
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the customer was created.
          example: '2026-01-10T14:25:00Z'
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the customer was last updated.
          example: '2026-01-10T14:30:00Z'
          readOnly: true
        individual:
          $ref: '#/components/schemas/Individual'
        projectIds:
          type: array
          description: The project IDs that this customer is associated with.
          items:
            $ref: '#/components/schemas/ProjectId'
          example: []
        tosAcceptances:
          type: array
          description: 'Terms of Service acceptances recorded for the customer.

            '
          items:
            $ref: '#/components/schemas/TosAcceptance'
          example:
          - versionId: us_individual_2026-05-29
            language: en
            acceptedAt: '2026-04-10T12:00:00Z'
      required:
      - customerId
      - type
      - capabilities
      - requirements
    TermsOfService:
      type: object
      description: 'Metadata for one Terms of Service document a Customer may need to

        accept. Each entry represents one logical document (identified by

        `versionId`) that may be published in multiple languages —

        `languages` lists the BCP 47 language tags the document is available

        to view and accept in. An optional `deadline` records the end of a grace

        period: a future deadline is non-blocking `due`, an elapsed deadline is

        `past_due`, and no deadline means acceptance is required immediately with

        status `due`. `url` is the canonical, language-agnostic document URL;

        partners append `?lang=<tag>` (where `<tag>` is one of `languages`) to

        retrieve a specific translation, and omit the parameter to let the

        documentation site choose a default. This API does not serve Terms of

        Service body content; this schema describes metadata only.

        '
      properties:
        versionId:
          allOf:
          - $ref: '#/components/schemas/TosVersionId'
          description: 'Stable identifier for this Terms of Service document. Submit this

            value as `versionId` on a `TosAcceptance` to record acceptance.

            '
        deadline:
          type: string
          format: date-time
          description: 'Optional deadline by which the Customer must accept this Terms of

            Service version, in ISO 8601 / RFC 3339 format. A future deadline is

            non-blocking grace with requirement status `due`; an elapsed deadline

            produces `past_due`. When omitted, acceptance is required immediately

            and the requirement status remains `due`.

            '
          example: '2026-06-30T23:59:59Z'
        languages:
          type: array
          description: 'BCP 47 language tags this Terms of Service document can be viewed

            and accepted in. The list is non-empty (every published document

            carries at least one language). Append the chosen tag to `url` as

            `?lang=<tag>` to fetch the localized document, and submit the same

            tag as `language` on the corresponding `TosAcceptance` to record

            which translation the Customer reviewed.

            '
          minItems: 1
          items:
            type: string
            example: en
          example:
          - en
        url:
          allOf:
          - $ref: '#/components/schemas/Url'
          description: 'Canonical, language-agnostic URL where the Terms of Service

            document is hosted (for example,

            `https://www.coinbase.com/legal/user-agreements-third-party-provider`).

            Append `?lang=<tag>` (where `<tag>` is one of `languages`) to

            retrieve a specific translation; without the parameter, the

            documentation site renders a default translation.

            '
          example: https://www.coinbase.com/legal/user-agreements-third-party-provider
      required:
      - versionId
      - languages
      - url
      example:
        versionId: us_individual_2026-05-29
        languages:
        - en
        url: https://www.coinbase.com/legal/user-agreements-third-party-provider
    CustomerType:
      type: string
      description: 'The type of the customer. Required on create; accepted but ignored on update.

        '
      enum:
      - individual
      x-enum-varnames:
      - CustomerTypeIndividual
      example: individual
    Compliance:
      type: object
      description: 'Compliance context for a request. Carries per-request compliance signals,

        such as the IP address of the individual (i.e., end-customer) that

        initiated the request.


        This object is request-only — it is never echoed back in responses.

        Inner fields are write-only.

        '
      properties:
        requesterIpAddress:
          type: string
          writeOnly: true
          description: 'IPv4 or IPv6 address of the individual (i.e., end-customer) that

            initiated this request. NOT the IP of the partner server making the

            API call.

            '
          example: 203.0.113.42
      example:
        requesterIpAddress: 203.0.113.42
    CapabilityStatus:
      type: string
      description: 'The status of a capability. Based on recoverability:

        - `unrequested`: Capability has not been requested by the customer

        - `pending`: Customer can take action to resolve (requirements `due` or `rejected`)

        - `active`: Capability is enabled and can be used

        - `inactive`: Permanently blocked - no customer action possible

        '
      enum:
      - unrequested
      - pending
      - active
      - inactive
      example: active
    CapabilitiesMap:
      type: object
      description: 'The current state of each capability for a Customer. Each capability shows

        whether it has been requested and its current status.

        '
      properties:
        custodyCrypto:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Hold cryptocurrency in a Coinbase custodial account.
        custodyFiat:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Hold fiat currency in a Coinbase custodial account.
        custodyStablecoin:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Hold stablecoin in a Coinbase custodial account.
        tradeCrypto:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Trade cryptocurrency.
        tradeStablecoin:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Trade stablecoin.
        transferCrypto:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Transfer cryptocurrency to another party.
        transferFiat:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Transfer fiat currency to another party.
        transferStablecoin:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Transfer stablecoin to another party.
      example:
        custodyCrypto:
          requested: true
          status: active
        custodyFiat:
          requested: false
          status: unrequested
        custodyStablecoin:
          requested: false
          status: unrequested
        tradeCrypto:
          requested: false
          status: unrequested
        tradeStablecoin:
          requested: false
          status: unrequested
        transferCrypto:
          requested: true
          status: active
        transferFiat:
          requested: false
          status: unrequested
        transferStablecoin:
          requested: false
          status: unrequested
    Individual:
      type: object
      description: 'Individual customer data returned on read — the `individual` object on

        Get / Create / Update Customer responses. Only contact-identity fields are

        echoed back; every other field accepted on the `IndividualInput` object

        (`address`, `ssnLast4`, `dateOfBirth`, `fullSsn`, `citizenship`,

        `phoneNumber`, and the CDD fields) is ingestion-only and never returned.

        '
      properties:
        firstName:
          type: string
          description: First name (given name).
          example: Jane
        lastName:
          type: string
          description: Last name (family name/surname).
          example: Doe
        email:
          allOf:
          - $ref: '#/components/schemas/Email'
          description: Email address for the customer.
          example: jane.doe@example.com
      example:
        firstName: Jane
        lastName: Doe
        email: jane.doe@example.com
    CustomersCustomerDeletedEvent:
      x-event-type: customers.customer.deleted
      allOf:
      - $ref: '#/components/schemas/CustomersEventBase'
      - type: object
        properties:
          eventType:
            type: string
            description: The type of webhook event.
            enum:
            - customers.customer.deleted
            example: customers.customer.deleted
          data:
            type: object
            description: Payload body for the `customers.customer.deleted` event. Emitted when the Customer record is deleted; this transition is terminal.
            properties:
              customerId:
                allOf:
                - $ref: '#/components/schemas/CustomerId'
                description: The ID of the deleted Customer.
                example: customer_38d54acb-0868-431c-a88e-1ffcb62655eb
            required:
            - customerId
            example:
              customerId: customer_38d54acb-0868-431c-a88e-1ffcb62655eb
        required:
        - eventType
        - data
    Capability:
      type: object
      description: 'The current state of a capability for a customer. The `status` field is always

        present. When `requested` is `false`, the status will be `unrequested`.

        '
      properties:
        requested:
          type: boolean
          description: Whether the customer has explicitly requested this capability.
          example: true
        status:
          allOf:
          - $ref: '#/components/schemas/CapabilityStatus'
          description: 'Current status of the capability. When `requested` is `false`, status is `unrequested`.

            When `requested` is `true`, status is one of `pending`, `active`, or `inactive`.

            '
          example: active
      required:
      - requested
      - status
    CapabilitiesMapInput:
      type: object
      description: 'The capabilities to request for a Customer. Each capability can be

        individually requested. The requirements to enable each capability

        will be returned in the response.

        '
      additionalProperties: false
      properties:
        custodyCrypto:
          allOf:
          - $ref: '#/components/schemas/CapabilityInput'
          description: Hold cryptocurrency in a Coinbase custodial account.
        custodyFiat:
          allOf:
          - $ref: '#/components/schemas/CapabilityInput'
          description: Hold fiat currency in a Coinbase custodial account.
        custodyStablecoin:
          allOf:
          - $ref: '#/components/schemas/CapabilityInput'
          description: Hold stablecoin in a Coinbase custodial account.
        tradeCrypto:
          allOf:
          - $ref: '#/components/schemas/CapabilityInput'
          description: Trade cryptocurrency.
        tradeStablecoin:
          allOf:
          - $ref: '#/components/schemas/CapabilityInput'
          description: Trade stablecoin.
        transferCrypto:
          allOf:
          - $ref: '#/components/schemas/CapabilityInput'
          description: Transfer cryptocurrency to another party.
        transferFiat:
          allOf:
          - $ref: '#/components/schemas/CapabilityInput'
          description: Transfer fiat currency to another party.
        transferStablecoin:
          allOf:
          - $ref: '#/components/schemas/CapabilityInput'
          description: Transfer stablecoin to another party.
      example:
        custodyCrypto:
          requested: true
        transferCrypto:
          requested: true
    CustomersRequirementChangedEvent:
      x-event-type: customers.requirement.changed
      allOf:
      - $ref: '#/components/schemas/CustomersEventBase'
      - type: object
        properties:
          eventType:
            type: string
            description: The type of webhook event.
            enum:
            - customers.requirement.changed
            example: customers.requirement.changed
          data:
            type: object
            description: Payload body for the `customers.requirement.changed` event. Emitted when the status of one or more requirements changes. Several requirements may change in a single event, with each change represented by a distinct entry in the `requirements` array.
            properties:
              customerId:
                allOf:
                - $ref: '#/components/schemas/CustomerId'
                description: The CDP Customer ID the event applies to.
                example: customer_38d54acb-0868-431c-a88e-1ffcb62655eb
              requirements:
                type: array
                description: The set of requirements whose status changed in this event.
                minItems: 1
                items:
                  type: object
                  description: A single requirement whose status changed. Carries `{field, status}` and, when the requirement still gates capabilities, `impact`.
                  properties:
                    field:
                      allOf:
                      - $ref: '#/components/schemas/RequirementFieldName'
                      description: The requirement that changed. Identical to the corresponding key of `requirements` on `GET /v2/customers/{customerId}`.
                      example: fullSsn
                    status:
                      type: string
                      description: The new status of the requirement after the change. `due`, `past_due`, `pending`, and `rejected` match `RequirementStatus`. `cleared` means verification passed and the requirement no longer appears on `GET /v2/customers/{customerId}`. When `status` is `rejected`, resubmit that field on the Customer.
                      enum:
                      - due
                      - past_due
                      - pending
                      - rejected
                      - cleared
                      example: rejected
                    impact:
                      type: array
                      description: Capability codes gated by this requirement, sorted alphabetically. Matches `impact` on the corresponding `GET /v2/customers/{customerId}` requirement entry. Omit when `status` is `cleared`.
                      items:
                        $ref: '#/components/schemas/CapabilityName'
                      example:
                      - tradeCrypto
                  required:
                  - field
                  - status
                  example:
                    field: fullSsn
                    status: rejected
                    impact:
                    - tradeCrypto
                example:
                - field: fullSsn
                  status: rejected
                  impact:
                  - tradeCrypto
                - field: ssnLast4
                  status: cleared
            required:
            - customerId
            - requirements
            example:
              customerId: customer_38d54acb-0868-431c-a88e-1ffcb62655eb
              requirements:
              - field: fullSsn
                status: rejected
                impact:
                - tradeCrypto
              - field: ssnLast4
                status: cleared
        required:
        - eventType
        - data
    CapabilityName:
      type: string
      description: 'The name of a capability. Capabilities represent granular functional permissions

        that determine what actions a customer can perform. Each capability must be

        explicitly requested before use.

        '
      enum:
      - custodyCrypto
      - custodyFiat
      - custodyStablecoin
      - tradeCrypto
      - tradeStablecoin
      - transferCrypto
      - transferFiat
      - transferStablecoin
      x-enum-varnames:
      - CustodyCrypto
      - CustodyFiat
      - CustodyStablecoin
      - TradeCrypto
      - TradeStablecoin
      - TransferCrypto
      - TransferFiat
      - TransferStablecoin
      example: custodyCrypto
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      description: A phone number in [E.164](https://en.wikipedia.org/wiki/E.164) format.
      example: '+12055555555'
    TosAcceptance:
      type: object
      description: 'A single Terms of Service acceptance recorded for a Customer. Submit

        one entry per required document listed in

        `Customer.requirements.tos.tosVersions[]` (returned on `Get Customer`,

        `Create Customer`, and `Update Customer`). `language` records the

        single translation the Customer actually reviewed.


        When new required Terms of Service versions are published, only the

        new `versionId`s appear in `Customer.requirements.tos.tosVersions[]`;

        submit acceptances for only those new version(s).

        '
      additionalProperties: false
      properties:
        versionId:
          allOf:
          - $ref: '#/components/schemas/TosVersionId'
          description: 'The `versionId` of the Terms of Service document being accepted,

            as listed in `Customer.requirements.tos.tosVersions[]`.

            '
        language:
          type: string
          description: 'BCP 47 language tag of the Terms of Service translation the

            Customer reviewed. At write time the server rejects values that

            are not listed under `languages` on the matching required

            document for this Customer (same `versionId` as listed in

            `Customer.requirements.tos.tosVersions[]`).

            '
          example: en
        acceptedAt:
          type: string
          format: date-time
          description: 'Timestamp at which the Customer accepted the Terms of Service,

            in ISO 8601 / RFC 3339 format. The server may validate or reject

            obviously non-credible timestamps; when enforcement tightens,

            the authoritative acceptance time may be recorded server-side

            instead of trusting client-supplied values alone.

            '
          example: '2026-04-10T12:00:00Z'
      required:
      - versionId
      - language
      - acceptedAt
      example:
        versionId: us_individual_2026-05-29
        language: en
        acceptedAt: '2026-04-10T12:00:00Z'
    UsW9Attestation:
      type: object
      title: IRS Form W-9
      description: 'Tax attestation for IRS Form W-9, used for US persons. Carries the

        W-9-specific backup withholding certification alongside the fields common

        to every form (`edeliveryConsent`, `acceptedAt`).

        '
      additionalProperties: false
      properties:
        form:
          type: string
          description: 'The tax form being attested to, as listed in

            `Customer.requirements.taxAttestation.taxForms[]`. Must be `us_w9`

            for this variant.

            '
          enum:
          - us_w9
          example: us_w9
        edeliveryConsent:
          type: boolean
          description: 'Whether the Customer consents to electronic delivery (e-delivery) of

            tax documents. Both `true` and `false` are recorded as submitted.

            '
          example: true
        acceptedAt:
          type: string
          format: date-time
          description: 'Timestamp at which the Customer completed the tax attestation, in

            ISO 8601 / RFC 3339 format. The server may reject obviously

            non-credible timestamps.

            '
          example: '2026-04-17T20:00:00Z'
        isExemptBackupWithholding:
          type: boolean
          description: 'Whether the Customer is exempt from backup withholding, as certified

            on IRS Form W-9.

            '
          example: true
      required:
      - form
      - edeliveryConsent
      - acceptedAt
      - isExemptBackupWithholding
      example:
        form: us_w9
        isExemptBackupWithholding: true
        edeliveryConsent: true
        acceptedAt: '2026-04-17T20:00:00Z'
    TaxForm:
      type: string
      description: 'Identifier for a tax attestation form a Customer may need to

        complete. The same identifier is surfaced on

        `Customer.requirements.taxAttestation.taxForms[]` (the forms a

        Customer still needs to attest to) and submitted back as `form` on

        `Customer.taxAttestations[]` to record the attestation.

        '
      enum:
      - us_w9
      example: us_w9
    UpdateCustomerRequest:
      allOf:
      - $ref: '#/components/schemas/CustomerWriteBase'
    CustomerId:
      type: string
      pattern: ^customer_[a-f0-9\-]{36}$
      description: The ID of the Customer, which is a UUID prefixed by `customer_`.
      example: customer_af2937b0-9846-4fe7-bfe9-ccc22d935114
    PhysicalAddress:
      type: object
      description: A physical address with standard address components including street, city, state/province, postal code, and country.
      properties:
        line1:
          type: string
          description: Primary street address.
          example: 123 Market St
        line2:
          type: string
          description: Secondary address information.
          example: Suite 400
        city:
          type: string
          description: City or locality.
          example: San Francisco
        state:
          type: string
          description: State, province, or region.
          example: CA
        postCode:
          type: string
          description: Postal or ZIP code.
          example: '94105'
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 characters). See https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes.
          example: US
  responses:
    UnauthorizedError:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                errorType: unauthorized
                errorMessage: The request is not properly authenticated.
    RateLimitExceeded:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limit_exceeded:
              value:
                errorType: rate_limit_exceeded
                errorMessage: Rate limit exceeded.
    BadGatewayError:
      description: Bad gateway.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bad_gateway:
              value:
                errorType: bad_gateway
                errorMessage: Bad gateway. Please try again later.
    IdempotencyError:
      description: Idempotency key conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            idempotency_error:
              value:
                errorType: idempotency_error
                errorMessage: Idempotency key '8e03978e-40d5-43e8-bc93-6894a57f9324' was already used with a different request payload. Please try again with a new idempotency key.
    ServiceUnavailableError:
      description: Service unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            service_unavailable:
              value:
                errorType: service_unavailable
                errorMessage: Service unavailable. Please try again later.
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal_server_error:
              value:
                errorType: internal_server_error
                errorMessage: An internal server error occurred. Please try again later.
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: 'An optional string request header for making requests safely retryable.

        When included, duplicate requests with the same key will return identical responses.

        Refer to our [Idempotency docs](https://docs.cdp.coinbase.com/api-reference/v2/idempotency) for more information on using idempotency keys.

        '
      schema:
        type: string
        maxLength: 128
        minLength: 1
      example: 8e03978e-40d5-43e8-bc93-6894a57f9324
    PageToken:
      name: pageToken
      description: The token for the next page of resources, if any.
      in: query
      required: false
      schema:
        type: string
      example: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
    PageSize:
      name: pageSize
      description: The number of resources to return per page.
      in: query
      required: false
      schema:
        type: integer
        default: 20
      example: 10
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT signed using your CDP API Key Secret, encoded in base64. Refer to the [Generate Bearer Token](https://docs.cdp.coinbase.com/api-reference/v2/authentication#2-generate-bearer-token) section of our Authentication docs for information on how to generate your Bearer Token.
    endUserAuth:
      x-audience: public
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT signed using the developer's own JWT private key (in the case of JWT authentication), or an end user JWT signed by CDP, encoded in base64. This is used for End User Account APIs.
    unauthenticated:
      x-audience: public
      type: http
      scheme: none
      description: This security scheme is used for APIs that do not require authentication, such as End User Auth flows used to initiate authentication or public, read-only endpoints.
    webhookSignature:
      x-audience: public
      type: apiKey
      in: header
      name: X-Hook0-Signature
      description: 'HMAC-SHA256 signature of the raw request body, computed using your webhook secret. Webhook receivers should always verify this header before processing the event. The header value is hex-encoded and prefixed by the algorithm and timestamp, e.g. `t=1700000000,v1=abc123...` (refer to the Webhook Security docs for the exact verification algorithm).


        This scheme applies to webhook delivery (outbound POSTs from CDP to your endpoint), not to inbound CDP API requests.'
