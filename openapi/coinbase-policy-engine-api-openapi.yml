openapi: 3.2.0
info:
  title: Coinbase Developer Platform Policy Engine API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Policy Engine
  x-audience: public
  x-slo-tier:
    tier: ga
  description: 'The Policy Engine APIs evaluate policies (a set of rules) to govern the behavior of accounts or projects, such as enforce allowlists and denylists. - A **policy** is a collection of `rules` with defined criteria. - Each **rule** contains a specified `action`, `operation`, and `criteria`:

    - An `action` can either `accept` or `reject` a transaction if the criteria in the rule are met. - `criteria` is an array of logical expressions. All parameters must evaluate to true for the action to be applied. - An `operation` corresponds to a CDP v2 API:

    - `signEvmTransaction` or `signSolTransaction` for signing transactions (to set a transaction limit). - `sendEvmTransaction` for signing a transaction, and sending it to a supported network. - `signEvmHash` for signing an arbitrary 32 byte hash. - `signEvmMessage` for signing an EIP-191 message. - `prepareUserOperation` for preparing user operations on a smart account. - `sendUserOperation` for sending user operations using a smart account. - `signEndUserEvmTransaction` or `signEndUserSolTransaction` for signing end user transactions (to set a transaction limit). - `sendEndUserEvmTransaction` for signing an end user transaction, and sending it to a supported EVM network. - `sendEndUserSolTransaction` for signing an end user transaction, and sending it to a supported Solana network. - `signEndUserEvmMessage` for signing an end user EIP-191 message. - `signEndUserEvmTypedData` for signing end user EIP-712 typed data. - `signEndUserSolMessage` for signing an end user Solana message. - A **rule** indicates how an operation should behave, specifying whether a request with defined criteria should be accepted or rejected. ## Policy Scope

    Policies can be applied at the project and/or account level:

    - **Project-level policy**: A `project`-level policy applies to all accounts in a CDP Project. Only one project-level policy can be applied to accounts within a CDP Project at any given time. - **Account-level policy**: An `account`-level policy applies to one or more accounts. An account

    can have at most one account-level policy at any given time. Thus, a single account can be assigned at most two policies at any given time: one project-level policy and one account-level policy. **Note:** End user operation rules (e.g., `signEndUserEvmTransaction`, `sendEndUserSolTransaction`) currently only apply for policies with the `project` scope. Scope is specified in the `scope` field of a policy:

    ```json {

    "description": "Project-level policy",

    "scope": "account",

    ... ```

    ## Policy Evaluation

    A rule *targets* an operation when its `operation` field equals the requested operation. A rule *matches* when it targets the operation and all of its criteria are met (logical **AND**). Reject-over-accept precedence does not depend on rule order. For matching rules with the same action, the first in policy order applies. **Project-level policies** are evaluated first, followed by **account-level policies**. Within a policy, any matching `reject` rule rejects the request. Otherwise, any matching `accept` rule accepts it. If no rule in the project-level policy matches, the account-level policy is evaluated the same way, if one exists. A decision in the project-level policy is final. A `reject` rule overrides an `accept` rule only within the same policy, so an account-level `reject` rule does not override a matching project-level `accept` rule. If neither policy makes a decision, the request is accepted when no rule in either policy targets the operation, and rejected when at least one rule targets it. For example, this project-level policy accepts `signEvmTransaction` requests up to 2000000000000000000 wei, but rejects any request to `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE`. A request to that address for 1 ETH matches both rules and is rejected regardless of their order.'
paths:
  /v2/policy-engine/policies:
    get:
      x-audience: public
      summary: List policies
      description: 'Lists the policies belonging to the developer''s CDP Project. Use the `scope` parameter to filter the policies by scope.

        The response is paginated, and by default, returns 20 policies per page.'
      operationId: listPolicies
      tags:
      - Policy Engine
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      - name: scope
        description: The scope of the policies to return. If `project`, the response will include exactly one policy, which is the project-level policy. If `account`, the response will include all account-level policies for the developer's CDP Project.
        in: query
        required: false
        schema:
          type: string
          enum:
          - project
          - account
        example: project
      responses:
        '200':
          description: Successfully listed policies.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    policies:
                      type: array
                      items:
                        $ref: '#/components/schemas/Policy'
                      description: The list of policies.
                  required:
                  - policies
                - $ref: '#/components/schemas/ListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    post:
      x-audience: public
      summary: Create policy
      description: Create a policy that can be used to govern the behavior of accounts.
      operationId: createPolicy
      tags:
      - Policy Engine
      security:
      - apiKeyAuth: []
      x-required-api-auth-scopes:
      - policies#manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  description: The scope of the policy.
                  enum:
                  - project
                  - account
                  example: project
                description:
                  type: string
                  description: 'An optional human-readable description for the policy.

                    Policy descriptions can consist of alphanumeric characters, spaces, commas, and periods, and be 50 characters or less.'
                  pattern: ^[A-Za-z0-9 ,.]{1,50}$
                  example: Default policy
                rules:
                  $ref: '#/components/schemas/PolicyRules'
              required:
              - scope
              - rules
      responses:
        '201':
          description: Successfully created policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Policy name must be between 1 and 50 characters.
        '409':
          $ref: '#/components/responses/AlreadyExistsError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/policy-engine/policies/{policyId}:
    get:
      x-audience: public
      summary: Get policy by ID
      description: Get a policy by its ID.
      operationId: getPolicyById
      tags:
      - Policy Engine
      security:
      - apiKeyAuth: []
      parameters:
      - name: policyId
        description: The ID of the policy to get.
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Successfully retrieved policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: Policy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Policy not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    delete:
      x-audience: public
      summary: Delete policy
      description: Delete a policy by its ID. This will have the effect of removing the policy from all accounts that are currently using it.
      operationId: deletePolicy
      tags:
      - Policy Engine
      security:
      - apiKeyAuth: []
      x-required-api-auth-scopes:
      - policies#manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: policyId
        description: The ID of the policy to delete.
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '204':
          description: Successfully deleted policy.
        '400':
          description: Unable to delete policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: policy_in_use
                    errorMessage: Policy in use.
        '404':
          description: Policy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Policy not found.
        '409':
          $ref: '#/components/responses/AlreadyExistsError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    put:
      x-audience: public
      summary: Update policy
      description: Updates a policy by its ID. This will have the effect of applying the updated policy to all accounts that are currently using it.
      operationId: updatePolicy
      tags:
      - Policy Engine
      security:
      - apiKeyAuth: []
      x-required-api-auth-scopes:
      - policies#manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: policyId
        description: The ID of the policy to update.
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: 'An optional human-readable description for the policy.

                    Policy descriptions can consist of alphanumeric characters, spaces, commas, and periods, and be 50 characters or less.'
                  pattern: ^[A-Za-z0-9 ,.]{1,50}$
                  example: Default policy
                rules:
                  $ref: '#/components/schemas/PolicyRules'
              required:
              - rules
      responses:
        '200':
          description: Successfully updated policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Policy name must be between 1 and 50 characters.
        '404':
          description: Policy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Policy not found.
        '409':
          $ref: '#/components/responses/AlreadyExistsError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
components:
  schemas:
    EvmNetworkCriterion:
      type: object
      x-audience: public
      title: EvmNetworkCriterion
      description: A schema for specifying a criterion for the intended `network` of an EVM transaction.
      properties:
        type:
          type: string
          description: The type of criterion to use. This should be `evmNetwork`.
          example: evmNetwork
          enum:
          - evmNetwork
        networks:
          type: array
          description: A list of EVM network identifiers that the transaction's intended `network` should be compared to.
          items:
            type: string
            description: The network the transaction is for.
            enum:
            - base-sepolia
            - base
            - ethereum
            - ethereum-sepolia
            - avalanche
            - polygon
            - optimism
            - arbitrum
            - arbitrum-sepolia
            - zora
            - bnb
            - world
            - world-sepolia
            example: base-sepolia
          example:
          - base
          - ethereum
        operator:
          type: string
          description: The operator to use for the comparison. The transaction's intended `network` will be on the left-hand side of the operator, and the `networks` field will be on the right-hand side.
          enum:
          - in
          - not in
          example: in
      required:
      - type
      - networks
      - operator
    SendUserOperationCriteria:
      x-audience: public
      type: array
      description: A schema for specifying criteria for the SendUserOperation operation.
      items:
        oneOf:
        - $ref: '#/components/schemas/EthValueCriterion'
        - $ref: '#/components/schemas/EvmAddressCriterion'
        - $ref: '#/components/schemas/EvmNetworkCriterion'
        - $ref: '#/components/schemas/EvmDataCriterion'
        - $ref: '#/components/schemas/NetUSDChangeCriterion'
      example:
      - type: ethValue
        ethValue: '1000000'
        operator: '>='
      - type: evmAddress
        addresses:
        - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        operator: in
    PolicyRules:
      type: array
      description: A list of rules that comprise the policy. Each policy is limited to 100 rules and a total serialized size of 8 MiB.
      items:
        $ref: '#/components/schemas/Rule'
      example:
      - action: accept
        operation: signEvmTransaction
        criteria:
        - type: ethValue
          ethValue: '1000000000000000000'
          operator: <=
        - type: evmAddress
          addresses:
          - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
          - '0x1234567890123456789012345678901234567890'
          operator: in
      - action: accept
        operation: signSolTransaction
        criteria:
        - type: solAddress
          addresses:
          - HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
          operator: in
    SolDataParameterConditionList:
      type: object
      x-audience: public
      title: SolDataParameterConditionList
      description: A single parameter condition to apply against a specific instruction's parameters.
      properties:
        name:
          type: string
          description: The parameter name.
          example: amount
        operator:
          type: string
          description: The operator to use for the comparison. The value resolved at the `name` will be on the left-hand side of the operator, and the `value` field will be on the right-hand side.
          enum:
          - in
          - not in
          example: in
        values:
          type: array
          description: The values to compare against.
          items:
            type: string
            description: A single potential value to compare against the resolved `name` value.
            example: '1000000'
          example:
          - '1000000'
          - HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
          - '6'
      required:
      - name
      - operator
      - values
    SignEvmTypedDataFieldCriterion:
      x-audience: public
      type: object
      title: SignEvmTypedDataFieldCriterion
      properties:
        type:
          type: string
          description: The type of criterion to use. This should be `evmTypedDataField`.
          example: evmTypedDataField
          enum:
          - evmTypedDataField
        types:
          type: object
          description: An object containing EIP-712 type definitions, as well as a primary type for the root message object.
          example:
            primaryType: Mail
            types:
              Person:
              - name: name
                type: string
              - name: wallet
                type: address
              - name: score
                type: uint256
              Mail:
              - name: from
                type: Person
              - name: to
                type: Person
              - name: contents
                type: string
          properties:
            types:
              type: object
              description: EIP-712 compliant map of model names to model definitions.
              additionalProperties:
                type: array
                description: Object containing names and types for fields within structured data.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of a key within an EIP-712 data structure.
                    type:
                      type: string
                      description: The Solidity type of a value within an EIP-712 data structure.
            primaryType:
              type: string
              description: The name of the root EIP-712 type. This value must be included in the `types` object.
          required:
          - types
          - primaryType
        conditions:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/EvmTypedAddressCondition'
            - $ref: '#/components/schemas/EvmTypedNumericalCondition'
            - $ref: '#/components/schemas/EvmTypedStringCondition'
          description: A list of conditions to check against the data being signed. Each condition must be met for the rule to take effect.
          example:
          - addresses:
            - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
            operator: in
            path: to.wallet
          - value: '50'
            operator: '>='
            path: to.score
          - match: ^hello ([a-z]+)$
            path: contents
      required:
      - type
      - types
      - conditions
    SendSolTransactionRule:
      x-audience: public
      title: SendSolTransactionRule
      properties:
        action:
          type: string
          description: Whether matching the rule will cause the request to be rejected or accepted.
          example: accept
          enum:
          - reject
          - accept
        operation:
          type: string
          description: The operation to which the rule applies. Every element of the `criteria` array must match the specified operation.
          example: sendSolTransaction
          enum:
          - sendSolTransaction
        criteria:
          $ref: '#/components/schemas/SendSolTransactionCriteria'
      required:
      - action
      - operation
      - criteria
    Policy:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the policy.
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          example: 123e4567-e89b-12d3-a456-426614174000
        description:
          type: string
          description: 'An optional human-readable description of the policy.

            Policy descriptions can consist of alphanumeric characters, spaces, commas, and periods, and be 50 characters or less.'
          pattern: ^[A-Za-z0-9 ,.]{1,50}$
          example: Default policy
        scope:
          type: string
          description: The scope of the policy. Only one project-level policy can exist at any time.
          enum:
          - project
          - account
          example: project
        rules:
          $ref: '#/components/schemas/PolicyRules'
        createdAt:
          type: string
          description: The ISO 8601 timestamp at which the Policy was created.
          example: '2025-03-25T12:00:00Z'
        updatedAt:
          type: string
          description: The ISO 8601 timestamp at which the Policy was last updated.
          example: '2025-03-26T12:00:00Z'
      required:
      - id
      - scope
      - rules
      - createdAt
      - updatedAt
    SignSolTransactionCriteria:
      type: array
      x-audience: public
      description: A schema for specifying criteria for the SignSolTransaction operation.
      items:
        oneOf:
        - $ref: '#/components/schemas/SolAddressCriterion'
        - $ref: '#/components/schemas/SolValueCriterion'
        - $ref: '#/components/schemas/SplAddressCriterion'
        - $ref: '#/components/schemas/SplValueCriterion'
        - $ref: '#/components/schemas/MintAddressCriterion'
        - $ref: '#/components/schemas/SolDataCriterion'
        - $ref: '#/components/schemas/ProgramIdCriterion'
      example:
      - type: solAddress
        addresses:
        - HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
        operator: in
    SolValueCriterion:
      x-audience: public
      type: object
      title: SolValueCriterion
      description: The criterion for the SOL value in lamports of a native transfer instruction in a Solana transaction.
      properties:
        type:
          type: string
          description: The type of criterion to use. This should be `solValue`.
          example: solValue
          enum:
          - solValue
        solValue:
          type: string
          description: The amount of SOL in lamports that the transaction instruction's `value` field should be compared to.
          example: '1000000000000000000'
        operator:
          type: string
          description: The operator to use for the comparison. The transaction instruction's `value` field will be on the left-hand side of the operator, and the `solValue` field will be on the right-hand side.
          enum:
          - '>'
          - '>='
          - <
          - <=
          - ==
          example: <=
      required:
      - type
      - solValue
      - operator
    EvmDataCondition:
      type: object
      x-audience: public
      description: A single condition to apply against the function and encoded arguments in the transaction's `data` field. Each `parameter` configuration must be successfully evaluated against the corresponding function argument in order for a policy to be accepted.
      properties:
        function:
          type: string
          example: transfer
          description: The name of a smart contract function being called.
        params:
          type: array
          description: An optional list of parameter conditions to apply against encoded arguments in the transaction's `data` field.
          items:
            description: A list of parameter conditions to apply against encoded arguments in the transaction's `data` field.
            oneOf:
            - $ref: '#/components/schemas/EvmDataParameterCondition'
            - $ref: '#/components/schemas/EvmDataParameterConditionList'
          example:
          - name: value
            operator: <=
            value: '10000'
          - name: to
            operator: in
            values:
            - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
      example:
        function: transfer
        params:
        - name: value
          operator: <=
          value: '10000'
        - name: to
          operator: in
          values:
          - '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
      required:
      - function
    Url:
      type: string
      format: uri
      minLength: 11
      maxLength: 2048
      pattern: ^https?://.*$
      description: A valid HTTP or HTTPS URL.
      example: https://example.com
    SolDataParameterCondition:
      type: object
      x-audience: public
      title: SolDataParameterCondition
      description: A single parameter condition to apply against a specific instruction's parameters.
      properties:
        name:
          type: string
          description: The parameter name.
          example: amount
        operator:
          type: string
          description: The operator to use for the comparison. The value resolved at the `name` will be on the left-hand side of the operator, and the `value` field will be on the right-hand side.
          enum:
          - '>'
          - '>='
          - <
          - <=
          - ==
          example: ==
        value:
          type: string
          description: The value to compare against.
          example: '1000000'
      required:
      - name
      - operator
      - value
    SignEndUserSolMessageCriteria:
      x-audience: public
      type: array
      description: A schema for specifying criteria for the signEndUserSolMessage operation.
      items:
        oneOf:
        - $ref: '#/components/schemas/SolMessageCriterion'
      example:
      - type: solMessage
        match: ^hello ([a-z]+)$
    EvmTypedStringCondition:
      type: object
      x-audience: public
      title: EvmTypedStringCondition
      description: A schema for specifying criterion for a string field of an EVM typed message. The value can be deeply nested within the typed data's message.
      properties:
        match:
          type: string
          description: A regular expression the field is matched against.
          example: ^hello ([a-z]+)$
        path:
          type: string
          description: The path to the field to compare against this criterion. To reference deeply nested fields within the message, separate object keys by `.`, and access array values using `[index]`. If the field does not exist or is not an address, the operation will be rejected.
          example: targets[0].message
      required:
      - match
      - path
    SignSolMessageRule:
      x-audience: public
      title: SignSolMessageRule
      properties:
        action:
          type: string
          description: Whether matching the rule will cause the request to be rejected or accepted.
          example: accept
          enum:
          - reject
          - accept
        operation:
          type: string
          description: The operation to which the rule applies. Every element of the `criteria` array must match the specified operation.
          example: signSolMessage
          enum:
          - signSolMessage
        criteria:
          $ref: '#/components/schemas/SignSolMessageCriteria'
      required:
      - action
      - operation
      - criteria
    SignEvmTransactionCriteria:
      type: array
