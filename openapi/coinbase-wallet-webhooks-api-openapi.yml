components:
  schemas:
    WalletTransactionPendingPayload:
      type: object
      description: Payload for `wallet.transaction.pending`. EVM-only. EIP-1559 fee fields are included.
      properties:
        transaction_hash:
          type: string
          description: The onchain transaction hash.
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The EVM wallet address whose transaction is pending.
          example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: base
        pending_since:
          type: string
          format: date-time
          description: When the transaction entered the pending state (ISO 8601 format).
          example: '2025-06-01T10:04:00Z'
        max_fee_per_gas:
          type: string
          description: EIP-1559 max fee per gas in wei.
          example: '30000000000'
        max_priority_fee_per_gas:
          type: string
          description: EIP-1559 max priority fee per gas in wei.
          example: '1500000000'
      required:
      - transaction_hash
      - address
      - network
      - pending_since
      - max_fee_per_gas
      - max_priority_fee_per_gas
    WalletSolanaTransactionFailedPayload:
      type: object
      description: Payload for `wallet.transaction.failed` on Solana. Includes `transaction_signature` and omits `address`.
      properties:
        transaction_signature:
          type: string
          description: The Solana transaction signature.
          example: 5KtPn1LGuxhFiwjxErkxTb3BeHaGShVbirtk7vrWgEiaTaKKQSGkLmMX7vLBMA4oL9pGikhmL6K2Uf4VNBLEmmnF
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: solana
        failed_at:
          type: string
          format: date-time
          description: When the transaction failed (ISO 8601 format).
          example: '2025-06-01T10:06:00Z'
      required:
      - transaction_signature
      - network
      - failed_at
    WalletTransactionBroadcastEvent:
      x-event-type: wallet.transaction.broadcast
      description: 'Delivered when a transaction is broadcast to the network. The payload is one of six variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing), each delivered as an EVM or Solana variant.'
      oneOf:
      - title: API Key Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionBroadcastPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: API Key Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionBroadcastPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: User Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionBroadcastPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionBroadcastPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Delegated Signing, EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionBroadcastPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
      - title: User Wallet (Delegated Signing, Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionBroadcastPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
    Network:
      type: string
      description: The blockchain network for the payment. Supported networks depend on the account type.
      enum:
      - base
      - ethereum
      - solana
      - aptos
      - arbitrum
      - arbitrum-sepolia
      - optimism
      - polygon
      - world
      - world-sepolia
      example: base
    WalletSolanaTransactionConfirmedPayload:
      type: object
      description: Payload for `wallet.transaction.confirmed` on Solana. Includes `transaction_signature` and omits `address`.
      properties:
        transaction_signature:
          type: string
          description: The Solana transaction signature.
          example: 5KtPn1LGuxhFiwjxErkxTb3BeHaGShVbirtk7vrWgEiaTaKKQSGkLmMX7vLBMA4oL9pGikhmL6K2Uf4VNBLEmmnF
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: solana
        confirmed_at:
          type: string
          format: date-time
          description: When the transaction was confirmed (ISO 8601 format).
          example: '2025-06-01T10:05:00Z'
      required:
      - transaction_signature
      - network
      - confirmed_at
    WalletApiKeyEventPayload:
      type: object
      description: Payload for API Key Wallet events. These events carry no end-user payload fields, so neither `user_id` nor `delegation_id` is present.
      not:
        anyOf:
        - required:
          - user_id
        - required:
          - delegation_id
    WalletDelegatedEventPayload:
      type: object
      description: Payload for delegated User Wallet events, where a User Wallet action was authorized via a delegation grant. Includes `user_id` and the `delegation_id` of the active grant.
      properties:
        user_id:
          type: string
          description: The user ID that owns the User Wallet.
          example: user_12345
        delegation_id:
          type: string
          description: The delegation grant ID used to authorize the action.
          example: delegation_af2937b0-9846-4fe7-bfe9-ccc22d935114
      required:
      - user_id
      - delegation_id
    WalletSolanaSigningPayload:
      type: object
      description: Payload for Solana wallet signing events. Carries the Solana signing `address` and timestamp; no network or transaction identifier.
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          description: The Solana wallet address that performed the signing.
          example: HN7cABqLq46Es1jh92dQQisAq662SmxELLLsHHe4YWrH
        signed_at:
          type: string
          format: date-time
          description: When the signing occurred (ISO 8601 format).
          example: '2025-06-01T10:01:00Z'
      required:
      - address
      - signed_at
    WalletTransactionPendingEvent:
      x-event-type: wallet.transaction.pending
      description: 'Delivered when a transaction enters the pending state. EVM-only. The payload is one of three EVM wallet-type variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing).'
      oneOf:
      - title: API Key Wallet
        allOf:
        - $ref: '#/components/schemas/WalletTransactionPendingPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: User Wallet
        allOf:
        - $ref: '#/components/schemas/WalletTransactionPendingPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Delegated Signing)
        allOf:
        - $ref: '#/components/schemas/WalletTransactionPendingPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
    WalletTransactionReplacedEvent:
      x-event-type: wallet.transaction.replaced
      description: 'Delivered when a pending transaction is replaced (e.g. a fee bump). EVM-only. The payload is one of three EVM wallet-type variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing).'
      oneOf:
      - title: API Key Wallet
        allOf:
        - $ref: '#/components/schemas/WalletTransactionReplacedPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: User Wallet
        allOf:
        - $ref: '#/components/schemas/WalletTransactionReplacedPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Delegated Signing)
        allOf:
        - $ref: '#/components/schemas/WalletTransactionReplacedPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
    WalletDelegationRevokedEvent:
      type: object
      x-event-type: wallet.delegation.revoked
      description: Delivered when a delegation grant is revoked.
      properties:
        delegation_id:
          type: string
          description: The unique identifier for the delegation grant.
          example: delegation_af2937b0-9846-4fe7-bfe9-ccc22d935114
        user_id:
          type: string
          description: The user ID that owns the delegation.
          example: user_12345
        revoked_at:
          type: string
          format: date-time
          description: When the delegation was revoked (ISO 8601 format).
          example: '2025-06-01T11:00:00Z'
      required:
      - delegation_id
      - user_id
      - revoked_at
      example:
        delegation_id: delegation_af2937b0-9846-4fe7-bfe9-ccc22d935114
        user_id: user_12345
        revoked_at: '2025-06-01T11:00:00Z'
    WalletEvmSigningPayload:
      type: object
      description: Payload for EVM wallet signing events. Carries the EVM signing `address` and timestamp; no network or transaction identifier.
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The EVM wallet address that performed the signing.
          example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        signed_at:
          type: string
          format: date-time
          description: When the signing occurred (ISO 8601 format).
          example: '2025-06-01T10:01:00Z'
      required:
      - address
      - signed_at
    WalletEvmTransactionCreatedPayload:
      type: object
      description: Payload for `wallet.transaction.created` on EVM networks. Includes the originating `address`.
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The EVM wallet address that created the transaction.
          example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: base
        created_at:
          type: string
          format: date-time
          description: When the transaction was created (ISO 8601 format).
          example: '2025-06-01T10:00:00Z'
      required:
      - address
      - network
      - created_at
    WalletTransactionConfirmedEvent:
      x-event-type: wallet.transaction.confirmed
      description: 'Delivered when a transaction is confirmed onchain. The payload is one of six variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing), each delivered as an EVM or Solana variant.'
      oneOf:
      - title: API Key Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionConfirmedPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: API Key Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionConfirmedPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: User Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionConfirmedPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionConfirmedPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Delegated Signing, EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionConfirmedPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
      - title: User Wallet (Delegated Signing, Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionConfirmedPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
    WalletEvmTransactionBroadcastPayload:
      type: object
      description: Payload for `wallet.transaction.broadcast` on EVM networks. Includes `transaction_hash` and `address`.
      properties:
        transaction_hash:
          type: string
          description: The onchain transaction hash.
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The EVM wallet address that broadcast the transaction.
          example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: base
        broadcast_at:
          type: string
          format: date-time
          description: When the transaction was broadcast (ISO 8601 format).
          example: '2025-06-01T10:02:00Z'
      required:
      - transaction_hash
      - address
      - network
      - broadcast_at
    WalletEvmTransactionFailedPayload:
      type: object
      description: Payload for `wallet.transaction.failed` on EVM networks. Includes `transaction_hash` and `address`.
      properties:
        transaction_hash:
          type: string
          description: The onchain transaction hash.
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The EVM wallet address that submitted the transaction.
          example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: base
        failed_at:
          type: string
          format: date-time
          description: When the transaction failed (ISO 8601 format).
          example: '2025-06-01T10:06:00Z'
      required:
      - transaction_hash
      - address
      - network
      - failed_at
    BlockchainAddress:
      type: string
      minLength: 1
      maxLength: 128
      description: A blockchain address. Format varies by network (e.g., 0x-prefixed for EVM, base58 for Solana).
      example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
    WalletTransactionReplacedPayload:
      type: object
      description: Payload for `wallet.transaction.replaced`. EVM-only; Solana transactions are not replaceable.
      properties:
        transaction_hash:
          type: string
          description: The onchain transaction hash of the replaced transaction.
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The EVM wallet address whose transaction was replaced.
          example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: base
        replaced_at:
          type: string
          format: date-time
          description: When the transaction was replaced (ISO 8601 format).
          example: '2025-06-01T10:03:00Z'
      required:
      - transaction_hash
      - address
      - network
      - replaced_at
    WalletTransactionCreatedEvent:
      x-event-type: wallet.transaction.created
      description: 'Delivered when a transaction is created. The payload is one of six variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing), each delivered as an EVM or Solana variant.'
      oneOf:
      - title: API Key Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionCreatedPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: API Key Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionCreatedPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: User Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionCreatedPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionCreatedPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Delegated Signing, EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmTransactionCreatedPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
      - title: User Wallet (Delegated Signing, Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaTransactionCreatedPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
    WalletEvmTransactionConfirmedPayload:
      type: object
      description: Payload for `wallet.transaction.confirmed` on EVM networks. Includes `transaction_hash` and `address`.
      properties:
        transaction_hash:
          type: string
          description: The onchain transaction hash.
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The EVM wallet address that submitted the transaction.
          example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: base
        confirmed_at:
          type: string
          format: date-time
          description: When the transaction was confirmed (ISO 8601 format).
          example: '2025-06-01T10:05:00Z'
      required:
      - transaction_hash
      - address
      - network
      - confirmed_at
    WalletHashSignedEvent:
      x-event-type: wallet.hash.signed
      description: 'Delivered when a raw hash is signed. Emitted for both EVM and Solana wallets. The payload is one of six variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing), each delivered as an EVM or Solana variant.'
      oneOf:
      - title: API Key Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmSigningPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: API Key Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaSigningPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: User Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmSigningPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaSigningPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Delegated Signing, EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmSigningPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
      - title: User Wallet (Delegated Signing, Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaSigningPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
    WalletDelegationCreatedEvent:
      type: object
      x-event-type: wallet.delegation.created
      description: Delivered when a delegation grant is created for a User Wallet.
      properties:
        delegation_id:
          type: string
          description: The unique identifier for the delegation grant.
          example: delegation_af2937b0-9846-4fe7-bfe9-ccc22d935114
        user_id:
          type: string
          description: The user ID that owns the delegation.
          example: user_12345
        expires_at:
          type: string
          format: date-time
          description: When the delegation expires (ISO 8601 format).
          example: '2025-07-01T10:00:00Z'
        created_at:
          type: string
          format: date-time
          description: When the delegation was created (ISO 8601 format).
          example: '2025-06-01T10:00:00Z'
      required:
      - delegation_id
      - user_id
      - expires_at
      - created_at
      example:
        delegation_id: delegation_af2937b0-9846-4fe7-bfe9-ccc22d935114
        user_id: user_12345
        expires_at: '2025-07-01T10:00:00Z'
        created_at: '2025-06-01T10:00:00Z'
    WalletTransactionSignedEvent:
      x-event-type: wallet.transaction.signed
      description: 'Delivered when a transaction is signed. Emitted for both EVM and Solana wallets. The payload is one of six variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing), each delivered as an EVM or Solana variant.'
      oneOf:
      - title: API Key Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmSigningPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: API Key Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaSigningPayload'
        - $ref: '#/components/schemas/WalletApiKeyEventPayload'
      - title: User Wallet (EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmSigningPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaSigningPayload'
        - $ref: '#/components/schemas/WalletUserEventPayload'
      - title: User Wallet (Delegated Signing, EVM)
        allOf:
        - $ref: '#/components/schemas/WalletEvmSigningPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
      - title: User Wallet (Delegated Signing, Solana)
        allOf:
        - $ref: '#/components/schemas/WalletSolanaSigningPayload'
        - $ref: '#/components/schemas/WalletDelegatedEventPayload'
    WalletSolanaTransactionBroadcastPayload:
      type: object
      description: Payload for `wallet.transaction.broadcast` on Solana. Includes `transaction_signature` and omits `address`.
      properties:
        transaction_signature:
          type: string
          description: The Solana transaction signature.
          example: 5KtPn1LGuxhFiwjxErkxTb3BeHaGShVbirtk7vrWgEiaTaKKQSGkLmMX7vLBMA4oL9pGikhmL6K2Uf4VNBLEmmnF
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: solana
        broadcast_at:
          type: string
          format: date-time
          description: When the transaction was broadcast (ISO 8601 format).
          example: '2025-06-01T10:02:00Z'
      required:
      - transaction_signature
      - network
      - broadcast_at
    WalletSolanaTransactionCreatedPayload:
      type: object
      description: Payload for `wallet.transaction.created` on Solana. Solana transaction events do not include an `address`.
      properties:
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          description: The blockchain network identifier.
          example: solana
        created_at:
          type: string
          format: date-time
          description: When the transaction was created (ISO 8601 format).
          example: '2025-06-01T10:00:00Z'
      required:
      - network
      - created_at
      not:
        required:
        - address
    WalletUserEventPayload:
      type: object
      description: Payload for User Wallet events. The wallet is owned by an end user, identified by `user_id`. User Wallet actions do not include `delegation_id`.
      properties:
        user_id:
          type: string
          description: The user ID that owns the User Wallet.
          example: user_12345
      required:
      - user_id
      not:
        required:
        - delegation_id
    WalletMessageSignedEvent:
      x-event-type: wallet.message.signed
      description: 'Delivered when a message is signed. Emitted for both EVM and Solana wallets. The payload is one of six variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing), each delivered as an EVM or Solana variant.'
