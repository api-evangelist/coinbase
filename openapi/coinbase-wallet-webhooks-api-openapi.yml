    WalletTransactionFailedEvent:
      x-event-type: wallet.transaction.failed
      description: 'Delivered when a transaction fails. The payload is one of six variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing), each delivered as an EVM or Solana variant.'
      oneOf:
