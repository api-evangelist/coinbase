    WalletTypedDataSignedEvent:
      x-event-type: wallet.typed_data.signed
      description: 'Delivered when EIP-712 typed data is signed. EVM-only. Uses the EVM signing payload. The payload is one of three EVM wallet-type variants: API Key Wallet, User Wallet, or User Wallet (Delegated Signing).'
      oneOf:
