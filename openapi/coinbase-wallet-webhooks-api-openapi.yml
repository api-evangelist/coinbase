openapi: 3.2.0
info:
  title: Coinbase Developer Platform Wallet Webhooks API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Wallet Webhooks
  x-audience: public
  x-slo-tier:
    tier: ga
  description: The `wallet.activity.*` webhook payloads describe wallet activity, transaction, delegation, and signing events emitted by CDP.
paths: {}
webhooks:
  walletTransactionCreated:
    post:
      summary: Wallet transaction created
      description: Triggered when the `wallet.transaction.created` webhook event is emitted. Your API will receive a POST request at the webhook URL you configured.
      operationId: walletTransactionCreatedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Wallet Webhooks
      requestBody:
        description: The `wallet.transaction.created` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTransactionCreatedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  walletTransactionSigned:
