openapi: 3.2.0
info:
  title: Coinbase Developer Platform Onramp API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Onramp
  x-audience: public
  x-slo-tier:
    tier: ga
  description: 'The v2 Onramp APIs are an evolution of our v1 APIs, designed to make the fiat-to-crypto experience feel native to your applications for higher conversion and less friction. These APIs only cover a subset of Coinbase Onramp functionality as described below, for all other use cases please refer to our v1 APIs.


    ## Supported Use Cases


    #### Guest Checkout Onramp (Apple Pay & Google Pay)


    This use case allows you to offer an Apple Pay or Google Pay onramp experience with debit cards in your app without users needing to create or log into a Coinbase account. Our API returns a `paymentLink` URL that renders an Apple Pay or Google Pay button for you to load in a webview or iframe in your app, making the onramp experience feel native to your application.


    Refer to our detailed integration guide for more information on the limitations and requirements of this use case. See our onramp mobile demo app for a reference implementation.


    #### Hosted UI Onramp


    This use case enables you to offer a full-featured onramp experience by redirecting users to a Coinbase-hosted page where they can choose to log into their existing Coinbase account or proceed as a guest. The Onramp Session API generates secure, single-use Onramp URLs with customizable parameters, allowing you to control available payment methods, preset transaction amounts, and cryptocurrencies for a tailored user experience.


    Refer to our guide for implementation details and customization options for this use case.'
paths:
  /v2/onramp/verifications:
    post:
      x-audience: public
      summary: Initiate onramp verification
      description: 'Initiates OTP verification by sending a 6-digit code to the user via the specified channel (SMS or email). Returns a `verificationId` that must be passed to the Submit Onramp Verification endpoint along with the OTP code within 10 minutes.


        **Access to this API requires allowlisting.** During Onramp Headless API onboarding, contact the Onramp team to enable Onramp-managed verification for your application.'
      operationId: initiateOnrampVerification
      tags:
      - Onramp
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateOnrampVerificationRequest'
      responses:
        '201':
          description: Successfully initiated onramp verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampVerificationInitiation'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid channel or destination.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/onramp/verifications/{verificationId}/submit:
    post:
      x-audience: public
      summary: Submit onramp verification
      description: 'Submits the OTP code to complete verification. On success, marks the verification as verified and returns the same `verificationId`. The destination does not need to be re-sent. Onramp uses the value captured at initiation time.


        The returned `verificationId` should be stored on the user''s device and passed to the Create Onramp Order endpoint. It is valid for 60 days.


        **Access to this API requires allowlisting.** During Onramp Headless API onboarding, contact the Onramp team to enable Onramp-managed verification for your application.'
      operationId: submitOnrampVerification
      tags:
      - Onramp
      security:
      - apiKeyAuth: []
      parameters:
      - name: verificationId
        in: path
        required: true
        description: The verification ID returned by the Initiate Onramp Verification endpoint.
        schema:
          $ref: '#/components/schemas/OnrampVerificationId'
        example: onramp_verification_a1b2c3d4-e5f6-7890-abcd-ef1234567890
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOnrampVerificationRequest'
      responses:
        '200':
          description: Successfully completed onramp verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampVerificationConfirmation'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: OTP code is required.
                verification_code_invalid:
                  value:
                    errorType: otp_verification_code_invalid
                    errorMessage: The OTP code is incorrect or has expired.
                verification_invalid:
                  value:
                    errorType: otp_verification_invalid
                    errorMessage: The verification record is not in a usable state for this operation.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Verification not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                verification_not_found:
                  value:
                    errorType: otp_verification_not_found
                    errorMessage: The provided verification ID does not correspond to any verification record.
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/onramp/orders:
    post:
      x-audience: public
      summary: Create an onramp order
      description: 'Create a new Onramp order or get a quote for an Onramp order. Either `paymentAmount` or `purchaseAmount` must be provided.


        This API supports two modes:


        **Headless mode (standard)**: returns a seamless Apple Pay or Google Pay button that you integrate directly into your app. Your app collects and verifies the user''s contact details before calling this endpoint — `phoneNumber`, `email`, `phoneNumberVerifiedAt`, and `agreementAcceptedAt` are required and enforced server-side.


        **Embedded mode**: returns a webview that collects and verifies the user''s contact and identity information, then shows the payment screen. Omit both `phoneNumber` and `email` from the request to select this mode. Embedded mode requires account enablement; contact the Onramp team for access.


        Read more about the difference between the two modes in the Headless Onramp overview.


        This API supports the `GUEST_CHECKOUT_APPLE_PAY` and `GUEST_CHECKOUT_GOOGLE_PAY` payment methods.


        For detailed integration instructions and to get access to this API, refer to the Guest Checkout Onramp API docs.'
      operationId: createOnrampOrder
      tags:
      - Onramp
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/OnrampPartnerId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agreementAcceptedAt:
                  description: The timestamp of when the user acknowledged that by using Coinbase Onramp they are accepting the Coinbase Terms (https://www.coinbase.com/legal/guest-checkout/us), User Agreement (https://www.coinbase.com/legal/user_agreement),  and Privacy Policy (https://www.coinbase.com/legal/privacy).
                  format: date-time
                  type: string
                  example: '2025-04-24T00:00:00Z'
                destinationAddress:
                  allOf:
                  - $ref: '#/components/schemas/BlockchainAddress'
                  description: The address the purchased crypto will be sent to.
                destinationNetwork:
                  description: 'The name of the crypto network the purchased currency will be sent on.


                    Use the [Onramp Buy Options API](https://docs.cdp.coinbase.com/api-reference/rest-api/onramp-offramp/get-buy-options) to discover the supported networks for your user''s location.'
                  type: string
                  example: base
                email:
                  description: The verified email address of the user requesting the onramp transaction. This email must be verified by your app (via OTP) before being used with the Onramp API.
                  type: string
                  example: test@example.com
                isQuote:
                  description: If true, this API will return a quote without creating any transaction.
                  type: boolean
                  default: false
                partnerOrderRef:
                  description: Optional partner order reference ID.
                  type: string
                  example: order-1234
                partnerUserRef:
                  description: 'A unique string that represents the user in your app. This can be used to link individual transactions together so you can retrieve the transaction history for your users. Prefix this string with "sandbox-" (e.g. "sandbox-user-1234") to perform a sandbox transaction which will allow you to test your integration without any real transfer of funds.


                    This value can be used with the [Onramp User Transactions API](https://docs.cdp.coinbase.com/api-reference/rest-api/onramp-offramp/get-onramp-transactions-by-id) to retrieve all transactions created by the user.'
                  type: string
                  example: user-1234
                paymentAmount:
                  description: A string representing the amount of fiat the user wishes to pay in exchange for crypto. When using  this parameter, the returned quote will be inclusive of fees i.e. the user will pay this exact amount  of the payment currency.
                  type: string
                  example: '100.00'
                paymentCurrency:
                  description: The fiat currency to be converted to crypto.
                  type: string
                  example: USD
                paymentMethod:
                  $ref: '#/components/schemas/OnrampOrderPaymentMethodTypeId'
                phoneNumber:
                  description: 'The phone number of the user requesting the onramp transaction in E.164 format. This phone number must  be verified by your app (via OTP) before being used with the Onramp API.

                    Please refer to the [Onramp docs](https://docs.cdp.coinbase.com/onramp/headless-onramp/overview) for more details on phone number verification requirements and best practices.'
                  type: string
                  example: '+12055555555'
                phoneNumberVerifiedAt:
                  description: Timestamp of when the user's phone number was verified via OTP. User phone number must be verified every 60 days. If this timestamp is older than 60 days, an error will be returned.
                  format: date-time
                  type: string
                  example: '2025-04-24T00:00:00Z'
                smsVerificationId:
                  allOf:
                  - $ref: '#/components/schemas/OnrampVerificationId'
                  description: The SMS verification ID returned by the Submit Onramp Verification endpoint after verifying the user's phone number. When provided, Onramp validates the server-side verification record instead of trusting `phoneNumberVerifiedAt`.
                emailVerificationId:
                  allOf:
                  - $ref: '#/components/schemas/OnrampVerificationId'
                  description: The email verification ID returned by the Submit Onramp Verification endpoint after verifying the user's email address.
                purchaseAmount:
                  description: A string representing the amount of crypto the user wishes to purchase. When using this parameter the  returned quote will be exclusive of fees i.e. the user will receive this exact amount of the purchase  currency.
                  type: string
                  example: '10.000000'
                purchaseCurrency:
                  description: 'The ticker (e.g. `BTC`, `USDC`, `SOL`) or the Coinbase UUID (e.g. `d85dce9b-5b73-5c3c-8978-522ce1d1c1b4`)  of the crypto asset to be purchased.


                    Use the [Onramp Buy Options API](https://docs.cdp.coinbase.com/api-reference/rest-api/onramp-offramp/get-buy-options) to discover the supported purchase currencies for your user''s location.'
                  type: string
                  example: USDC
                clientIp:
                  description: The IP address of the end user requesting the onramp transaction.
                  type: string
                  example: 127.0.0.1
                domain:
                  description: The domain that the Apple Pay or Google Pay button will be rendered on. Required when using the `GUEST_CHECKOUT_APPLE_PAY` or `GUEST_CHECKOUT_GOOGLE_PAY` payment method and embedding the payment link in an iframe. Omit this field entirely for mobile iOS Apple Pay via WebView integration.
                  type: string
                  example: pay.coinbase.com
                locale:
                  type: string
                  pattern: ^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$
                  description: Optional [BCP-47](https://www.rfc-editor.org/info/bcp47) locale tag (e.g. `es-ES`, `pt-BR`, `en`) used to localize the hosted payment page. When provided, it is appended to the returned `paymentLink` URL and mapped to the closest locale supported by the Apple Pay and Google Pay buttons; unsupported locales fall back to the user's browser language. Any well-formed BCP-47 tag is accepted.
                  example: es-ES
                userAuthToken:
                  allOf:
                  - $ref: '#/components/schemas/OnrampUserAuthToken'
                  description: Optional. A reusable token returned by a previous verified order. When provided, a returning user checking out to the same wallet is taken straight to the pay button, skipping OTP (best-effort — an invalid, expired, or different-wallet token still requires verification).
              required:
              - paymentCurrency
              - purchaseCurrency
              - paymentMethod
              - destinationAddress
              - destinationNetwork
              - partnerUserRef
      responses:
        '201':
          description: Successfully created an onramp order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/OnrampOrder'
                  paymentLink:
                    $ref: '#/components/schemas/OnrampPaymentLink'
                  userAuthToken:
                    allOf:
                    - $ref: '#/components/schemas/OnrampUserAuthToken'
                    description: Present for embedded orders once the user has verified. Store this and pass it on future orders for the same user to skip OTP verification. Valid for 60 days.
                required:
                - order
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Missing required params.
                partner_id_not_permitted:
                  value:
                    errorType: invalid_request
                    errorMessage: The X-Onramp-Partner-Id header is only valid for apps registered as an Onramp aggregator.
                network_not_tradable:
                  value:
                    errorType: network_not_tradable
                    errorMessage: The selected asset cannot be purchased on the selected network in the user's location.
                guest_permission_denied:
                  value:
                    errorType: guest_permission_denied
                    errorMessage: The user is not allowed to complete onramp transactions as a guest.
                guest_region_forbidden:
                  value:
                    errorType: guest_region_forbidden
                    errorMessage: Guest onramp transactions are not allowed in the user's region.
                phone_number_verification_expired:
                  value:
                    errorType: phone_number_verification_expired
                    errorMessage: The user's phone number verification has expired. Please re-verify the user's phone number.
                verification_expired:
                  value:
                    errorType: otp_verification_expired
                    errorMessage: The verification record has expired. Initiate a new verification flow.
                verification_invalid:
                  value:
                    errorType: otp_verification_invalid
                    errorMessage: The verification record is not in a valid state for order placement.
                verification_required:
                  value:
                    errorType: otp_verification_required
                    errorMessage: Verification is required for this application. Use the Onramp Verification API to verify the user's phone number and email.
                verification_destination_mismatch:
                  value:
                    errorType: otp_verification_destination_mismatch
                    errorMessage: The destination on the order does not match the destination that was verified.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Verification or partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                verification_not_found:
                  value:
                    errorType: otp_verification_not_found
                    errorMessage: The provided verification ID does not correspond to any verification record.
                partner_not_found:
                  value:
                    errorType: not_found
                    errorMessage: The partner identified by the X-Onramp-Partner-Id header is blocked or does not belong to this app.
        '429':
          description: Rate limit or guest transaction quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limit_exceeded:
                  value:
                    errorType: rate_limit_exceeded
                    errorMessage: Rate limit exceeded.
                guest_transaction_limit:
                  value:
                    errorType: guest_transaction_limit
                    errorMessage: This transaction would exceed the user's weekly guest onramp transaction limit.
                guest_transaction_count:
                  value:
                    errorType: guest_transaction_count
                    errorMessage: The user has reached the lifetime guest onramp transaction count limit (15).
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/onramp/orders/{orderId}:
    get:
      x-audience: public
      summary: Get an onramp order by ID
      description: Get an onramp order by ID.
      operationId: getOnrampOrderById
      tags:
      - Onramp
      security:
      - apiKeyAuth: []
      parameters:
      - name: orderId
        in: path
        required: true
        description: The ID of the onramp order to retrieve.
        schema:
          type: string
          pattern: ^[a-f0-9\-]{36}$
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Successfully retrieved an onramp order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/OnrampOrder'
                required:
                - order
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Order with the given ID does not exist.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/onramp/sessions:
    post:
      x-audience: public
      summary: Create an onramp session
      description: 'Returns a single-use URL for an Onramp session. This API provides flexible functionality based on the parameters provided, supporting three cases:


        **Important**: The returned URL is single-use only. Once a user visits the URL, no one else can access it.

        ## Use Cases

        ### 1. Basic Session (Minimum Parameters)

        **Required**: `destinationAddress`, `purchaseCurrency`, `destinationNetwork`


        **Returns**: Basic single-use onramp URL. The `quote` object will not be included in the response.

        ### 2. One-Click Onramp URL

        **Required**: Basic parameters + (`paymentAmount` OR `purchaseAmount`), `paymentCurrency`


        **Returns**: One-click onramp URL for streamlined checkout. The `quote` object will not be included in the response.

        ### 3. One-Click Onramp URL with Quote

        **Required**: One-Click Onramp parameters + `paymentMethod`, `country`, `subdivision`


        **Returns**: Complete pricing quote and one-click onramp URL. Both `session` and `quote` objects will be included in the response.


        **Note**: Only one of `paymentAmount` or `purchaseAmount` should be provided, not both. Providing both will result in an error. When `paymentAmount` is provided, the quote shows how much crypto the user will receive for the specified fiat amount (fee-inclusive). When `purchaseAmount` is provided, the quote shows how much fiat the user needs to pay for the specified crypto amount (fee-exclusive).'
      operationId: createOnrampSession
      tags:
      - Onramp
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/OnrampPartnerId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnrampSessionRequest'
      responses:
        '201':
          description: Onramp session created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/OnrampSession'
                  quote:
                    $ref: '#/components/schemas/OnrampQuote'
                required:
                - session
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Missing required parameters.
                invalid_destination_address:
                  value:
                    errorType: invalid_request
                    errorMessage: The destination address is not valid for the specified network.
                partner_id_not_permitted:
                  value:
                    errorType: invalid_request
                    errorMessage: The X-Onramp-Partner-Id header is only valid for apps registered as an Onramp aggregator.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                partner_not_found:
                  value:
                    errorType: not_found
                    errorMessage: The partner identified by the X-Onramp-Partner-Id header is blocked or does not belong to this app.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/onramp/limits:
    post:
      summary: Get onramp user limits
      x-audience: public
      description: 'Returns the transaction limits for an onramp user based on their payment method and user identifier. Use this API to show users their remaining purchase capacity before initiating an onramp transaction.

        Currently supports `GUEST_CHECKOUT_APPLE_PAY` payment method with phone number identification. The phone number must have been previously verified via OTP.'
      operationId: getOnrampUserLimits
      tags:
      - Onramp
      security:
      - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentMethodType:
                  $ref: '#/components/schemas/OnrampOrderPaymentMethodTypeId'
                userId:
                  type: string
                  description: The user identifier value. For `phone_number` type, this must be in E.164 format.
                  example: '+12055555555'
                userIdType:
                  $ref: '#/components/schemas/OnrampUserIdType'
              required:
              - paymentMethodType
              - userId
              - userIdType
      responses:
        '200':
          description: Successfully retrieved user limits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  limits:
                    type: array
                    description: The list of limits applicable to the user.
                    items:
                      $ref: '#/components/schemas/OnrampUserLimit'
                  limitUpgradeOptions:
                    type: array
                    description: The user's limit upgrade status and associated upgrade details. Omitted when limit upgrades are not available for the calling app or user. Use the [Request Limit Upgrade](https://docs.cdp.coinbase.com/api-reference/v2/rest-api/onramp/request-limits-upgrade) endpoint to request a limit upgrade.
                    items:
                      $ref: '#/components/schemas/OnrampLimitUpgradeOption'
                required:
                - limits
              examples:
                default:
                  value:
                    limits:
                    - limitType: weekly_spending
                      currency: USD
                      limit: '500'
                      remaining: '400'
                    - limitType: lifetime_transactions
                      limit: '15'
                      remaining: '12'
                    limitUpgradeOptions:
                    - status: unrequested
                      fields:
                      - ssnLast4
                      - dateOfBirth
                      limitUpgrades:
                      - limitType: weekly_spending
                        maxUpgrade: '2500'
                      - limitType: lifetime_transactions
                        maxUpgrade: '2147483647'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Must provide a valid payment method type and user identifier.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/onramp/limits/upgrade:
    post:
      summary: Request limit upgrade
      x-audience: public
      description: 'Requests a limit upgrade for an onramp user. Only phone number is currently supported as a userId.


        The default API mode submits identity information directly and returns HTTP 202 when the request is accepted. Embedded mode (`interactionMode: embedded`) returns a Coinbase-hosted `upgradeUrl` where the user enters identity information.


        The verification process is asynchronous. After calling this endpoint, use the Get Onramp User Limits endpoint to check the status in the `limitUpgradeOptions` array.


        **Prerequisites:**

        - The phone number must have been previously verified by your app via OTP. - Upgrades may not be available until a certain number of successful transactions by the user.


        **Supported fields:**

        - `ssnLast4`: Last 4 digits of the Social Security Number (no dashes or spaces).

        - `dateOfBirth`: Date of birth (day, month, year as zero-padded strings).'
      operationId: requestLimitsUpgrade
      tags:
      - Onramp
      security:
      - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnrampLimitUpgradeRequest'
            example:
              userId: '+12055555555'
              userIdType: phone_number
              fields:
                ssnLast4: '5678'
                dateOfBirth:
                  day: '15'
                  month: 08
                  year: '1990'
      responses:
        '200':
          description: Embedded limit upgrade URL created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampLimitUpgradeEmbeddedResponse'
        '202':
          description: Limit upgrade request accepted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid user identifier or fields.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
webhooks:
  onrampTransactionCreated:
    post:
      summary: Onramp transaction created
      description: Triggered when the `onramp.transaction.created` webhook event is emitted. Your API will receive a POST request at the webhook URL you configured.
      operationId: onrampTransactionCreatedWebhook
      security:
      - webhookSignature: []
