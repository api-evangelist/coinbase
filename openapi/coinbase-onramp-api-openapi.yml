          type: string
          description: The total fiat amount paid.
          example: '100.75'
        paymentSubtotal:
          type: string
          description: The fiat amount converted to crypto (excluding fees).
          example: '100'
        paymentCurrency:
          type: string
          description: The fiat currency used for payment.
          example: USD
        paymentMethod:
          type: string
          description: The payment method used.
          enum:
          - UNSPECIFIED
          - CARD
          - ACH_BANK_ACCOUNT
          - APPLE_PAY
          - FIAT_WALLET
          - CRYPTO_ACCOUNT
          - GUEST_CHECKOUT_CARD
          - PAYPAL
          - RTP
          - GUEST_CHECKOUT_APPLE_PAY
          - GUEST_CHECKOUT_GOOGLE_PAY
          example: GUEST_CHECKOUT_APPLE_PAY
        purchaseAmount:
          type: string
          description: The amount of crypto purchased.
          example: '100.000000'
        purchaseCurrency:
          type: string
          description: The crypto currency purchased.
          example: USDC
        fees:
          type: array
          description: Breakdown of fees for the order.
          items:
            $ref: '#/components/schemas/OrderFee'
          example:
          - feeType: FEE_TYPE_NETWORK
            feeAmount: '0.5'
            feeCurrency: USD
          - feeType: FEE_TYPE_EXCHANGE
            feeAmount: '0.25'
            feeCurrency: USD
        exchangeRate:
          type: string
          description: The exchange rate used for conversion.
          example: '1'
        destinationAddress:
          type: string
          description: The destination wallet address.
          example: '0x1234567890abcdef1234567890abcdef12345678'
        destinationNetwork:
          type: string
          description: The blockchain network for delivery.
          example: base
        status:
          type: string
          description: The status of the order.
          enum:
          - ONRAMP_ORDER_STATUS_UNSPECIFIED
          - ONRAMP_ORDER_STATUS_PENDING_AUTH
          - ONRAMP_ORDER_STATUS_PENDING_VERIFICATION
          - ONRAMP_ORDER_STATUS_PENDING_PAYMENT
          - ONRAMP_ORDER_STATUS_PROCESSING
          - ONRAMP_ORDER_STATUS_COMPLETED
          - ONRAMP_ORDER_STATUS_FAILED
          example: ONRAMP_ORDER_STATUS_COMPLETED
        txHash:
          type: string
          description: The onchain transaction hash (available once crypto is sent).
          example: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
        createdAt:
          type: string
          format: date-time
          description: When the order was created.
          example: '2025-09-10T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: When the order was last updated.
          example: '2025-09-10T10:35:00Z'
        partnerUserRef:
          type: string
          description: The partner user reference ID.
          example: example_user_ref
        partnerId:
          type: string
          description: The Onramp-issued identifier of the end partner this order was scoped to via the X-Onramp-Partner-Id header. Only present for orders created by an aggregator on behalf of a registered end partner.
          example: 1f1c19e8-d0e9-6443-b706-92a4d033d043
      required:
      - eventType
      - orderId
      - status
    OnrampUserAuthToken:
      type: string
      description: 'A reusable, PII-free token issued after a user completes verification in the embedded onramp flow. It encodes only the underlying verification IDs, no personal information. Pass it on subsequent orders to take a returning user straight to the pay button, skipping OTP when checking out to the same wallet.


        In the embedded flow, `phoneNumber`, `email`, `phoneNumberVerifiedAt`, and `agreementAcceptedAt` are handled by Coinbase in the hosted popup and may be omitted from the request even though they are required for the standard partner-verified flow. Reuse is best-effort: an invalid, expired, or different-wallet token still requires the user to verify. Valid for 60 days.'
      example: eyJ2ZXJpZmljYXRpb25JZHMiOlsidl9hYmMxMjMiLCJ2X2RlZjQ1NiJdfQ==
    OnrampLimitType:
      type: string
      description: "The type of limit:\n- `weekly_spending`: Rolling 7-day spending limit. The limit applies to the sum of all completed transactions \n  within a sliding 168-hour (7-day) window. As time passes, older transactions naturally expire from the window. \n  $500 is the default limit.\n- `lifetime_transactions`: All-time transaction count limit. Tracks the total number of completed transactions \n  across the user's entire history with no time-based expiration. Once the limit is reached, no further \n  transactions are allowed. 15 is the default limit.\n"
      enum:
      - weekly_spending
      - lifetime_transactions
      example: weekly_spending
    OfframpTransactionUpdatedEvent:
      x-event-type: offramp.transaction.updated
      allOf:
      - $ref: '#/components/schemas/OfframpTransactionPayload'
    OfframpTransactionSuccessEvent:
      x-event-type: offramp.transaction.success
      allOf:
      - $ref: '#/components/schemas/OfframpTransactionPayload'
    OnrampTransactionEvent:
      description: Webhook payload for all onramp transaction events (created, updated, success, failed). Shape depends on transaction type — standard flow (guest checkout / authorized) uses OnrampTransactionPayload, Headless API (Apple Pay / Google Pay) uses OnrampOrderPayload. Distinguish by presence of `orderId` (Headless) vs `transactionId` (standard).
      oneOf:
      - $ref: '#/components/schemas/OnrampTransactionPayload'
      - $ref: '#/components/schemas/OnrampOrderPayload'
    OnrampQuotePaymentMethodTypeId:
      type: string
      description: The type of payment method used to generate the onramp quote.
      enum:
      - CARD
      - ACH
      - APPLE_PAY
      - PAYPAL
      - FIAT_WALLET
      - CRYPTO_WALLET
      example: CARD
    OnrampPaymentLink:
      type: object
      description: 'A payment link to pay for an order.


        Please refer to the [Onramp docs](https://docs.cdp.coinbase.com/onramp-&-offramp/onramp-apis/onramp-overview) for details on how to integrate with the different payment link types.'
      properties:
        url:
          allOf:
          - $ref: '#/components/schemas/Url'
          description: The URL to the hosted widget the user should be redirected to. For certain payment link types you can append your own redirect_url query parameter to this URL to ensure the user is redirected back to your app after the widget completes.
          example: https://pay.coinbase.com/v2/api-onramp/apple-pay?sessionToken=MWYwNWQwODktZTZlYy02OTdlLTgzZTYtMTI3NzcyOWJhNjM3
        paymentLinkType:
          $ref: '#/components/schemas/OnrampPaymentLinkType'
      required:
      - url
      - paymentLinkType
    OnrampLimitUpgradeRequest:
      type: object
      description: Request to request a limits upgrade for a user.
      properties:
        userId:
          type: string
          description: The user identifier value. For `phone_number` type, this must be in E.164 format.
          example: '+12055555555'
        userIdType:
          $ref: '#/components/schemas/OnrampUserIdType'
        interactionMode:
          allOf:
          - $ref: '#/components/schemas/OnrampLimitUpgradeInteractionMode'
          default: api
          description: The interaction mode for the limit upgrade request. Defaults to `api`.
          example: api
        fields:
          $ref: '#/components/schemas/OnrampLimitUpgradeIdentityFields'
          description: Populate the properties that correspond to the `fields` array from the user's `OnrampLimitUpgradeOption`. Required in `api` mode. Omit in `embedded` mode — the user enters their identity information on the Coinbase-hosted upgrade page (see `interactionMode`), so any value sent here is rejected.
      required:
      - userId
      - userIdType
      example:
        userId: '+12055555555'
        userIdType: phone_number
        fields:
          ssnLast4: '5678'
          dateOfBirth:
            day: '15'
            month: 08
            year: '1990'
    BlockchainAddress:
      type: string
      minLength: 1
      maxLength: 128
      description: A blockchain address. Format varies by network (e.g., 0x-prefixed for EVM, base58 for Solana).
      example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
    OnrampOrderFee:
      type: object
      description: A fee associated with an order.
      properties:
        type:
          type: string
          enum:
          - FEE_TYPE_NETWORK
          - FEE_TYPE_EXCHANGE
          description: The type of fee.
          example: FEE_TYPE_NETWORK
        amount:
          type: string
          description: The amount of the fee.
          example: '0.95'
        currency:
          type: string
          description: The currency of the fee.
          example: USDC
      required:
      - type
      - amount
      - currency
    OnrampOrder:
      type: object
      description: An Onramp order.
      properties:
        orderId:
          type: string
          description: The ID of the onramp order.
          example: 123e4567-e89b-12d3-a456-426614174000
        paymentTotal:
          type: string
          description: The total amount of fiat to be paid, inclusive of any fees.
          example: '100.75'
        paymentSubtotal:
          type: string
          description: The amount of fiat to be converted to crypto.
          example: '100'
        paymentCurrency:
          type: string
          description: The fiat currency to be converted to crypto.
          example: USD
        paymentMethod:
          $ref: '#/components/schemas/OnrampOrderPaymentMethodTypeId'
        purchaseAmount:
          type: string
          description: The amount of crypto to be purchased.
          example: '100.000000'
        purchaseCurrency:
          type: string
          description: The crypto currency to be purchased.
          example: USDC
        fees:
          type: array
          description: The fees associated with the order.
          items:
            $ref: '#/components/schemas/OnrampOrderFee'
          example:
          - type: FEE_TYPE_EXCHANGE
            amount: '0.5'
            currency: USD
          - type: FEE_TYPE_NETWORK
            amount: '0.25'
            currency: USD
        exchangeRate:
          type: string
          description: The exchange rate used to convert fiat to crypto i.e. the crypto value of one fiat.
          example: '1'
        destinationAddress:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          description: The destination address to send the crypto to.
          example: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
        destinationNetwork:
          type: string
          description: The network to send the crypto on.
          example: base
        status:
          $ref: '#/components/schemas/OnrampOrderStatus'
        txHash:
          type: string
          description: The transaction hash of the order (only available once crypto has been sent).
          example: '0x363cd3b3d4f49497cf5076150cd709307b90e9fc897fdd623546ea7b9313cecb'
        createdAt:
          type: string
          description: The date and time the order was created.
          example: '2025-04-24T00:00:00Z'
        updatedAt:
          type: string
          description: The date and time the order was last updated.
          example: '2025-04-24T00:00:00Z'
        partnerUserRef:
          type: string
          description: The partner user reference ID.
          example: user123
        partnerId:
          type: string
          description: The Onramp-issued identifier of the end partner this order was scoped to via the X-Onramp-Partner-Id header. Only present for orders created by an aggregator on behalf of a registered end partner.
          example: 1f1c19e8-d0e9-6443-b706-92a4d033d043
      required:
      - orderId
      - paymentTotal
      - paymentSubtotal
      - paymentCurrency
      - paymentMethod
      - purchaseAmount
      - purchaseCurrency
      - fees
      - exchangeRate
      - destinationAddress
      - destinationNetwork
      - status
      - createdAt
      - updatedAt
    OnrampOrderPaymentMethodTypeId:
      type: string
      description: The type of payment method to be used to complete an onramp order.
      enum:
      - GUEST_CHECKOUT_APPLE_PAY
      - GUEST_CHECKOUT_GOOGLE_PAY
      example: GUEST_CHECKOUT_APPLE_PAY
    OnrampUserIdType:
      type: string
      description: 'The type of user identifier:

        - `phone_number`: A phone number in E.164 format associated with an onramp user.

        '
      enum:
      - phone_number
      example: phone_number
    OfframpTransactionCreatedEvent:
      x-event-type: offramp.transaction.created
      allOf:
      - $ref: '#/components/schemas/OfframpTransactionPayload'
    CapabilityName:
      type: string
      description: 'The name of a capability. Capabilities represent granular functional permissions

        that determine what actions a customer can perform. Each capability must be

        explicitly requested before use.

        '
      enum:
      - custodyCrypto
      - custodyFiat
      - custodyStablecoin
      - tradeCrypto
      - tradeStablecoin
      - transferCrypto
      - transferFiat
      - transferStablecoin
      x-enum-varnames:
      - CustodyCrypto
      - CustodyFiat
      - CustodyStablecoin
      - TradeCrypto
      - TradeStablecoin
      - TransferCrypto
      - TransferFiat
      - TransferStablecoin
      example: custodyCrypto
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      description: A phone number in [E.164](https://en.wikipedia.org/wiki/E.164) format.
      example: '+12055555555'
    OnrampLimitUpgradeEmbeddedResponse:
      type: object
      description: A Coinbase-hosted URL for collecting limit upgrade identity fields.
      properties:
        upgradeUrl:
          allOf:
          - $ref: '#/components/schemas/Url'
          description: The Coinbase-hosted URL where the user enters identity information for the limit upgrade. Treat the session token in this URL as opaque.
          example: https://pay.coinbase.com/v2/api-onramp/upgrade-limits?sessionToken=MWYwNWQwODktZTZlYy02OTdlLTgzZTYtMTI3NzcyOWJhNjM3
        expiresAt:
          type: string
          format: date-time
          description: The time at which the hosted limit upgrade URL expires. Request a new upgrade URL after this time.
          example: '2026-06-21T00:05:00Z'
      required:
      - upgradeUrl
      - expiresAt
    OnrampTransactionSuccessEvent:
      x-event-type: onramp.transaction.success
      allOf:
      - $ref: '#/components/schemas/OnrampTransactionEvent'
    OnrampLimitUpgradeStatus:
      type: string
      description: 'The status of verification:

        - `unrequested`: The limit upgrade has not been submitted.

        - `resubmit`: One or more identity fields must be resubmitted.

        - `pending`: The submitted identity fields are pending review.

        - `active`: The limit upgrade is active.

        - `inactive`: The limit upgrade was rejected and cannot be resubmitted.

        '
      enum:
      - unrequested
      - resubmit
      - pending
      - active
      - inactive
      example: unrequested
  responses:
    UnauthorizedError:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                errorType: unauthorized
                errorMessage: The request is not properly authenticated.
    ForbiddenError:
      description: User forbidden from performing the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                errorType: forbidden
                errorMessage: User forbidden from performing the action.
    RateLimitExceeded:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limit_exceeded:
              value:
                errorType: rate_limit_exceeded
                errorMessage: Rate limit exceeded.
    IdempotencyError:
      description: Idempotency key conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            idempotency_error:
              value:
                errorType: idempotency_error
                errorMessage: Idempotency key '8e03978e-40d5-43e8-bc93-6894a57f9324' was already used with a different request payload. Please try again with a new idempotency key.
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal_server_error:
              value:
                errorType: internal_server_error
                errorMessage: An internal server error occurred. Please try again later.
  parameters:
    OnrampPartnerId:
      name: X-Onramp-Partner-Id
      in: header
      required: false
      description: The Onramp-issued identifier of a disclosed end partner, scoped to an aggregator's developer app. Aggregators integrating Onramp on behalf of multiple end partners set this header to attribute a request to one of their registered partners; omit it for standard, non-aggregator integrations. Only honored for developer apps registered as an aggregator — requires Onramp aggregator onboarding, including registration of each end partner. Contact the Onramp team for access.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: 9f3a2b7c-4d5e-4a1b-8c2d-3e4f5a6b7c8d
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: 'An optional string request header for making requests safely retryable.

        When included, duplicate requests with the same key will return identical responses.

        Refer to our [Idempotency docs](https://docs.cdp.coinbase.com/api-reference/v2/idempotency) for more information on using idempotency keys.

        '
      schema:
        type: string
        maxLength: 128
        minLength: 1
      example: 8e03978e-40d5-43e8-bc93-6894a57f9324
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT signed using your CDP API Key Secret, encoded in base64. Refer to the [Generate Bearer Token](https://docs.cdp.coinbase.com/api-reference/v2/authentication#2-generate-bearer-token) section of our Authentication docs for information on how to generate your Bearer Token.
    endUserAuth:
      x-audience: public
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT signed using the developer's own JWT private key (in the case of JWT authentication), or an end user JWT signed by CDP, encoded in base64. This is used for End User Account APIs.
    unauthenticated:
      x-audience: public
      type: http
      scheme: none
      description: This security scheme is used for APIs that do not require authentication, such as End User Auth flows used to initiate authentication or public, read-only endpoints.
    webhookSignature:
      x-audience: public
      type: apiKey
      in: header
      name: X-Hook0-Signature
      description: 'HMAC-SHA256 signature of the raw request body, computed using your webhook secret. Webhook receivers should always verify this header before processing the event. The header value is hex-encoded and prefixed by the algorithm and timestamp, e.g. `t=1700000000,v1=abc123...` (refer to the Webhook Security docs for the exact verification algorithm).


        This scheme applies to webhook delivery (outbound POSTs from CDP to your endpoint), not to inbound CDP API requests.'
