openapi: 3.2.0
info:
  title: Coinbase Developer Platform Payment Methods API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Payment Methods
  x-audience: public
  x-slo-tier:
    tier: beta
  description: The Payment Methods APIs enable you to create and manage payment methods for accounts. Payment methods represent ways to send and receive payments, such as ACH transfers and Fedwire transfers. These APIs allow you to create, list, and retrieve payment method details for use in payment transfers and transactions.
paths:
  /v2/payment-methods:
    get:
      x-audience: public
      summary: List payment methods
      description: 'List payment methods linked to your entity. Payment methods represent external financial instruments that can be used as a target for transfers. The list will not include disabled or deleted payment methods.


        **Currently Supported Types:**

        - `fedwire`: Domestic USD wire transfers

        - `swift`: International wire transfers

        - `sepa`: SEPA EUR transfers


        **Note:** Payment methods are created and verified through your linked CDP entity. Currently, fetching payment methods is only supported for Prime investment vehicles linked to CDP.'
      operationId: listPaymentMethods
      tags:
      - Payment Methods
      security:
      - apiKeyAuth: []
      x-required-permissions:
        permissions:
        - accounts:read@entity
        enforcement: any
      parameters:
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Successfully listed payment methods.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - paymentMethods
                  properties:
                    paymentMethods:
                      type: array
                      description: The list of payment methods.
                      items:
                        $ref: '#/components/schemas/payment-methods_PaymentMethod'
                - $ref: '#/components/schemas/ListResponse'
              example:
                paymentMethods:
                - paymentMethodId: paymentMethod_8e03978e-40d5-43e8-bc93-6894a57f9324
                  paymentRail: fedwire
                  active: true
                  createdAt: '2024-01-15T10:30:00Z'
                  updatedAt: '2024-01-15T10:30:00Z'
                  fedwire:
                    asset: usd
                    bankName: ALLY BANK
                    accountLast4: '1234'
                    routingNumber: '124003116'
                - paymentMethodId: paymentMethod_def45678-1234-5678-9abc-def012345678
                  paymentRail: swift
                  active: true
                  createdAt: '2024-01-15T10:30:00Z'
                  updatedAt: '2024-01-15T10:30:00Z'
                  swift:
                    asset: eur
                    bankName: Deutsche Bank
                    accountLast4: '5678'
                    ibanLast4: '5678'
                    bic: DEUTDEFF
                - paymentMethodId: paymentMethod_abc12345-6789-0abc-def0-123456789abc
                  paymentRail: sepa
                  active: true
                  createdAt: '2024-01-15T10:30:00Z'
                  updatedAt: '2024-01-15T10:30:00Z'
                  sepa:
                    asset: eur
                    bankName: ING Bank
                    ibanLast4: '4300'
                    bic: INGBNL2A
                nextPageToken: eyJsYXN0X2lkIjogImFiYzEyMyJ9
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid page token format.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/payment-methods/{paymentMethodId}:
    get:
      x-audience: public
      summary: Get payment method
      description: Get details of a specific payment method by its ID. Returns 404 if the payment method is not found or not owned by the requesting entity.
      operationId: getPaymentMethod
      security:
      - apiKeyAuth: []
      x-required-permissions:
        permissions:
        - accounts:read@entity
        enforcement: any
      tags:
      - Payment Methods
      parameters:
      - name: paymentMethodId
        in: path
        required: true
        description: The unique identifier of the payment method.
        schema:
          $ref: '#/components/schemas/PaymentMethodId'
        example: paymentMethod_8e03978e-40d5-43e8-bc93-6894a57f9324
      responses:
        '200':
          description: Successfully retrieved payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment-methods_PaymentMethod'
              examples:
                fedwire:
                  summary: Fedwire payment method
                  value:
                    paymentMethodId: paymentMethod_8e03978e-40d5-43e8-bc93-6894a57f9324
                    paymentRail: fedwire
                    active: true
                    createdAt: '2024-01-15T10:30:00Z'
                    updatedAt: '2024-01-15T10:30:00Z'
                    fedwire:
                      asset: usd
                      bankName: ALLY BANK
                      accountLast4: '1234'
                      routingNumber: '124003116'
                swift:
                  summary: SWIFT payment method
                  value:
                    paymentMethodId: paymentMethod_def45678-1234-5678-9abc-def012345678
                    paymentRail: swift
                    active: true
                    createdAt: '2024-01-15T10:30:00Z'
                    updatedAt: '2024-01-15T10:30:00Z'
                    swift:
                      asset: eur
                      bankName: Deutsche Bank
                      accountLast4: '5678'
                      ibanLast4: '5678'
                      bic: DEUTDEFF
                sepa:
                  summary: SEPA payment method
                  value:
                    paymentMethodId: paymentMethod_abc12345-6789-0abc-def0-123456789abc
                    paymentRail: sepa
                    active: true
                    createdAt: '2024-01-15T10:30:00Z'
                    updatedAt: '2024-01-15T10:30:00Z'
                    sepa:
                      asset: eur
                      bankName: ING Bank
                      ibanLast4: '4300'
                      bic: INGBNL2A
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid payment method ID format.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Payment method not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Payment method not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
