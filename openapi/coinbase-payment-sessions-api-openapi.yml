    IneligibleWalletAuthorizationAddress:
      type: object
      title: Ineligible Wallet Authorization Address
      description: A requested payer wallet address that has no eligible authorization option for this payment session, along with a machine- and human-readable reason.
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          description: The requested payer wallet address that has no eligible authorization option.
          example: '0xDeF9876543210FeDcBa9876543210FedcBa987654'
        code:
          type: string
          description: A machine-readable code indicating why this address has no eligible authorization option. The enum is closed — any value the server returns must be listed below. Adding a new code is a deliberate, coordinated API change; clients receiving an undocumented value should treat it as a server violating the spec.
          enum:
          - insufficient_funds
          - superseded_by_preferred_option
          x-enum-descriptions:
          - The address does not hold enough of the session asset on a supported source network to cover the session amount.
          - The address was superseded because a preferred funding option was selected instead.
          example: insufficient_funds
        message:
          type: string
          description: A human-readable, English-language description of why this address has no eligible authorization option. Suitable for surfacing in product UIs — does not contain personally identifiable information or internal infrastructure details. Clients that need localized strings should dispatch on `code` and provide their own translations.
          example: The payer does not have sufficient funds.
        fundsRequired:
          type: array
          description: The funding options for this address, one entry per (network, asset) combination the payer could fund to become eligible. Only present when `code` is `insufficient_funds`, and honors the request's `network` and `asset` filters. May be an empty array.
          items:
            $ref: '#/components/schemas/WalletAuthorizationFundsRequirement'
          example:
          - asset: usdc
            network: base
            currentBalance: '0.40'
            requiredBalance: '1.00'
          - asset: usdc
            network: ethereum
            currentBalance: '0.00'
            requiredBalance: '1.00'
      required:
      - address
      - code
      - message
      example:
        address: '0xDeF9876543210FeDcBa9876543210FedcBa987654'
        code: insufficient_funds
        message: The payer does not have sufficient funds.
        fundsRequired:
        - asset: usdc
          network: base
          currentBalance: '0.40'
          requiredBalance: '1.00'
        - asset: usdc
          network: ethereum
          currentBalance: '0.00'
          requiredBalance: '1.00'
