components:
  schemas:
    PaymentTargetNetwork:
      type: string
      description: The blockchain network supported for payment session targets. Testnet networks are only available in sandbox environments.
      enum:
      - base
      - base-sepolia
      example: base
    AcceptancePaymentSessionCaptureFailedEvent:
      x-event-type: acceptance.payment_session.capture_failed
      example:
        eventType: acceptance.payment_session.capture_failed
        eventId: 890l1234-l56i-89k0-h123-193381841777
        timestamp: '2025-06-15T12:21:00Z'
        data:
          paymentSession:
            paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            entityId: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
            amount: '1.00'
            asset: usdc
            source:
              address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
              network: base
              asset: usdc
            target:
              address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
              network: base
            autoCapture: false
            expiries:
              authorizationExpiresAt: '2025-12-31T23:59:59.000Z'
              captureExpiresAt: '2026-01-15T23:59:59.000Z'
              refundExpiresAt: '2026-02-15T23:59:59.000Z'
            status: capture_failed
            balances:
              capturable: '1.00'
              captured: '0'
              refundable: '0'
              refunded: '0'
            externalReferenceId: merchant-order-abc123
            metadata:
              customer_id: cust_12345
              order_reference: order-67890
            createdAt: '2025-06-15T12:00:00.000Z'
            updatedAt: '2025-06-15T12:21:00.000Z'
          capture:
            captureId: capture_93d980d2-95f2-55fe-b9d3-2bd340cf10be
            status: failed
            amount: '1.00'
            finalCapture: true
            error:
              code: capture_failed
              message: The capture could not be completed.
              occurredAt: '2025-06-15T12:21:00.000Z'
            createdAt: '2025-06-15T12:20:00.000Z'
            updatedAt: '2025-06-15T12:21:00.000Z'
      allOf:
      - $ref: '#/components/schemas/PaymentSessionEventBase'
      - type: object
        properties:
          eventType:
            type: string
            description: The type of webhook event.
            enum:
            - acceptance.payment_session.capture_failed
            example: acceptance.payment_session.capture_failed
        required:
        - eventType
    Asset:
      type: string
      minLength: 1
      maxLength: 42
      description: The symbol of the asset (e.g., eth, usd, usdc, usdt).
      example: usd
    RefundWallet:
      type: object
      title: Refund Wallet
      description: An onchain address from which funds are pulled to fund the refund. Network and asset are inferred from the payment session.
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          description: The onchain crypto address from which to fund the refund.
          example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
      required:
      - address
    Refund:
      type: object
      description: A return of previously captured funds to the payer. Multiple partial refunds are allowed up to the total captured amount.
      properties:
        refundId:
          allOf:
          - $ref: '#/components/schemas/RefundId'
          description: The unique identifier of the refund.
          example: refund_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        paymentSessionId:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionId'
          description: The ID of the payment session this refund belongs to.
          example: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        source:
          allOf:
          - $ref: '#/components/schemas/RefundSource'
          description: The source from which the refund is funded. Can be a CDP account or an onchain address.
          example:
            accountId: account_af2937b0-9846-4fe7-bfe9-ccc22d935114
            asset: usdc
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentActionStatus'
          description: The current status of the refund.
          example: pending
        amount:
          type: string
          description: A decimal representation of the refunded amount, denominated in the session's `asset`.
          example: '0.50'
        reason:
          type: string
          description: The reason for the refund.
          example: Customer returned the item.
        error:
          $ref: '#/components/schemas/PaymentError'
        metadata:
          $ref: '#/components/schemas/Metadata'
        externalReferenceId:
          allOf:
          - $ref: '#/components/schemas/ExternalReferenceId'
          description: A merchant-provided internal identifier for this refund, from the merchant's own system—not visible to the payer. Present only when supplied on the create refund request.
          example: merchant-refund-abc123
        customerDisplay:
          allOf:
          - $ref: '#/components/schemas/OperationCustomerDisplay'
          description: Customer-facing display data for this refund, shown to the payer. Present when supplied on the create refund request or when the session's `orderCode` fallback applies; otherwise omitted.
        onchainTransactions:
          type: array
          description: The onchain transactions associated with this refund.
          items:
            $ref: '#/components/schemas/OnchainTransaction'
          example:
          - transactionHash: '0x012345678901234567890abcdef1234567890abcdef1234567890abcdef1234'
            network: base
        createdAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the refund was created.
          example: '2025-06-15T12:40:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the refund was last updated.
          example: '2025-06-15T12:41:00.000Z'
      example:
        refundId: refund_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        source:
          accountId: account_af2937b0-9846-4fe7-bfe9-ccc22d935114
          asset: usdc
        status: succeeded
        amount: '0.50'
        reason: Customer returned the item.
        onchainTransactions:
        - transactionHash: '0x012345678901234567890abcdef1234567890abcdef1234567890abcdef1234'
          network: base
        metadata:
          customer_id: cust_12345
        createdAt: '2025-06-15T12:40:00.000Z'
        updatedAt: '2025-06-15T12:41:00.000Z'
    AcceptancePaymentSessionRefundFailedEvent:
      x-event-type: acceptance.payment_session.refund_failed
      example:
        eventType: acceptance.payment_session.refund_failed
        eventId: 123o4567-o89l-12n3-k456-426614174000
        timestamp: '2025-06-15T12:41:00Z'
        data:
          paymentSession:
            paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            entityId: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
            amount: '1.00'
            asset: usdc
            source:
              address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
              network: base
              asset: usdc
            target:
              address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
              network: base
            autoCapture: false
            expiries:
              authorizationExpiresAt: '2025-12-31T23:59:59.000Z'
              captureExpiresAt: '2026-01-15T23:59:59.000Z'
              refundExpiresAt: '2026-02-15T23:59:59.000Z'
            status: refund_failed
            balances:
              capturable: '0'
              captured: '1.00'
              refundable: '1.00'
              refunded: '0'
            externalReferenceId: merchant-order-abc123
            metadata:
              customer_id: cust_12345
              order_reference: order-67890
            createdAt: '2025-06-15T12:00:00.000Z'
            updatedAt: '2025-06-15T12:41:00.000Z'
          refund:
            refundId: refund_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            status: failed
            amount: '0.50'
            reason: Customer returned the item.
            error:
              code: refund_failed
              message: The refund could not be completed.
              occurredAt: '2025-06-15T12:41:00.000Z'
            createdAt: '2025-06-15T12:40:00.000Z'
            updatedAt: '2025-06-15T12:41:00.000Z'
      allOf:
      - $ref: '#/components/schemas/PaymentSessionEventBase'
      - type: object
        properties:
          eventType:
            type: string
            description: The type of webhook event.
            enum:
            - acceptance.payment_session.refund_failed
            example: acceptance.payment_session.refund_failed
        required:
        - eventType
    PaymentSessionSummary:
      type: object
      description: A summary of the payment session included in webhook payloads. Contains the session identity, amount, asset, payer and recipient information, execution behavior, expiry deadlines, current status, running balance totals, and any metadata originally provided when the session was created.
      properties:
        paymentSessionId:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionId'
          description: The unique identifier of the payment session.
          example: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        entityId:
          type: string
          description: The ID of the entity that owns the payment session.
          example: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
        amount:
          type: string
          description: A decimal representation of the payment amount, denominated in `asset`.
          example: '1.00'
        asset:
          allOf:
          - $ref: '#/components/schemas/Asset'
          description: The symbol of the asset for the payment amount.
          example: usdc
        source:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionSource'
          description: The payer's address and network. Set after a successful authorization. Not present before authorization.
          example:
            address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
            network: base
            asset: usdc
        target:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionTarget'
          description: The recipient of the payment.
          example:
            address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            network: base
        autoCapture:
          type: boolean
          description: When true, a capture is automatically created after a successful authorization.
          example: false
        expiries:
          allOf:
          - $ref: '#/components/schemas/PaymentExpiries'
          description: Deadline timestamps for authorization, capture, and refund windows.
          example:
            authorizationExpiresAt: '2025-12-31T23:59:59.000Z'
            captureExpiresAt: '2026-01-15T23:59:59.000Z'
            refundExpiresAt: '2026-02-15T23:59:59.000Z'
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionStatus'
          description: The current status of the payment session at the time the event was emitted.
          example: authorization_succeeded
        balances:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionBalances'
          description: Running balance totals for the payment session at the time the event was emitted.
          example:
            capturable: '1.00'
            captured: '0'
            refundable: '0'
            refunded: '0'
        externalReferenceId:
          type: string
          maxLength: 256
          description: A merchant-provided internal identifier for this payment session, from the merchant's own system—not visible to the payer. It must not contain personally identifiable information (PII) or payment credentials.
          example: merchant-order-abc123
        customerDisplay:
          $ref: '#/components/schemas/CustomerDisplay'
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the payment session was created.
          example: '2025-06-15T12:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the payment session was last updated.
          example: '2025-06-15T12:05:00.000Z'
      required:
