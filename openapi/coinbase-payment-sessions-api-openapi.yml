                mandate_invalid_status:
                  summary: The mandate is not in approval_succeeded status
                  value:
                    errorType: mandate_invalid_status
                    errorMessage: Mandate must be in approval_succeeded status to authorize against.
                mandate_canceled:
                  summary: The mandate has been canceled
                  value:
                    errorType: mandate_canceled
                    errorMessage: Mandate has been canceled and cannot be authorized against.
                mandate_revoked:
                  summary: The mandate has been revoked
                  value:
                    errorType: mandate_revoked
                    errorMessage: Mandate has been revoked and cannot be authorized against.
                exceeds_policy:
                  summary: The charge exceeds the mandate's policy
                  value:
                    errorType: mandate_policy_violation
                    errorMessage: Amount exceeds the mandate's maxPerAuthorization limit.
                idempotency_error:
                  value:
                    errorType: idempotency_error
                    errorMessage: Idempotency key '8e03978e-40d5-43e8-bc93-6894a57f9324' was already used with a different request payload. Please try again with a new idempotency key.
