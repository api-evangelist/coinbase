    Erc20ApprovalPayload:
      type: object
      title: ERC-20 Approval Payload
      description: An ERC-20 approval transaction payload. The payer must send `data` as an EVM transaction via `eth_sendTransaction` and return the resulting transaction hash.
      properties:
        payloadId:
          type: string
          description: The unique identifier of the payload.
          example: payload_bf3948c1-a957-5gh8-cgf0-ddd33e046225
        type:
          type: string
          description: The payload type.
          enum:
          - erc20_approval
          example: erc20_approval
        data:
          type: object
          description: An EVM transaction object. Send via `eth_sendTransaction`.
          properties:
            chainId:
              type: integer
              description: The EVM chain ID for the transaction.
              example: 1
            to:
              type: string
              pattern: ^0x[a-fA-F0-9]{40}$
              description: The 0x-prefixed address of the ERC-20 token contract to approve.
              example: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
            data:
              type: string
              description: The ABI-encoded `approve()` calldata.
              example: '0x095ea7b3000000000000000000000000000000000022d473030f116ddee9f6b43ac78ba3000000000000000000000000ffffffffffffffffffffffffffffffffffffffff'
            value:
              type: string
              description: The native token value to send (always `"0"` for approvals).
              example: '0'
            gas:
              type: string
              description: The estimated gas limit for the transaction.
              example: '63804'
            maxFeePerGas:
              type: string
              description: The maximum fee per gas unit (EIP-1559).
              example: '1751588354'
            maxPriorityFeePerGas:
              type: string
              description: The maximum priority fee per gas unit (EIP-1559).
              example: '1000000000'
          required:
          - chainId
          - to
          - data
          - value
          example:
            chainId: 1
            to: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
            data: '0x095ea7b3000000000000000000000000000000000022d473030f116ddee9f6b43ac78ba3000000000000000000000000ffffffffffffffffffffffffffffffffffffffff'
            value: '0'
            gas: '63804'
            maxFeePerGas: '1751588354'
            maxPriorityFeePerGas: '1000000000'
      required:
      - payloadId
      - type
      - data
      example:
        payloadId: payload_bf3948c1-a957-5gh8-cgf0-ddd33e046225
        type: erc20_approval
        data:
          chainId: 1
          to: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
          data: '0x095ea7b3000000000000000000000000000000000022d473030f116ddee9f6b43ac78ba3000000000000000000000000ffffffffffffffffffffffffffffffffffffffff'
          value: '0'
          gas: '63804'
          maxFeePerGas: '1751588354'
          maxPriorityFeePerGas: '1000000000'
    MandateAuthorizationRequest:
      type: object
      description: A request to authorize a payment session against a mandate in `approval_succeeded` status, using the mandate's existing approval. No fresh signature is required. The charge must fall within the mandate's `policy`.
      properties:
        mandateId:
          allOf:
          - $ref: '#/components/schemas/MandateId'
          description: The ID of the mandate to authorize against. Must be in `approval_succeeded` status.
          example: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        metadata:
          $ref: '#/components/schemas/Metadata'
        customerDisplay:
          allOf:
          - $ref: '#/components/schemas/OperationCustomerDisplay'
          description: Optional customer-facing display data for this authorization, shown to the payer. Falls back to the session's `orderCode` when `referenceCode` is omitted.
          example:
            referenceCode: REF-ABC123
        externalReferenceId:
          allOf:
          - $ref: '#/components/schemas/ExternalReferenceId'
          description: An optional merchant-provided internal identifier for this mandate authorization, from the merchant's own system—not visible to the payer.
          example: merchant-authorization-abc123
      required:
      - mandateId
      example:
        mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
    CustomerDisplay:
      type: object
      title: Customer Display
      description: Merchant-provided display data shown to the payer during checkout. All fields are informational only — stored and returned as-is, with no effect on payment processing, settlement, or validation.
      properties:
        merchantName:
          type: string
          maxLength: 128
          description: The merchant name to display on the payment UI. When provided, this overrides the default name derived from the entity's profile. Useful when a merchant operates multiple storefronts or brands under a single entity.
          example: Acme Store
        displayAmount:
          type: object
          description: The amount to present to the payer, which may differ from the authoritative settlement amount and asset. Commonly used when the payer's local currency differs from the settlement currency (e.g., charging in USD but displaying the equivalent in CAD). Stored and returned as-is — no cross-validation is performed against the authoritative `amount` and `asset`. Both `amount` and `currency` must be provided together.
          required:
          - amount
          - currency
          properties:
            amount:
              type: string
              description: The display amount as a decimal string (e.g., `"1.37"`).
              example: '1.37'
            currency:
              type: string
              description: An ISO 4217 currency code in lowercase for the display amount (e.g., `cad`, `usd`).
              example: cad
          example:
            amount: '1.37'
            currency: cad
        orderCode:
          type: string
          maxLength: 128
          description: A customer-visible code for the overall order. When omitted, CDP generates one and returns it. It must not contain personally identifiable information (PII) or payment credentials.
          example: ORDER-ABC123
      example:
        merchantName: Acme Store
        displayAmount:
          amount: '1.37'
          currency: cad
    WalletAuthorizationRequest:
      type: object
      description: A request to authorize a payment session using a wallet. The payer selects one of the options returned by the wallet authorization options endpoint and submits the signed payloads.
      properties:
        optionId:
          type: string
          description: The identifier of the chosen authorization option. Must match an `optionId` from the wallet authorization options response.
          example: opt_a1b2c3d4-e5f6-7890-abcd-ef1234567890
        signedPayloads:
          type: array
          description: The processed payloads from the payer, corresponding to the payloads in the selected authorization option.
          items:
            $ref: '#/components/schemas/OnchainSignedPayload'
          example:
          - payloadId: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
            signature: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
        metadata:
          $ref: '#/components/schemas/Metadata'
        customerDisplay:
          allOf:
          - $ref: '#/components/schemas/OperationCustomerDisplay'
          description: Optional customer-facing display data for this authorization, shown to the payer. Falls back to the session's `orderCode` when `referenceCode` is omitted.
          example:
            referenceCode: REF-ABC123
        externalReferenceId:
          allOf:
          - $ref: '#/components/schemas/ExternalReferenceId'
          description: An optional merchant-provided internal identifier for this wallet authorization, from the merchant's own system—not visible to the payer.
          example: merchant-authorization-abc123
      required:
      - optionId
      - signedPayloads
      example:
        optionId: opt_a1b2c3d4-e5f6-7890-abcd-ef1234567890
        signedPayloads:
        - payloadId: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
          signature: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
    CreateRefundRequest:
      type: object
      description: A request to create a refund for a payment session.
