openapi: 3.2.0
info:
  title: Coinbase Developer Platform Payment Sessions API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Payment Sessions
  x-audience: public
  x-slo-tier:
    tier: ga
  description: 'Payment Sessions track the full lifecycle of a merchant payment, from authorization through capture, void, or refund. Each session records every operation and balance change across its lifecycle.


    **Who initiates an authorization.** A session can be authorized in four ways, split by who acts:


    - **Customer-initiated:** the payer authorizes at payment time by signing. Use **Authorize a payment session with a wallet** or **Authorize a payment session with x402**. These calls are unauthenticated because the payer''s signature is the authorization.


    - **Merchant-initiated:** the merchant charges against an authorization the payer granted earlier, with the payer no longer present. Use **Authorize a payment session with a mandate** (draws on a mandate''s standing spending allowance) or **Authorize a payment session with a Coinbase account** (charges a Coinbase account the payer linked over OAuth).


    Creating, listing, canceling, capturing, voiding, and refunding a session are merchant actions authenticated with your API key.'
paths:
  /v2/payment-sessions:
    post:
      summary: Create a payment session
      description: 'Creates a payment session that defines what is being paid — amount, asset, and target. Optionally configure execution behavior, expiry deadlines, redirect URLs, and metadata.


        If expiry deadlines are omitted, sensible defaults are applied (1 day for authorization, 7 days for capture, 30 days for refund). Expiries must be in ascending order — see the `expiries` object for details and constraints.


        Returns the session in `created` status. Next step: call one of the authorization endpoints (wallet or Coinbase) to authorize the payment.'
      operationId: createPaymentSession
      x-audience: public
      tags:
      - Payment Sessions
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentSessionRequest'
            examples:
              wallet_target:
                summary: Payment session with a wallet target
                value:
                  amount: '1.00'
                  asset: usdc
                  target:
                    address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                    network: base
                  autoCapture: false
                  externalReferenceId: merchant-order-abc123
              wallet_target_with_display:
                summary: Payment session with merchant-provided display data
                value:
                  amount: '1.00'
                  asset: usdc
                  target:
                    address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                    network: base
                  autoCapture: false
                  externalReferenceId: merchant-order-abc123
                  customerDisplay:
                    merchantName: Acme Store
                    displayAmount:
                      amount: '1.37'
                      currency: cad
              account_target:
                summary: Payment session with an account target
                value:
                  amount: '1.00'
                  asset: usdc
                  target:
                    accountId: account_af2937b0-9846-4fe7-bfe9-ccc22d935114
                    asset: usd
                  autoCapture: false
                  externalReferenceId: merchant-order-abc123
      responses:
        '200':
          description: Successfully created payment session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
              examples:
                wallet_target:
                  summary: Payment session created with a wallet target
                  value:
                    paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                    entityId: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
