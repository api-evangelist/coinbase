      example:
        code: insufficient_funds
        message: The payer does not have sufficient funds.
        occurredAt: '2025-06-15T12:00:00.000Z'
    MandateId:
      type: string
      pattern: ^mandate_[a-f0-9\-]{36}$
      description: The ID of the mandate, a UUID prefixed by `mandate_`.
      example: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
    CreatePaymentSessionRequest:
      type: object
      description: A request to create a new payment session.
      properties:
        amount:
          type: string
          description: A decimal representation of the payment amount, denominated in `asset`.
          example: '1.00'
        asset:
          allOf:
          - $ref: '#/components/schemas/Asset'
          description: The symbol of the asset for the payment amount.
          example: usdc
        target:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionTarget'
          description: The target of the payment session.
          example:
            address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            network: base
        expiries:
          $ref: '#/components/schemas/PaymentExpiries'
        redirect:
          $ref: '#/components/schemas/PaymentRedirect'
        autoCapture:
          type: boolean
          description: When true, a capture is automatically created after a successful authorization. When false or omitted, the merchant must create captures manually via the captures endpoint.
          default: false
          example: false
        externalReferenceId:
          type: string
          maxLength: 256
          description: A merchant-provided internal identifier for this payment session, from the merchant's own system—not visible to the payer. It must not contain personally identifiable information (PII) or payment credentials.
          example: merchant-order-abc123
        customerDisplay:
          $ref: '#/components/schemas/CustomerDisplay'
        metadata:
          $ref: '#/components/schemas/Metadata'
        compliance:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionCompliance'
          writeOnly: true
          description: Compliance context for this payment session. Carries buyer information required by some entity configurations to meet regulatory requirements.
          example:
            buyer:
              name: John Doe
