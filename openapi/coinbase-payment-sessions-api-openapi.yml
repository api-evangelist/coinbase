            payloads:
            - payloadId: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
              type: eip3009
              data:
                types:
                  EIP712Domain:
                  - name: name
                    type: string
                  - name: version
                    type: string
                  - name: chainId
                    type: uint256
                  - name: verifyingContract
                    type: address
                  TransferWithAuthorization:
                  - name: from
                    type: address
                  - name: to
                    type: address
                  - name: value
                    type: uint256
                  - name: validAfter
                    type: uint256
                  - name: validBefore
                    type: uint256
                  - name: nonce
                    type: bytes32
                primaryType: TransferWithAuthorization
                domain:
                  name: USD Coin
                  version: '2'
                  chainId: 8453
                  verifyingContract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                message:
                  from: '0x1111111111111111111111111111111111111111'
                  to: '0x2222222222222222222222222222222222222222'
                  value: '1000000'
                  validAfter: '0'
                  validBefore: '1767225600'
                  nonce: '0x8f5c2d6f4b9a1e3c7d2f8a6b5c4e3d2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d'
        ineligibleAddresses:
          type: array
          description: Requested payer addresses that have no eligible authorization option, each with a `code` explaining why. Empty when every requested address can authorize the payment.
          items:
            $ref: '#/components/schemas/IneligibleWalletAuthorizationAddress'
          example: []
      required:
      - options
      - ineligibleAddresses
    WalletAuthorizationFundsRequirement:
      type: object
      title: Wallet Authorization Funds Requirement
      description: Describes, for one enabled (network, asset) combination, what the payer would need to fund a source address with so that it becomes eligible to authorize the payment. Appears in the `fundsRequired` list of an ineligible address whose `code` is `insufficient_funds`. All amounts are human-readable decimal strings, formatted the same way as `WalletAuthorizationOption.amount`.
      properties:
        asset:
          allOf:
          - $ref: '#/components/schemas/Asset'
          description: The symbol of the asset the payer would fund on this network.
          example: usdc
        network:
          allOf:
          - $ref: '#/components/schemas/PaymentSourceNetwork'
          description: The blockchain network this funding requirement applies to.
          example: base
        currentBalance:
          type: string
          description: A decimal representation of the address's current balance of `asset` on this `network`.
          example: '0.40'
        requiredBalance:
          type: string
          description: A decimal representation of the balance of `asset` the payer must hold on this `network` to become eligible to authorize the payment.
          example: '1.00'
      required:
      - asset
      - network
      - currentBalance
      - requiredBalance
      example:
        asset: usdc
        network: base
        currentBalance: '0.40'
        requiredBalance: '1.00'
    PaymentSessionEventData:
      type: object
      description: The data payload for a payment session webhook event. Always contains the `paymentSession` summary reflecting the session's current state. When the event was triggered by an action (authorization, capture, void, or refund), the corresponding optional field is present with the action details. For session-level events (created, canceled) no action field is included — the `paymentSession.status` value is sufficient.
      properties:
        paymentSession:
          $ref: '#/components/schemas/PaymentSessionSummary'
        authorization:
          type: object
          description: Present when the event was triggered by an authorization status transition (`pending`, `succeeded`, or `failed`).
          properties:
            authorizationId:
              allOf:
              - $ref: '#/components/schemas/AuthorizationId'
              description: The unique identifier of the authorization.
              example: authorization_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            status:
              allOf:
              - $ref: '#/components/schemas/PaymentActionStatus'
              description: The current status of the authorization.
              example: succeeded
            amount:
              type: string
              description: A decimal representation of the authorized amount, denominated in the session's `asset`.
              example: '1.00'
            externalReferenceId:
              allOf:
              - $ref: '#/components/schemas/ExternalReferenceId'
              description: An optional merchant-provided internal identifier for this authorization, from the merchant's own system—not visible to the payer. Present only when supplied on the authorization request.
              example: merchant-authorization-abc123
            customerDisplay:
              allOf:
              - $ref: '#/components/schemas/OperationCustomerDisplay'
              description: Customer-facing display data for this authorization, shown to the payer. Present when supplied on the authorization request or when the session's `orderCode` fallback applies; otherwise omitted.
            error:
              allOf:
              - $ref: '#/components/schemas/PaymentError'
              description: Error details, present only when the authorization failed.
              example:
                code: insufficient_funds
                message: The payer does not have sufficient funds.
                occurredAt: '2025-06-15T12:01:00.000Z'
            onchainTransactions:
              type: array
              description: The onchain transactions associated with this authorization.
              items:
                $ref: '#/components/schemas/OnchainTransaction'
              example:
              - transactionHash: '0xabc123def456789012345678901234567890abcdef1234567890abcdef123456'
                network: base
            metadata:
              $ref: '#/components/schemas/Metadata'
            source:
              allOf:
              - $ref: '#/components/schemas/PaymentSessionSource'
              description: The payer for this authorization. For wallet authorizations, this is the blockchain address that signed the payloads. For Coinbase authorizations, this is the authenticated Coinbase account.
              example:
                address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                network: base
                asset: usdc
            createdAt:
              type: string
              format: date-time
              description: The UTC ISO 8601 timestamp at which the authorization was created.
              example: '2025-06-15T12:00:30.000Z'
            updatedAt:
              type: string
              format: date-time
              description: The UTC ISO 8601 timestamp at which the authorization was last updated.
              example: '2025-06-15T12:01:00.000Z'
          required:
          - authorizationId
          - status
          - amount
          - createdAt
          - updatedAt
          example:
            authorizationId: authorization_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            status: succeeded
            amount: '1.00'
            source:
              address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
              network: base
              asset: usdc
            onchainTransactions:
            - transactionHash: '0xabc123def456789012345678901234567890abcdef1234567890abcdef123456'
              network: base
            createdAt: '2025-06-15T12:00:30.000Z'
            updatedAt: '2025-06-15T12:01:00.000Z'
        capture:
          type: object
          description: Present when the event was triggered by a capture status transition (`pending`, `succeeded`, or `failed`).
          properties:
            captureId:
              allOf:
              - $ref: '#/components/schemas/CaptureId'
              description: The unique identifier of the capture.
              example: capture_93d980d2-95f2-55fe-b9d3-2bd340cf10be
            status:
              allOf:
              - $ref: '#/components/schemas/PaymentActionStatus'
              description: The current status of the capture.
              example: succeeded
            amount:
              type: string
              description: A decimal representation of the captured amount, denominated in the session's `asset`.
              example: '1.00'
            externalReferenceId:
              allOf:
              - $ref: '#/components/schemas/ExternalReferenceId'
              description: An optional merchant-provided internal identifier for this capture, from the merchant's own system—not visible to the payer. For an auto-capture, it is copied from the authorization.
              example: merchant-capture-abc123
            customerDisplay:
              allOf:
              - $ref: '#/components/schemas/OperationCustomerDisplay'
              description: Customer-facing display data for this capture, shown to the payer. An auto-capture reuses the authorization's `referenceCode`.
            finalCapture:
              type: boolean
              description: When `true`, this capture is treated as the final one for the authorization. Any remaining capturable balance is released back to the payer immediately after the capture settles. When `false`, the remaining capturable balance stays held and is available for subsequent partial captures (subject to `captureExpiresAt`). Has no effect if `amount` equals the full capturable balance, since no remaining balance exists to release.
              example: true
            error:
              allOf:
              - $ref: '#/components/schemas/PaymentError'
              description: Error details, present only when the capture failed.
              example:
                code: capture_failed
                message: The capture could not be completed.
                occurredAt: '2025-06-15T12:05:00.000Z'
            onchainTransactions:
              type: array
              description: The onchain transactions associated with this capture.
              items:
                $ref: '#/components/schemas/OnchainTransaction'
              example:
              - transactionHash: '0xdef456abc789012345678901234567890abcdef1234567890abcdef12345678'
                network: base
            metadata:
              $ref: '#/components/schemas/Metadata'
            createdAt:
              type: string
              format: date-time
              description: The UTC ISO 8601 timestamp at which the capture was created.
              example: '2025-06-15T12:04:30.000Z'
            updatedAt:
              type: string
              format: date-time
              description: The UTC ISO 8601 timestamp at which the capture was last updated.
              example: '2025-06-15T12:05:00.000Z'
          required:
          - captureId
          - status
          - amount
          - finalCapture
          - createdAt
          - updatedAt
          example:
            captureId: capture_93d980d2-95f2-55fe-b9d3-2bd340cf10be
            status: succeeded
            amount: '1.00'
            finalCapture: true
            onchainTransactions:
            - transactionHash: '0xdef456abc789012345678901234567890abcdef1234567890abcdef12345678'
              network: base
            createdAt: '2025-06-15T12:04:30.000Z'
            updatedAt: '2025-06-15T12:05:00.000Z'
        void:
          type: object
          description: Present when the event was triggered by a void status transition (`pending`, `succeeded`, or `failed`).
          properties:
            voidId:
              allOf:
              - $ref: '#/components/schemas/VoidId'
              description: The unique identifier of the void.
              example: void_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            status:
              allOf:
              - $ref: '#/components/schemas/PaymentActionStatus'
              description: The current status of the void.
              example: succeeded
            amount:
              type: string
              description: A decimal representation of the voided amount, denominated in the session's `asset`.
              example: '1.00'
            externalReferenceId:
              allOf:
              - $ref: '#/components/schemas/ExternalReferenceId'
              description: An optional merchant-provided internal identifier for this void, from the merchant's own system—not visible to the payer. Present only when supplied on the create void request.
              example: merchant-void-abc123
            customerDisplay:
              allOf:
              - $ref: '#/components/schemas/OperationCustomerDisplay'
              description: Customer-facing display data for this void, shown to the payer. Present when supplied on the create void request or when the session's `orderCode` fallback applies; otherwise omitted.
            error:
              allOf:
              - $ref: '#/components/schemas/PaymentError'
              description: Error details, present only when the void failed.
              example:
                code: void_failed
                message: The void could not be completed.
                occurredAt: '2025-06-15T12:10:00.000Z'
            onchainTransactions:
              type: array
              description: The onchain transactions associated with this void.
              items:
                $ref: '#/components/schemas/OnchainTransaction'
              example:
              - transactionHash: '0x789012345678901234567890abcdef1234567890abcdef1234567890abcdef12'
                network: base
            metadata:
              $ref: '#/components/schemas/Metadata'
            createdAt:
              type: string
              format: date-time
              description: The UTC ISO 8601 timestamp at which the void was created.
              example: '2025-06-15T12:09:30.000Z'
            updatedAt:
              type: string
              format: date-time
              description: The UTC ISO 8601 timestamp at which the void was last updated.
              example: '2025-06-15T12:10:00.000Z'
          required:
          - voidId
          - status
          - amount
          - createdAt
          - updatedAt
          example:
            voidId: void_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            status: succeeded
            amount: '1.00'
            onchainTransactions:
            - transactionHash: '0x789012345678901234567890abcdef1234567890abcdef1234567890abcdef12'
              network: base
            createdAt: '2025-06-15T12:09:30.000Z'
            updatedAt: '2025-06-15T12:10:00.000Z'
        refund:
          type: object
          description: Present when the event was triggered by a refund status transition (`pending`, `succeeded`, or `failed`).
          properties:
            refundId:
              allOf:
              - $ref: '#/components/schemas/RefundId'
              description: The unique identifier of the refund.
              example: refund_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            status:
              allOf:
              - $ref: '#/components/schemas/PaymentActionStatus'
              description: The current status of the refund.
              example: succeeded
            amount:
              type: string
              description: A decimal representation of the refunded amount, denominated in the session's `asset`.
              example: '0.50'
            externalReferenceId:
              allOf:
              - $ref: '#/components/schemas/ExternalReferenceId'
              description: An optional merchant-provided internal identifier for this refund, from the merchant's own system—not visible to the payer. Present only when supplied on the create refund request.
              example: merchant-refund-abc123
            customerDisplay:
              allOf:
              - $ref: '#/components/schemas/OperationCustomerDisplay'
              description: Customer-facing display data for this refund, shown to the payer. Present when supplied on the create refund request or when the session's `orderCode` fallback applies; otherwise omitted.
            reason:
              type: string
              description: The reason for the refund, if provided when the refund was created.
              example: Customer returned the item.
            error:
              allOf:
              - $ref: '#/components/schemas/PaymentError'
              description: Error details, present only when the refund failed.
              example:
                code: refund_failed
                message: The refund could not be completed.
                occurredAt: '2025-06-15T12:15:00.000Z'
            onchainTransactions:
              type: array
              description: The onchain transactions associated with this refund.
              items:
                $ref: '#/components/schemas/OnchainTransaction'
              example:
              - transactionHash: '0x012345678901234567890abcdef1234567890abcdef1234567890abcdef1234'
                network: base
            metadata:
              $ref: '#/components/schemas/Metadata'
            createdAt:
              type: string
              format: date-time
              description: The UTC ISO 8601 timestamp at which the refund was created.
              example: '2025-06-15T12:14:30.000Z'
            updatedAt:
              type: string
              format: date-time
              description: The UTC ISO 8601 timestamp at which the refund was last updated.
              example: '2025-06-15T12:15:00.000Z'
          required:
          - refundId
          - status
          - amount
          - createdAt
          - updatedAt
          example:
            refundId: refund_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            status: succeeded
            amount: '0.50'
            reason: Customer returned the item.
            onchainTransactions:
            - transactionHash: '0x012345678901234567890abcdef1234567890abcdef1234567890abcdef1234'
              network: base
            createdAt: '2025-06-15T12:14:30.000Z'
            updatedAt: '2025-06-15T12:15:00.000Z'
      required:
      - paymentSession
      example:
        paymentSession:
          paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
          entityId: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
          amount: '1.00'
          asset: usdc
          target:
            address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            network: base
          autoCapture: false
          expiries:
            authorizationExpiresAt: '2025-12-31T23:59:59.000Z'
            captureExpiresAt: '2026-01-15T23:59:59.000Z'
            refundExpiresAt: '2026-02-15T23:59:59.000Z'
          status: created
          balances:
            capturable: '0'
            captured: '0'
            refundable: '0'
            refunded: '0'
          externalReferenceId: merchant-order-abc123
          metadata:
            customer_id: cust_12345
            order_reference: order-67890
          createdAt: '2025-06-15T12:00:00.000Z'
          updatedAt: '2025-06-15T12:00:00.000Z'
    PaymentSession:
      type: object
      description: 'Tracks the full lifecycle of a payment from creation through settlement. Typical flow: **Create** → **Authorize** (via payment method) → **Capture**. Optional: **Void** to release uncaptured funds, or **Refund** to return captured funds.'
      properties:
        paymentSessionId:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionId'
          description: The unique identifier of the payment session.
          example: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        entityId:
          type: string
          description: The ID of the entity that owns the payment session.
          example: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
        amount:
          type: string
          description: A decimal representation of the payment amount, denominated in `asset`.
          example: '1.00'
        asset:
          allOf:
          - $ref: '#/components/schemas/Asset'
          description: The symbol of the asset for the payment amount.
          example: usdc
        target:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionTarget'
          description: The target of the payment session.
          example:
            address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            network: base
        autoCapture:
          type: boolean
          description: When true, a capture is automatically created after a successful authorization. When false or omitted, the merchant must create captures manually via the captures endpoint.
          default: false
          example: false
        expiries:
          $ref: '#/components/schemas/PaymentExpiries'
        source:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionSource'
          description: The source of the payment session. Set after a successful authorization. Not present before authorization.
          example:
            address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
            network: base
            asset: usdc
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionStatus'
          description: The most recent meaningful event on the payment session.
          example: created
        balances:
          $ref: '#/components/schemas/PaymentSessionBalances'
        authorizations:
          type: array
          description: The authorizations for this payment session.
          items:
            $ref: '#/components/schemas/Authorization'
        captures:
          type: array
          description: The captures for this payment session.
          items:
            $ref: '#/components/schemas/Capture'
        voids:
          type: array
          description: The voids for this payment session.
          items:
            $ref: '#/components/schemas/Void'
        refunds:
          type: array
          description: The refunds for this payment session.
          items:
            $ref: '#/components/schemas/Refund'
        url:
          allOf:
          - $ref: '#/components/schemas/Url'
          readOnly: true
          description: A URL to the hosted payment page where the payer can complete this payment session.
          example: https://payments.coinbase.com/payment-sessions/paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        x402Url:
          allOf:
          - $ref: '#/components/schemas/Url'
          readOnly: true
          description: URL for the hosted x402 payment flow. This endpoint expects an HTTP **POST** request (for example, submitting the x402 payment via request headers); do not treat it as a page opened with GET alone. Only present when the payment target supports a wallet source.
          example: https://api.cdp.coinbase.com/platform/v2/payment-sessions/paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad/authorizations/x402
        redirect:
          $ref: '#/components/schemas/PaymentRedirect'
        customerDisplay:
          $ref: '#/components/schemas/CustomerDisplay'
        metadata:
          $ref: '#/components/schemas/Metadata'
        externalReferenceId:
          type: string
          maxLength: 256
          description: A merchant-provided internal identifier for this payment session, from the merchant's own system—not visible to the payer. It must not contain personally identifiable information (PII) or payment credentials.
          example: merchant-order-abc123
        cancellationReason:
          type: string
          description: The reason the payment session was canceled. Only present when the session has been canceled.
          example: Customer requested cancellation.
        createdAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the payment session was created.
          example: '2025-06-15T12:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the payment session was last updated.
          example: '2025-06-15T12:05:00.000Z'
      example:
        paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        entityId: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
        amount: '1.00'
        asset: usdc
        target:
          address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          network: base
        autoCapture: false
        expiries:
          authorizationExpiresAt: '2025-12-31T23:59:59.000Z'
          captureExpiresAt: '2026-01-15T23:59:59.000Z'
          refundExpiresAt: '2026-02-15T23:59:59.000Z'
        status: created
        balances:
          capturable: '0'
          captured: '0'
          refundable: '0'
          refunded: '0'
        url: https://payments.coinbase.com/payment-sessions/paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        x402Url: https://api.cdp.coinbase.com/platform/v2/payment-sessions/paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad/authorizations/x402
        redirect:
          failureUrl: https://merchant.example.com/payment/failed
          successUrl: https://merchant.example.com/payment/success
        customerDisplay:
          merchantName: Acme Store
          displayAmount:
            amount: '1.37'
            currency: cad
        externalReferenceId: merchant-order-abc123
        metadata:
          customer_id: cust_12345
          order_reference: order-67890
        createdAt: '2025-06-15T12:00:00.000Z'
        updatedAt: '2025-06-15T12:05:00.000Z'
    EIP712Types:
      type: object
      description: 'A mapping of struct names to an array of type objects (name + type).

        Each key corresponds to a type name (e.g., "`EIP712Domain`", "`PermitTransferFrom`").

        '
      example:
        EIP712Domain:
        - name: name
          type: string
        - name: chainId
          type: uint256
        - name: verifyingContract
          type: address
        PermitTransferFrom:
        - name: permitted
          type: TokenPermissions
        - name: spender
          type: address
        - name: nonce
          type: uint256
        - name: deadline
          type: uint256
        TokenPermissions:
        - name: token
          type: address
        - name: amount
          type: uint256
    CreateVoidRequest:
      type: object
      description: A request to create a void for a payment session. A void releases all remaining capturable funds back to the payer, including after partial refunds as long as a capturableAmount remains.
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        externalReferenceId:
          allOf:
          - $ref: '#/components/schemas/ExternalReferenceId'
          description: An optional merchant-provided internal identifier for this void, from the merchant's own system—not visible to the payer.
          example: merchant-void-abc123
        customerDisplay:
          allOf:
          - $ref: '#/components/schemas/OperationCustomerDisplay'
          description: Optional customer-facing display data for this void, shown to the payer. Falls back to the session's `orderCode` when `referenceCode` is omitted.
          example:
            referenceCode: REF-ABC123
    ExternalReferenceId:
      type: string
      maxLength: 256
      description: A merchant-provided internal identifier for a resource from the merchant's own system—not visible to the payer. It must not contain personally identifiable information (PII) or payment credentials.
      example: merchant-reference-abc123
    RefundId:
      type: string
      pattern: ^refund_[a-f0-9\-]{36}$
      description: The ID of the refund, a UUID prefixed by `refund_`.
      example: refund_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
    AcceptancePaymentSessionRefundPendingEvent:
      x-event-type: acceptance.payment_session.refund_pending
      example:
        eventType: acceptance.payment_session.refund_pending
        eventId: 901m2345-m67j-90l1-i234-204492952888
        timestamp: '2025-06-15T12:40:00Z'
        data:
          paymentSession:
            paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            entityId: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
            amount: '1.00'
            asset: usdc
            source:
              address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
              network: base
              asset: usdc
            target:
              address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
              network: base
            autoCapture: false
            expiries:
              authorizationExpiresAt: '2025-12-31T23:59:59.000Z'
              captureExpiresAt: '2026-01-15T23:59:59.000Z'
              refundExpiresAt: '2026-02-15T23:59:59.000Z'
            status: refund_pending
            balances:
              capturable: '0'
              captured: '1.00'
              refundable: '1.00'
