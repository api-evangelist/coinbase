        '422':
          description: 'The request is well-formed but cannot be applied: the session or mandate is in the wrong state, the charge exceeds the mandate''s policy, or the idempotency key conflicts.


            **Note on mandate rejections.** The first match wins: an in-flight approval or revocation returns `409` (`mandate_action_pending`); `revokedAt` set returns `422` (`mandate_revoked`); `canceledAt` set returns `422` (`mandate_canceled`); a past `expiresAt` returns `400` (`mandate_expired`); any other status returns `422` (`mandate_invalid_status`). A charge over the mandate policy returns `422` (`mandate_policy_violation`). The example keys below are labels, not machine values — use `errorType` and `errorMessage` to distinguish between them.'
