                            - name: value
                              type: uint256
                            - name: validAfter
                              type: uint256
                            - name: validBefore
                              type: uint256
                            - name: nonce
                              type: bytes32
                          primaryType: TransferWithAuthorization
                          domain:
                            name: USD Coin
                            version: '2'
                            chainId: 8453
                            verifyingContract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                          message:
                            from: '0x1111111111111111111111111111111111111111'
