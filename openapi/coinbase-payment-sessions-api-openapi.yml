    PaymentExpiries:
      type: object
      description: 'Deadlines for each stage of the payment session lifecycle. All fields are optional; when omitted from a create request, the following defaults apply: `authorizationExpiresAt` = now + 1 day, `captureExpiresAt` = now + 7 days, `refundExpiresAt` = now + 30 days.


        Expiries must satisfy `authorizationExpiresAt` ≤ `captureExpiresAt` ≤ `refundExpiresAt`. The API returns a 400 error if this constraint is violated.


        Each deadline acts as a guard — after it passes, the corresponding action is rejected, but the session remains in its current status. No automatic state transitions occur; the merchant must take explicit action (e.g., cancel or void) to move the session to a terminal state.'
      properties:
        authorizationExpiresAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp after which authorization attempts are rejected. Defaults to now + 1 day if omitted. The session remains in its current pre-authorization status; the merchant must explicitly cancel the session.
          example: '2025-12-31T23:59:59.000Z'
        captureExpiresAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp after which capture attempts are rejected. Defaults to now + 7 days if omitted. The session remains in its current status; the merchant must explicitly void to release uncaptured funds.
          example: '2026-01-15T23:59:59.000Z'
        refundExpiresAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp after which refund attempts are rejected. Defaults to now + 30 days if omitted. The session remains in its current status; the refund window is simply closed.
          example: '2026-02-15T23:59:59.000Z'
      example:
        authorizationExpiresAt: '2025-12-31T23:59:59.000Z'
        captureExpiresAt: '2026-01-15T23:59:59.000Z'
        refundExpiresAt: '2026-02-15T23:59:59.000Z'
    PaymentSourceWallet:
      type: object
      title: Payment Source Wallet
      description: A blockchain wallet address used as a payment source.
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          description: The blockchain address of the payer.
          example: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
        network:
          allOf:
          - $ref: '#/components/schemas/PaymentSourceNetwork'
          description: The blockchain network for the payment.
          example: base
        asset:
          allOf:
          - $ref: '#/components/schemas/Asset'
          description: The asset used for the payment.
          example: usdc
      required:
      - address
      example:
        address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
        network: base
        asset: usdc
    PaymentSessionBalances:
      type: object
      description: Running totals tracking how funds move through the session. All amounts are decimal representations denominated in the session's `asset`.
      properties:
        capturable:
          type: string
          description: Authorized funds not yet captured or voided. Decreases with each capture or void.
          example: '1.00'
        captured:
          type: string
          description: Total funds captured across all captures.
          example: '0'
        refundable:
          type: string
          description: Captured funds not yet refunded. Equals `captured` minus `refunded`.
          example: '0'
        refunded:
          type: string
          description: Total funds refunded across all refunds.
          example: '0'
      example:
        capturable: '1.00'
        captured: '0'
        refundable: '0'
        refunded: '0'
    ListResponse:
      type: object
      properties:
        nextPageToken:
          type: string
          description: The token for the next page of items, if any.
          example: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
    OperationCustomerDisplay:
      type: object
      title: Operation Customer Display
      description: Customer-facing display information for a payment operation.
      properties:
        referenceCode:
          allOf:
          - $ref: '#/components/schemas/CustomerReferenceCode'
          description: A short customer-facing reference code for this payment operation.
          example: REF-ABC123
      example:
        referenceCode: REF-ABC123
    CreateCaptureRequest:
      type: object
      description: A request to create a capture for a payment session.
      properties:
        amount:
          type: string
          description: A decimal representation of the amount to capture, denominated in the session's `asset`. If omitted, the full remaining capturable amount is captured.
          example: '1.00'
        finalCapture:
          type: boolean
          description: When `true`, this capture is treated as the final one for the authorization. Any remaining capturable balance is released back to the payer immediately after the capture settles. When `false`, the remaining capturable balance stays held and is available for subsequent partial captures (subject to `captureExpiresAt`). Has no effect if `amount` equals the full capturable balance, since no remaining balance exists to release.
          example: true
        metadata:
          $ref: '#/components/schemas/Metadata'
        externalReferenceId:
          allOf:
          - $ref: '#/components/schemas/ExternalReferenceId'
          description: An optional merchant-provided internal identifier for this manual capture, from the merchant's own system—not visible to the payer.
          example: merchant-capture-abc123
        customerDisplay:
          allOf:
          - $ref: '#/components/schemas/OperationCustomerDisplay'
          description: Optional customer-facing display data for this manual capture, shown to the payer. Falls back to the session's `orderCode` when `referenceCode` is omitted.
          example:
            referenceCode: REF-ABC123
      required:
      - finalCapture
      example:
        amount: '1.00'
        finalCapture: true
    EIP3009Payload:
      type: object
      title: EIP-3009 Payload
      description: An EIP-3009 TransferWithAuthorization typed-data payload. The payer must pass `data` to `eth_signTypedData_v4` and return the resulting signature.
      properties:
        payloadId:
          type: string
          description: The unique identifier of the payload.
          example: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
        type:
          type: string
          description: The payload type.
          enum:
          - eip3009
          example: eip3009
        data:
          allOf:
          - $ref: '#/components/schemas/EIP712Message'
          description: EIP-712 typed data for a TransferWithAuthorization. Pass to `eth_signTypedData_v4`.
          example:
            types:
              EIP712Domain:
              - name: name
                type: string
              - name: version
                type: string
              - name: chainId
                type: uint256
              - name: verifyingContract
                type: address
              TransferWithAuthorization:
              - name: from
                type: address
              - name: to
                type: address
              - name: value
                type: uint256
              - name: validAfter
                type: uint256
              - name: validBefore
                type: uint256
              - name: nonce
                type: bytes32
            primaryType: TransferWithAuthorization
            domain:
              name: USD Coin
              version: '2'
              chainId: 8453
              verifyingContract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            message:
              from: '0x1111111111111111111111111111111111111111'
              to: '0x2222222222222222222222222222222222222222'
              value: '1000000'
              validAfter: '0'
              validBefore: '1767225600'
              nonce: '0x8f5c2d6f4b9a1e3c7d2f8a6b5c4e3d2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d'
      required:
      - payloadId
      - type
      - data
      example:
        payloadId: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
        type: eip3009
        data:
          types:
            EIP712Domain:
            - name: name
              type: string
            - name: version
              type: string
            - name: chainId
              type: uint256
            - name: verifyingContract
              type: address
            TransferWithAuthorization:
            - name: from
              type: address
            - name: to
              type: address
            - name: value
              type: uint256
            - name: validAfter
              type: uint256
            - name: validBefore
              type: uint256
            - name: nonce
              type: bytes32
          primaryType: TransferWithAuthorization
          domain:
            name: USD Coin
            version: '2'
            chainId: 8453
            verifyingContract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          message:
            from: '0x1111111111111111111111111111111111111111'
            to: '0x2222222222222222222222222222222222222222'
            value: '1000000'
            validAfter: '0'
            validBefore: '1767225600'
            nonce: '0x8f5c2d6f4b9a1e3c7d2f8a6b5c4e3d2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d'
    Error:
      description: An error response including the code for the type of error and a human-readable message describing the error.
      type: object
      properties:
        errorType:
          $ref: '#/components/schemas/ErrorType'
        errorMessage:
          description: The error message.
          type: string
          example: Unable to create EVM account
        correlationId:
          description: A unique identifier for the request that generated the error. This can be used to help debug issues with the API.
          type: string
          example: 41deb8d59a9dc9a7-IAD
        errorLink:
          allOf:
          - $ref: '#/components/schemas/Url'
          description: A link to the corresponding error documentation.
          example: https://docs.cdp.coinbase.com/api-reference/v2/errors#invalid-request
        unauthorizedCapabilities:
          description: 'The capability code(s) that were not authorized for the customer on

            this request. Present only when `errorType` is

            `customer_not_authorized`; absent for every other error type.


            Use this list to render onboarding UX for the listed capabilities, or

            fetch `GET /v2/customers/{customerId}` and inspect each entry''s

            `status` / `requirements` to discover what (if anything) can be

            submitted to resolve the block.

            '
          type: array
          items:
            $ref: '#/components/schemas/CapabilityName'
      required:
      - errorType
      - errorMessage
      example:
        errorType: invalid_request
        errorMessage: Invalid request.
        correlationId: 41deb8d59a9dc9a7-IAD
        errorLink: https://docs.cdp.coinbase.com/api-reference/v2/errors#invalid-request
    OnchainSignaturePayload:
      description: 'A single onchain payload the payer must process to complete an onchain payment option. Inspect `type` to determine how to handle the `data` field:

        - `eip3009` — pass `data` to `eth_signTypedData_v4`, return the signature.

        - `permit2` — pass `data` to `eth_signTypedData_v4`, return the signature.

        - `erc20_approval` — send `data` via `eth_sendTransaction`, return the transaction hash.

        - `spend_permission` — pass `data` to `eth_signTypedData_v4`, return the signature.'
      oneOf:
      - $ref: '#/components/schemas/EIP3009Payload'
      - $ref: '#/components/schemas/Permit2Payload'
      - $ref: '#/components/schemas/Erc20ApprovalPayload'
      - $ref: '#/components/schemas/SpendPermissionPayload'
    Compliance:
      type: object
      description: 'Compliance context for a request. Carries per-request compliance signals,

        such as the IP address of the individual (i.e., end-customer) that

        initiated the request.


        This object is request-only — it is never echoed back in responses.

        Inner fields are write-only.

        '
      properties:
        requesterIpAddress:
          type: string
          writeOnly: true
          description: 'IPv4 or IPv6 address of the individual (i.e., end-customer) that

            initiated this request. NOT the IP of the partner server making the

            API call.

            '
          example: 203.0.113.42
      example:
        requesterIpAddress: 203.0.113.42
    VoidId:
      type: string
      pattern: ^void_[a-f0-9\-]{36}$
      description: The ID of the void, a UUID prefixed by `void_`.
      example: void_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
    PaymentSessionSource:
      description: The source of the payment. Can be either an onchain wallet address or a Coinbase account authenticated via OAuth.
      oneOf:
      - $ref: '#/components/schemas/PaymentSourceWallet'
      - $ref: '#/components/schemas/PaymentSourceCoinbase'
      example:
        address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
        network: base
        asset: usdc
    PaymentSessionStatus:
      type: string
      description: 'The most recent meaningful event on the payment session.

        For session-level milestones the value is one of `created` or `canceled`. For action outcomes the value follows the pattern `{action}_{result}` — e.g. `authorization_succeeded`, `capture_pending`, `refund_failed`.'
      enum:
      - created
      - canceled
      - authorization_pending
      - authorization_succeeded
      - authorization_failed
      - capture_pending
      - capture_succeeded
      - capture_failed
      - void_pending
      - void_succeeded
      - void_failed
      - refund_pending
      - refund_succeeded
      - refund_failed
      x-enum-varnames:
      - PaymentSessionStatusCreated
      - PaymentSessionStatusCanceled
      - PaymentSessionStatusAuthorizationPending
      - PaymentSessionStatusAuthorizationSucceeded
      - PaymentSessionStatusAuthorizationFailed
      - PaymentSessionStatusCapturePending
      - PaymentSessionStatusCaptureSucceeded
      - PaymentSessionStatusCaptureFailed
      - PaymentSessionStatusVoidPending
      - PaymentSessionStatusVoidSucceeded
      - PaymentSessionStatusVoidFailed
      - PaymentSessionStatusRefundPending
      - PaymentSessionStatusRefundSucceeded
      - PaymentSessionStatusRefundFailed
      example: created
    BlockchainAddress:
      type: string
      minLength: 1
      maxLength: 128
      description: A blockchain address. Format varies by network (e.g., 0x-prefixed for EVM, base58 for Solana).
      example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
    EIP712Domain:
      type: object
      description: The domain of the EIP-712 typed data.
      properties:
        name:
          type: string
          description: The name of the DApp or protocol.
          example: Permit2
        version:
          type: string
          description: The version of the DApp or protocol.
          example: '1'
        chainId:
          type: integer
          format: int64
          description: The chain ID of the EVM network.
          example: 1
        verifyingContract:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: The 0x-prefixed EVM address of the verifying smart contract.
          example: '0x000000000022D473030F116dDEE9F6B43aC78BA3'
        salt:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: The optional 32-byte 0x-prefixed hex salt for domain separation.
          example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
      example:
        name: Permit2
        chainId: 1
        verifyingContract: '0x000000000022D473030F116dDEE9F6B43aC78BA3'
    PaymentSessionEventBase:
      type: object
      description: Common fields included in every PaymentSessionEvent payload.
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique identifier for this webhook event. Use this for idempotency.
          example: 123e4567-e89b-12d3-a456-426614174000
        timestamp:
          type: string
          format: date-time
          description: When this event occurred (ISO 8601 format).
          example: '2025-06-01T12:00:00Z'
        data:
          $ref: '#/components/schemas/PaymentSessionEventData'
      required:
      - eventId
      - timestamp
      - data
    CapabilityName:
      type: string
      description: 'The name of a capability. Capabilities represent granular functional permissions

        that determine what actions a customer can perform. Each capability must be

        explicitly requested before use.

        '
      enum:
      - custodyCrypto
      - custodyFiat
      - custodyStablecoin
      - tradeCrypto
      - tradeStablecoin
      - transferCrypto
      - transferFiat
      - transferStablecoin
      x-enum-varnames:
      - CustodyCrypto
      - CustodyFiat
      - CustodyStablecoin
      - TradeCrypto
      - TradeStablecoin
      - TransferCrypto
      - TransferFiat
      - TransferStablecoin
      example: custodyCrypto
    Void:
      type: object
      description: A release of uncaptured authorized funds back to the payer. Voids release all remaining capturable funds in a single operation, including after partial refunds as long as a capturableAmount remains.
      properties:
        voidId:
          allOf:
          - $ref: '#/components/schemas/VoidId'
          description: The unique identifier of the void.
          example: void_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        paymentSessionId:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionId'
          description: The ID of the payment session this void belongs to.
          example: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentActionStatus'
          description: The current status of the void.
          example: pending
        amount:
          type: string
          description: A decimal representation of the voided amount, denominated in the session's `asset`.
          example: '1.00'
        error:
          $ref: '#/components/schemas/PaymentError'
        metadata:
          $ref: '#/components/schemas/Metadata'
        externalReferenceId:
          allOf:
          - $ref: '#/components/schemas/ExternalReferenceId'
          description: A merchant-provided internal identifier for this void, from the merchant's own system—not visible to the payer. Present only when supplied on the create void request.
          example: merchant-void-abc123
        customerDisplay:
          allOf:
          - $ref: '#/components/schemas/OperationCustomerDisplay'
          description: Customer-facing display data for this void, shown to the payer. Present when supplied on the create void request or when the session's `orderCode` fallback applies; otherwise omitted.
        onchainTransactions:
          type: array
          description: The onchain transactions associated with this void.
          items:
            $ref: '#/components/schemas/OnchainTransaction'
          example:
          - transactionHash: '0x789012345678901234567890abcdef1234567890abcdef1234567890abcdef12'
            network: base
        createdAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the void was created.
          example: '2025-06-15T12:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the void was last updated.
          example: '2025-06-15T12:31:00.000Z'
      example:
        voidId: void_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        status: succeeded
        amount: '1.00'
        onchainTransactions:
        - transactionHash: '0x789012345678901234567890abcdef1234567890abcdef1234567890abcdef12'
          network: base
        metadata:
          customer_id: cust_12345
        createdAt: '2025-06-15T12:30:00.000Z'
        updatedAt: '2025-06-15T12:31:00.000Z'
    Permit2Payload:
      type: object
      title: Permit2 Payload
      description: A Permit2 PermitTransferFrom typed-data payload. The payer must pass `data` to `eth_signTypedData_v4` and return the resulting signature.
      properties:
        payloadId:
          type: string
          description: The unique identifier of the payload.
          example: payload_cg4059d2-b068-6ih9-dha1-eee44f157336
        type:
          type: string
          description: The payload type.
          enum:
          - permit2
          example: permit2
        data:
          allOf:
          - $ref: '#/components/schemas/EIP712Message'
          description: EIP-712 typed data for a Permit2 PermitTransferFrom. Pass to `eth_signTypedData_v4`.
          example:
            types:
              EIP712Domain:
              - name: name
                type: string
              - name: version
                type: string
              - name: chainId
                type: uint256
              - name: verifyingContract
                type: address
              PermitTransferFrom:
              - name: permitted
                type: TokenPermissions
              - name: spender
                type: address
              - name: nonce
                type: uint256
              - name: deadline
                type: uint256
              TokenPermissions:
              - name: token
                type: address
              - name: amount
                type: uint256
            primaryType: PermitTransferFrom
            domain:
              name: Permit2
              chainId: 1
              verifyingContract: '0x000000000022D473030F116dDEE9F6B43aC78BA3'
            message:
              permitted:
                token: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
                amount: '1000000'
              spender: '0x3333333333333333333333333333333333333333'
              nonce: '0'
              deadline: '1767225600'
      required:
      - payloadId
      - type
      - data
      example:
        payloadId: payload_cg4059d2-b068-6ih9-dha1-eee44f157336
        type: permit2
        data:
          types:
            EIP712Domain:
            - name: name
              type: string
            - name: version
              type: string
            - name: chainId
              type: uint256
            - name: verifyingContract
              type: address
            PermitTransferFrom:
            - name: permitted
              type: TokenPermissions
            - name: spender
              type: address
            - name: nonce
              type: uint256
            - name: deadline
              type: uint256
            TokenPermissions:
            - name: token
              type: address
            - name: amount
              type: uint256
          primaryType: PermitTransferFrom
          domain:
            name: Permit2
            chainId: 1
            verifyingContract: '0x000000000022D473030F116dDEE9F6B43aC78BA3'
          message:
            permitted:
              token: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
