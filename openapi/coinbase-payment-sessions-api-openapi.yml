      summary: List payment session refunds
      description: Returns a paginated list of refunds for a payment session. Each refund includes its status, amount, reason, associated onchain transactions, and timestamps. Only refunds accessible by the current API key are returned.
      operationId: listPaymentSessionRefunds
      x-audience: public
      tags:
      - Payment Sessions
      security:
      - apiKeyAuth: []
      parameters:
      - name: paymentSessionId
        in: path
        required: true
        description: The unique identifier of the payment session.
        schema:
          $ref: '#/components/schemas/PaymentSessionId'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Successfully listed refunds.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - refunds
                  properties:
                    refunds:
                      type: array
                      description: The list of refunds.
                      items:
                        $ref: '#/components/schemas/Refund'
                - $ref: '#/components/schemas/ListResponse'
                example:
                  refunds:
                  - refundId: refund_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                    paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                    source:
                      accountId: account_af2937b0-9846-4fe7-bfe9-ccc22d935114
                      asset: usdc
                    status: succeeded
                    amount: '0.50'
                    metadata:
                      customer_id: cust_12345
                      order_reference: order-67890
                    reason: Customer returned the item.
                    onchainTransactions:
                    - transactionHash: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
                      network: base
                    createdAt: '2025-06-15T12:40:00.000Z'
                    updatedAt: '2025-06-15T12:41:00.000Z'
                  nextPageToken: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid query parameters.
        '404':
          description: Payment session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Payment session with the given ID does not exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/payment-sessions/{paymentSessionId}/refunds/{refundId}:
    get:
      summary: Get a payment session refund
      description: Retrieves a single refund by its ID, including status, refunded amount, reason, associated onchain transactions, and timestamps. Only returns the refund if the API key has permission to access it.
      operationId: getPaymentSessionRefund
      x-audience: public
      tags:
      - Payment Sessions
      security:
      - apiKeyAuth: []
      parameters:
      - name: paymentSessionId
        in: path
        required: true
        description: The unique identifier of the payment session.
        schema:
          $ref: '#/components/schemas/PaymentSessionId'
      - name: refundId
        in: path
        required: true
        description: The unique identifier of the refund.
        schema:
          $ref: '#/components/schemas/RefundId'
      responses:
        '200':
          description: Successfully retrieved refund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
              example:
                refundId: refund_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                source:
                  accountId: account_af2937b0-9846-4fe7-bfe9-ccc22d935114
                  asset: usdc
                status: succeeded
                amount: '0.50'
                metadata:
                  customer_id: cust_12345
                  order_reference: order-67890
                reason: Customer returned the item.
                onchainTransactions:
                - transactionHash: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
                  network: base
                createdAt: '2025-06-15T12:40:00.000Z'
                updatedAt: '2025-06-15T12:41:00.000Z'
        '404':
          description: Refund not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Refund with the given ID does not exist.
        '500':
