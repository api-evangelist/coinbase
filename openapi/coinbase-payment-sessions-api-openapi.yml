  /v2/payment-sessions/{paymentSessionId}/authorizations/wallet:
    post:
      summary: Authorize a payment session with a wallet
      description: '**Customer-initiated.** Authorizes a payment session using the payer''s wallet. The payer signs the payloads themselves, so this call is unauthenticated. The session must be in `created` status.


        The `optionId` must match one of the options returned by the **Get Wallet Authorization Options** endpoint. Include the signed payloads for the selected option.


        On authorization, a hold is placed on the payer''s funds. The authorization is returned in `pending` status and transitions asynchronously to `succeeded` or `failed`.


        If `autoCapture` is enabled on the session, a capture is automatically created after a successful authorization.'
      operationId: authorizeWalletPaymentSession
      x-audience: public
      tags:
      - Payment Sessions
      security:
      - unauthenticated: []
      parameters:
      - name: paymentSessionId
        in: path
