    CoinbaseAuthorizationRequest:
      type: object
      description: A request to authorize a payment session using the payer's Coinbase account authenticated via OAuth.
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        customerDisplay:
          allOf:
          - $ref: '#/components/schemas/OperationCustomerDisplay'
          description: Optional customer-facing display data for this authorization, shown to the payer. Falls back to the session's `orderCode` when `referenceCode` is omitted.
          example:
            referenceCode: REF-ABC123
        externalReferenceId:
          allOf:
          - $ref: '#/components/schemas/ExternalReferenceId'
          description: An optional merchant-provided internal identifier for this Coinbase authorization, from the merchant's own system—not visible to the payer.
          example: merchant-authorization-abc123
    Authorization:
      type: object
      description: A hold placed on the payer's funds. Once authorized, the merchant can capture (collect) the funds. Only one authorization is allowed per session.
      properties:
        authorizationId:
          allOf:
          - $ref: '#/components/schemas/AuthorizationId'
          description: The unique identifier of the authorization.
          example: authorization_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        paymentSessionId:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionId'
          description: The ID of the payment session this authorization belongs to.
          example: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentActionStatus'
          description: The current status of the authorization.
          example: pending
        amount:
          type: string
          description: A decimal representation of the authorized amount, denominated in the session's `asset`.
          example: '1.00'
        error:
          $ref: '#/components/schemas/PaymentError'
        message:
          type: string
          description: A human-readable message describing the outcome or status for display. Returned for x402 authorizations; omitted for other authorization flows unless documented otherwise.
          example: Your payment was successfully submitted
        metadata:
          $ref: '#/components/schemas/Metadata'
        externalReferenceId:
          allOf:
          - $ref: '#/components/schemas/ExternalReferenceId'
          description: A merchant-provided internal identifier for this authorization, from the merchant's own system—not visible to the payer. Present only when supplied on the authorization request.
          example: merchant-authorization-abc123
        customerDisplay:
          allOf:
          - $ref: '#/components/schemas/OperationCustomerDisplay'
          description: Customer-facing display data for this authorization, shown to the payer. Present when supplied on the authorization request or when the session's `orderCode` fallback applies; otherwise omitted.
        source:
          allOf:
          - $ref: '#/components/schemas/PaymentSessionSource'
          description: The payer for this authorization. For wallet authorizations, this is the blockchain address that signed the payloads. For Coinbase authorizations, this is the authenticated Coinbase account. This value is also reflected on the parent payment session's `source` field after a successful authorization.
          example:
            address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
            network: base
            asset: usdc
        onchainTransactions:
          type: array
          description: The onchain transactions associated with this authorization.
          items:
            $ref: '#/components/schemas/OnchainTransaction'
          example:
          - transactionHash: '0xabc123def456789012345678901234567890abcdef1234567890abcdef123456'
            network: base
        createdAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the authorization was created.
          example: '2025-06-15T12:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the authorization was last updated.
          example: '2025-06-15T12:01:00.000Z'
      example:
        authorizationId: authorization_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        status: succeeded
        amount: '1.00'
        source:
          address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
          network: base
          asset: usdc
        onchainTransactions:
        - transactionHash: '0xabc123def456789012345678901234567890abcdef1234567890abcdef123456'
          network: base
        metadata:
          customer_id: cust_12345
        createdAt: '2025-06-15T12:00:00.000Z'
        updatedAt: '2025-06-15T12:01:00.000Z'
    RefundSource:
