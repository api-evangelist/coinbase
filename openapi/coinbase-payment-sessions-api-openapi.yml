  /v2/payment-sessions/{paymentSessionId}/authorizations/wallet/options:
    get:
      summary: Get wallet authorization options
      description: 'Returns the available wallet authorization options for a payment session. The session must be in `created` status.


        Provide one or more payer wallet addresses as query parameters. Each option specifies the currency, amount, network, and payloads the payer must sign to authorize the payment. Present the options to the payer and let them choose one, then call **Authorize Wallet** with the selected option.


        This is a stateless read operation — the session is not modified.


        If a requested address has no eligible authorization options (e.g. insufficient funds), it appears in `ineligibleAddresses` with a `code` and `message` instead of being absent from `options`. When an address is ineligible because of `insufficient_funds`, its `fundsRequired` array lists, per enabled (network, asset) combination, the current balance and required balance the payer needs to become eligible.'
      operationId: getWalletAuthorizationOptions
      x-audience: public
      tags:
      - Payment Sessions
      security:
      - unauthenticated: []
      parameters:
      - name: paymentSessionId
        in: path
        required: true
        description: The unique identifier of the payment session.
        schema:
          $ref: '#/components/schemas/PaymentSessionId'
      - name: addresses
        in: query
        required: true
        description: The payer wallet addresses to generate authorization options for. Provide between 1 and 5 unique addresses, comma-separated (e.g. `?addresses=0xA,0xB`). Each returned option's `source.address` identifies which requested address it applies to. If a requested address has no eligible authorization options, it appears in `ineligibleAddresses` with a `code` explaining why.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BlockchainAddress'
          minItems: 1
          maxItems: 5
          uniqueItems: true
        style: form
        explode: false
        example:
        - '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
        - '0xDeF9876543210FeDcBa9876543210FedcBa987654'
      - name: network
        in: query
        required: false
        description: Optional filter to restrict options to a specific blockchain network.
        schema:
          $ref: '#/components/schemas/PaymentSourceNetwork'
        example: base
      - name: asset
        in: query
        required: false
        description: Filter options by asset. Currently, only `usdc` and `usdt` return results.
        schema:
          $ref: '#/components/schemas/Asset'
