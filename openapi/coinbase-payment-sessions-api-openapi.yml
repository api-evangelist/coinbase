  /v2/payment-sessions/{paymentSessionId}/cancel:
    post:
      summary: Cancel a payment session
      description: 'Cancels a payment session before any funds have been authorized or captured. The session must be in `created` status. Cancel is blocked while any authorization action is pending.


        Once canceled, no further actions can be performed on the session. This is the only way to terminate a pre-authorization session — expiry deadlines block actions but do not automatically transition the session to a terminal state.'
      operationId: cancelPaymentSession
      x-audience: public
      tags:
      - Payment Sessions
      security:
      - apiKeyAuth: []
      parameters:
      - name: paymentSessionId
        in: path
        required: true
        description: The unique identifier of the payment session to cancel.
        schema:
          $ref: '#/components/schemas/PaymentSessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPaymentSessionRequest'
            example:
              cancellationReason: Customer requested cancellation.
      responses:
        '200':
          description: Successfully canceled payment session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
              examples:
                wallet_target:
                  summary: Canceled payment session with a wallet target
                  value:
                    paymentSessionId: paymentSession_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                    entityId: entity_af2937b0-9846-4fe7-bfe9-ccc22d935114
                    status: canceled
