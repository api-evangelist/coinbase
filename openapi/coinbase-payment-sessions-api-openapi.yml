                  description: 'The request supplied two payer addresses that both hold the session asset (USDC). The engine returns at most one option per asset, selecting the higher-priority source, so a single option appears in `options`. The other address appears in `ineligibleAddresses` with `code: superseded_by_preferred_option`.'
