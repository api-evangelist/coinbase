      x-error-instructions:
        incompatible_event_types: 'The `eventTypes` in a webhook subscription belong to different scopes that cannot be combined in a single subscription.


          **Steps to resolve:**

          1. Group `eventTypes` by compatible label requirements.

          2. Create a separate webhook subscription for each group.'
        invalid_webhook_headers: 'One or more custom webhook target headers have invalid names or values, duplicate names with different capitalization, or names reserved for delivery metadata and HTTP routing.


          **Steps to resolve:**

          1. Check `target.headers` for invalid names, values, and case-insensitive duplicates.

          2. Remove blocked headers such as `Cookie`, `Host`, and `X-Webhook-*`, then retry.'
        invalid_webhook_url: 'The webhook target URL did not pass scheme, host, address, or endpoint checks.


          **Steps to resolve:**

          1. Verify `target.url` uses HTTPS and responds to HEAD requests with a 200.

          2. Confirm the endpoint is reachable and responds without a server error, then retry.'
        subscription_limit_exceeded: 'The project or entity has reached the maximum number of webhook subscriptions allowed (100).


          **Steps to resolve:**

          1. Delete any webhook subscriptions that are no longer needed.

          2. Retry creating the subscription.'
        already_exists: 'This error occurs when trying to create a resource that already exists.


          **Steps to resolve:**

          1. Check if the resource exists before creation

          2. Use GET endpoints to verify resource state

          3. Use unique identifiers/names for resources'
        authorization_expired: Returned when an authorization attempt is made after the payment session's authorization deadline has passed. Create a new payment session with a later authorization deadline.
        bad_gateway: "This error occurs when the CDP API is unable to connect to the backend service.\n\n**Steps to resolve:**\n1. Retry your request after a short delay\n2. If persistent, contact CDP support with:\n   - The timestamp of the error\n   - Request details\n3. Consider implementing retry logic with an exponential backoff\n\n**Note:** These errors are automatically logged and monitored by CDP."
        capture_expired: Returned when a capture attempt is made after the payment session's capture deadline has passed. The payment session can no longer be captured.
        client_closed_request: 'This error occurs when the client closes the connection before the server can send a response.


          **Common causes:**

          - The client timed out waiting for the server response

          - The client application was terminated during a pending request

          - Network interruption caused the client connection to drop


          **Steps to resolve:**

          1. Increase client-side timeout settings if applicable

          2. Implement retry logic with exponential backoff for long-running queries

          3. Consider optimizing the request to reduce server processing time'
        endpoint_unavailable: "This error occurs when a specific endpoint has been temporarily disabled by an operator (e.g. a kill switch). The CDP API as a whole is still healthy; only this endpoint is unavailable. Distinct from `service_unavailable`, which indicates the API itself is down.\n\nRe-enabling is a manual operator action, so the endpoint may remain unavailable for an extended period.\n\n**Steps to resolve:**\n1. Check the [CDP status page](https://cdpstatus.coinbase.com/) for an active incident.\n2. If persistent, contact CDP support with:\n   - The timestamp of the error\n   - Request details"
        faucet_limit_exceeded: 'This error occurs when you''ve exceeded the faucet request limits.


          **Steps to resolve:**

          1. Wait for the time window to reset

          2. Use funds more efficiently in your testing


          For more information on faucet limits, please visit the [EVM Faucet endpoint](https://docs.cdp.coinbase.com/api-reference/v2/rest-api/faucets/request-funds-on-evm-test-networks) or the [Solana Faucet endpoint](https://docs.cdp.coinbase.com/api-reference/v2/rest-api/faucets/request-funds-on-solana-devnet).'
        customer_not_authorized: "This error occurs when the customer is not currently authorized for one\nor more capabilities required to perform the requested action. This can\nhappen at any point in the customer's lifecycle and may or may not be\nresolvable by the developer.\n\nThe response includes an `unauthorizedCapabilities` field listing the\ncapability code(s) that were not authorized on this request.\n\n**Steps to resolve:**\n1. Fetch the customer with `GET /v2/customers/{customerId}` and inspect\n   the `requirements` field. If `requirements.due` is non-empty, submit\n   the listed fields via `PUT /v2/customers/{customerId}` and retry.\n2. If `requirements.due` is empty, no further action is available — the\n   customer is not currently eligible for this action."
        forbidden: 'This error occurs when you don''t have permission to access the resource.


          **Steps to resolve:**

          1. Verify your permissions to access the resource

          2. Ensure that you are the owner of the requested resource'
        idempotency_error: "This error occurs when an idempotency key is reused with different parameters.\n\n**Steps to resolve:**\n1. Generate a new UUID v4 for each unique request\n2. Only reuse idempotency keys for exact request duplicates\n3. Track used keys within your application\n\n**Example idempotency key implementation:**\n```typescript lines wrap\nimport { v4 as uuidv4 } from 'uuid';\n\nfunction createIdempotencyKey() {\n  return uuidv4();\n}\n```"
        internal_server_error: "This indicates an unexpected error that occurred on the CDP servers.\n\n**Important**: If you encounter this error, please note that your operation's status should be treated as unknown by your application, as it could have been a success within the CDP back-end.\n\n**Steps to resolve:**\n1. Retry your request after a short delay\n2. If persistent, contact CDP support with:\n   - Your correlation ID\n   - Timestamp of the error\n   - Request details\n3. Consider implementing retry logic with an exponential backoff\n\n**Note:** These errors are automatically logged and monitored by CDP."
        invalid_request: "This error occurs when the request is malformed or contains invalid data, including issues with the request body, query parameters, path parameters, or headers.\n\n**Steps to resolve:**\n1. Check all required fields and parameters are present\n2. Ensure request body (if applicable) follows the correct schema\n3. Verify all parameter formats match the API specification:\n   - Query parameters\n   - Path parameters\n   - Request headers\n4. Validate any addresses, IDs, or other formatted strings meet requirements\n\n**Common validation issues:**\n- Missing required parameters\n- Invalid parameter types or formats\n- Malformed JSON in request body\n- Invalid enum values\n\n#### Transfer-specific validation errors\n\nThe following transfer validation scenarios return `errorType: \"invalid_request\"`. Use the `errorMessage` field to identify the specific case.\n\n| Scenario | Example `errorMessage` |\n|----------|----------------------|\n| Source account ID is malformed | `\"source is invalid.\"` |\n| Target account ID is malformed | `\"target is invalid.\"` |\n| Source account does not exist | `\"source not found.\"` |\n| Target account does not exist | `\"target not found.\"` |\n| Asset not supported at source | `\"source is not supported.\"` |\n| Asset not supported at target | `\"target is not supported.\"` |\n| Target email address is malformed | `\"target has an invalid email format.\"` |\n| Target onchain address is invalid for network | `\"The recipient address is invalid for the selected network.\"` |\n| Asset not supported for this transfer route | `\"Transfer asset pair is not supported.\"` |\n| Insufficient balance | `\"Insufficient funds to complete this transfer.\"` |\n| Asset mismatch between request fields | `\"Currency mismatch in request.\"` |\n| Metadata has too many keys | `\"Metadata has too many keys. Up to 10 key/value pairs are permitted.\"` |\n| Metadata key exceeds length limit | `\"Metadata key is too long. Each key must be less than or equal to 40 characters.\"` |\n| Metadata value exceeds length limit | `\"Metadata value is too long. Each value must be less than or equal to 500 characters.\"` |\n| Travel rule fields missing | `\"Travel rule information is incomplete. Missing fields: ...\"` |\n| Recipient address not in account allowlist | `\"Your coinbase account allowlist does not include this address. Please update your allowlist at https://www.coinbase.com/settings/allowlist\"` |"
        invalid_sql_query: 'This error occurs when the SQL query is invalid or not allowed.


          **Common causes:**

          - Using non-SELECT SQL statements (INSERT, UPDATE, DELETE, etc.)

          - Invalid table or column names

          - Syntax errors in SQL query

          - Query exceeds character limit

          - Too many JOIN operations'
        invalid_signature: 'This error occurs when the signature provided for the given user operation is invalid.


          **Steps to resolve:**

          1. Verify the signature was generated by the correct owner account

          2. Ensure the signature corresponds to the exact user operation hash

          3. Check that the signature format matches the expected format

          4. Confirm you''re using the correct network for the Smart Account


          **Common causes:**

          - Using wrong owner account to sign

          - Signing modified/incorrect user operation data

          - Malformed signature encoding

          - Network mismatch between signature and broadcast'
        malformed_transaction: "This error occurs when the transaction data provided is not properly formatted or is invalid.\n\n**Steps to resolve:**\n1. Verify transaction encoding:\n   - **EVM networks**: Check RLP encoding is correct\n   - **Solana**: Validate base64 encoding\n2. Ensure all required transaction fields are present\n3. Validate transaction parameters are within acceptable ranges\n4. Check that the transaction type is supported on the target network\n\n**Common causes:**\n- Invalid hex encoding for EVM transactions\n- Missing required transaction fields\n- Incorrect parameter formats\n- Unsupported transaction types\n- Network-specific transaction format mismatches"
        not_found: 'This error occurs when the resource specified in your request doesn''t exist or you don''t have access to it.


          **Steps to resolve:**

          1. Verify the resource ID/address/account exists

          2. Check your permissions to access the resource

          3. Ensure you''re using the correct network/environment

          4. Confirm the resource hasn''t been deleted


          **Common causes:**

          - Mistyped addresses

          - Accessing resources from the wrong CDP project

          - Resource was deleted or hasn''t been created yet'
        operation_in_progress: "This error occurs when another operation of the same kind is already in progress for\nthe resource, and the request must wait for it to complete.\n\n**Steps to resolve:**\n1. Wait for the in-progress operation to complete (typically under 30 seconds)\n2. Once complete, use the resource's GET endpoint to read its state instead of\n   retrying the create\n\n**Common causes:**\n- Retrying a create whose previous attempt is still being processed\n- Concurrent duplicate requests for the same resource"
        payment_method_required: 'This error occurs when a payment method is required to complete the requested operation but none is configured or available.


          **Steps to resolve:**

          1. Add a valid payment method to your account using the [CDP Portal](https://portal.cdp.coinbase.com)

          2. Ensure your payment method is valid and not expired


          **Common causes:**

          - No payment method configured on the account

          - Payment method is expired'
        payment_required: 'This error occurs when an x402 payment is required to access the requested resource.


          **Steps to resolve:**

          1. Include a valid x402 payment header in your request

          2. Ensure the payment meets the resource''s pricing requirements'
        settlement_failed: 'This error occurs when an x402 payment was verified but settlement on-chain failed.


          **Steps to resolve:**

          1. Retry the request with a new payment

          2. Ensure the payment asset has sufficient balance for settlement'
        rate_limit_exceeded: "This error occurs when you've exceeded the API rate limits.\n\n**Steps to resolve:**\n1. Implement exponential backoff\n2. Cache responses where possible\n3. Wait for rate limit window to reset\n\n**Best practices:**\n```typescript lines wrap\nasync function withRetry(fn: () => Promise<any>) {\n  let delay = 1000;\n  while (true) {\n    try {\n      return await fn();\n    } catch (e) {\n      if (e.errorType === \"rate_limit_exceeded\") {\n        await sleep(delay);\n        delay *= 2;\n        continue;\n      }\n      throw e;\n    }\n  }\n}\n```"
        request_canceled: "This error occurs when the client cancels an in-progress request before it completes.\n\n**Steps to resolve:**\n1. Check client-side timeout configurations\n2. Review request cancellation logic in your code\n3. Consider increasing timeout thresholds for long-running operations\n4. Implement request tracking to identify premature cancellations\n\n**Best practices:**\n```typescript lines wrap\nasync function withTimeout<T>(promise: Promise<T>, timeoutMs: number): Promise<T> {\n  const timeout = new Promise((_, reject) => {\n    setTimeout(() => {\n      reject(new Error(\"Operation timed out\"));\n    }, timeoutMs);\n  });\n\n  try {\n    return await Promise.race([promise, timeout]);\n  } catch (error) {\n    // Handle timeout or cancellation\n    throw error;\n  }\n}\n```"
        service_unavailable: "This error occurs when the CDP API is temporarily unable to handle requests due to maintenance or high load.\n\n**Steps to resolve:**\n1. Retry your request after a short delay\n2. If persistent, contact CDP support with:\n   - The timestamp of the error\n   - Request details\n3. Consider implementing retry logic with an exponential backoff\n\n**Note:** These errors are automatically logged and monitored by CDP."
        timed_out: "This error occurs when a request exceeds the maximum allowed processing time.\n\n**Steps to resolve:**\n1. Break down large requests into smaller chunks (if applicable)\n2. Implement retry logic with exponential backoff\n3. Use streaming endpoints for large data sets\n\n**Example retry implementation:**\n```typescript lines wrap\nasync function withRetryAndTimeout<T>(\n  operation: () => Promise<T>,\n  maxRetries = 3,\n  timeout = 30000,\n): Promise<T> {\n  let attempts = 0;\n  while (attempts < maxRetries) {\n    try {\n      return await Promise.race([\n        operation(),\n        new Promise((_, reject) =>\n          setTimeout(() => reject(new Error(\"Timeout\")), timeout)\n        ),\n      ]);\n    } catch (error) {\n      attempts++;\n      if (attempts === maxRetries) throw error;\n      // Exponential backoff\n      await new Promise(resolve =>\n        setTimeout(resolve, Math.pow(2, attempts) * 1000)\n      );\n    }\n  }\n  throw new Error(\"Max retries exceeded\");\n}\n```"
        unauthorized: "This error occurs when authentication fails.\n\n**Steps to resolve:**\n1. Verify your CDP API credentials:\n   - Check that your API key is valid\n   - Check that your Wallet Secret is properly configured\n2. Validate JWT token:\n   - Not expired\n   - Properly signed\n   - Contains required claims\n3. Check request headers:\n   - Authorization header present\n   - X-Wallet-Auth header included when required\n\n**Security note:** Never share your Wallet Secret or API keys."
        unsupported_tos_language: 'A submitted Terms of Service acceptance used a `language` that is not published for the referenced `versionId`.


          **Steps to resolve:**

          1. Read `Customer.requirements.tos.tosVersions[]` and find the entry whose `versionId` matches your acceptance.

          2. Choose a `language` from that entry''s `languages` list (BCP 47 tags).

          3. Retry with `tosAcceptances[].language` set to a supported tag.'
        policy_in_use: 'This error occurs when trying to delete a Policy that is currently in use by at least one project or account.


          **Steps to resolve:**

          1. Update project or accounts to remove references to the Policy in question.

          2. Retry your delete request.'
        network_not_tradable: 'This error occurs when the selected asset cannot be purchased on the selected network in the user''s location.


          **Steps to resolve:**

          1. Verify the asset is tradable on the selected network

          2. Check the user''s location to ensure it is allowed to purchase the asset on the selected network


          **Common causes:**

          - Users in NY are not allowed to purchase USDC on any network other than Ethereum'
        guest_permission_denied: 'This error occurs when the user is not allowed to complete onramp transactions as a guest.


          **Steps to resolve:**

          1. Redirect the user to create a Coinbase account to buy and send crypto.'
        guest_region_forbidden: 'This error occurs when guest onramp transactions are not allowed in the user''s region.


          **Steps to resolve:**

          1. Redirect the user to create a Coinbase account to buy and send crypto.'
        guest_transaction_limit: 'This error occurs when the user has reached the weekly guest onramp transaction limit.


          **Steps to resolve:**

          1. Inform the user they have reached their weekly limit and will have to wait until next week.'
        guest_transaction_count: 'This error occurs when the user has reached the lifetime guest onramp transaction count limit.


          **Steps to resolve:**

          1. Redirect the user to create a Coinbase account to buy and send crypto.'
        phone_number_verification_expired: 'This error occurs when the user''s phone number verification has expired. Use of guest Onramp requires the user''s

          phone number to be verified every 60 days.


          **Steps to resolve:**

          1. Re-verify the user''s phone number via OTP.

          2. Retry the request with the phoneNumberVerifiedAt field set to new verification timestamp.'
        otp_verification_destination_mismatch: 'The `phoneNumber` or `email` on the order does not match the `destination` that was verified.


          **Steps to resolve:**

          1. Ensure the `phoneNumber` or `email` field on the order matches the `destination` used during verification.

          2. If the value changed, complete a new verification for the updated phone number or email.'
        otp_verification_expired: 'The `smsVerificationId` or `emailVerificationId` provided has expired.

          Verification IDs are valid for 60 days after successful OTP submission.


          **Steps to resolve:**

          1. Complete a new verification flow for the user.

          2. Use the new verification ID when creating orders.'
        otp_verification_code_invalid: 'This error occurs when the OTP code submitted to complete a verification is incorrect or has expired

          (the 10-minute OTP window has elapsed).


          **Steps to resolve:**

          1. Ask the user to re-enter the code.

          2. If the OTP window has expired, start a new verification flow.'
        otp_verification_invalid: 'This error occurs when the verification record exists but is not in a usable state for the requested operation.


          **Common causes:**

          - The verification is still pending (OTP not yet submitted successfully).

          - The verification has been revoked.

          - The verification channel does not match the expected field (`smsVerificationId` or `emailVerificationId`).


          **Steps to resolve:**

          1. Complete a new verification flow and retry.'
        otp_verification_not_found: 'The provided SMS or email verification ID does not correspond to any verification record.


          **Steps to resolve:**

          1. Ensure you are passing the correct verification ID as `smsVerificationId` or `emailVerificationId`.

          2. If the issue persists, complete a new verification flow.'
        otp_verification_required: 'An SMS or email verification ID is required on order creation but none was provided.


          **Steps to resolve:**

          1. Verify the user''s phone number and email before creating an order.

          2. Pass the returned verification IDs as `smsVerificationId` and `emailVerificationId` when creating orders.'
        document_verification_failed: 'This error occurs when the user has not verified their identity for their coinbase.com account.

          **Steps to resolve:**

          1. Verify your coinbase account identity with valid documents at https://www.coinbase.com/settings/account-levels.'
        recipient_allowlist_violation: 'This error occurs when the user is not allowed to receive funds at this address, according to their coinbase account allowlist.

          **Steps to resolve:**

          1. Either disable the allowlist or add the wallet address at https://www.coinbase.com/settings/allowlist

          2. Wait approximately 2 days for updates to take effect.'
        recipient_allowlist_pending: 'This error occurs when the user is not allowed to receive funds at this address, because changes to their coinbase account allowlist are pending.

          **Steps to resolve:**

          1. Wait approximately 2 days for updates to take effect.'
        refund_expired: Returned when a refund attempt is made after the payment session's refund deadline has passed. The payment session can no longer be refunded.
        travel_rules_recipient_violation: 'This error occurs when the user is not allowed to receive funds at this address, because it violates travel rules.

          **Steps to resolve:**

          1. Ensure your desired transfer is not blocked by local travel regulations.'
        mfa_already_enrolled: 'This error occurs when attempting to enroll in an MFA method that the user has already enrolled in.


          **Steps to resolve:**

          1. Check if the user is already enrolled in the MFA method before initiating enrollment

          2. To update or reset MFA, remove the existing enrollment first (if supported)

          3. Use a different MFA method if multiple options are available'
        mfa_invalid_code: 'This error occurs when the MFA code provided is incorrect or has already been used.


          **Steps to resolve:**

          1. Verify the user entered the correct code from their authenticator app

          2. Ensure the code is current (TOTP codes expire after 30 seconds)

          3. Check that the device time is synchronized correctly

          4. Ask the user to generate a new code and try again


          **Common causes:**

          - Typing errors in the 6-digit code

          - Using an expired TOTP code

          - Device clock drift on user''s authenticator app

          - Attempting to reuse a previously submitted code'
        mfa_challenge_not_found: 'This error occurs when the challenge named by `X-Mfa-Challenge-Id` is unknown to the server or was already consumed by a failed submit attempt. This is distinct from `mfa_flow_expired`, which indicates the flow timed out.


          **Possible resolutions**

          - Pass the exact challenge ID from the `X-Mfa-Challenge-Id` header of the prior `403 mfa_required` response

          - If the user failed MFA verification (e.g. by entering the wrong OTP), re-initiate the MFA flow to obtain a fresh challenge


          **Common causes:**

          - Reusing a challenge after a failed submit attempt

          - A client bug sending a challenge from a different flow or user'
        mfa_flow_expired: 'This error occurs when the MFA enrollment or verification session has expired.


          **Steps to resolve:**

          1. Restart the MFA enrollment or verification flow

          2. Complete the flow within the allowed time window (typically 5 minutes)

          3. Ensure the user doesn''t leave the flow idle for extended periods


          **Note:** MFA sessions expire automatically for security purposes.'
        mfa_required: 'This error occurs when attempting to perform a sensitive operation that requires MFA verification, but the user has not completed MFA verification.


          **Steps to resolve:**

          1. Initiate the MFA verification flow using the `/mfa/verify/{mfaMethod}/init` endpoint

          2. Prompt the user to enter their MFA code

          3. Submit the verification using the `/mfa/verify/{mfaMethod}/submit` endpoint

          4. Use the returned access token with MFA claim for the sensitive operation

          5. Retry the original request with the new MFA-verified token


          **Operations requiring MFA:**

          - Transactions Sign/Send

          - Key export

          - Account management actions (when configured)'
        mfa_not_enrolled: 'This error occurs when attempting to verify MFA for a user who has not enrolled in any MFA method.


          **Steps to resolve:**

          1. Check if the user has enrolled in MFA before attempting verification

          2. Guide the user through MFA enrollment first using the `/mfa/enroll/{mfaMethod}/init` endpoint

          3. Complete enrollment before requiring MFA verification'
        source_account_invalid: 'This error occurs when the source account specified in the transfer request is invalid or malformed.


          **Steps to resolve:**

          1. Verify the account ID format is correct (e.g., `account_xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`)

          2. Ensure the account ID belongs to your CDP entity

          3. Verify the account ID exists by calling `GET /v2/accounts/{accountId}` or `GET /v2/accounts`


          **Common causes:**

          - Malformed account ID

          - Typo in the account ID'
        target_account_invalid: 'This error occurs when the target account specified in the transfer request is invalid or malformed.


          **Steps to resolve:**

          1. Verify the account ID format is correct (e.g., `account_xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`)

          2. Ensure the account exists and can receive funds

          3. Verify the account ID exists by calling `GET /v2/accounts/{accountId}` or `GET /v2/accounts`


          **Common causes:**

          - Malformed account ID

          - Typo in the account ID'
        source_account_not_found: 'This error occurs when the source account specified in the transfer does not exist.


          **Steps to resolve:**

          1. Verify the account ID exists by calling `GET /v2/accounts/{accountId}` or `GET /v2/accounts`'
        target_account_not_found: 'This error occurs when the target account specified in the transfer does not exist.


          **Steps to resolve:**

          1. Verify the account ID exists by calling `GET /v2/accounts/{accountId}` or `GET /v2/accounts`'
        source_asset_not_supported: 'This error occurs when the asset specified in the transfer source is not supported for this transfer type.


          **Steps to resolve:**

          1. Check the list of supported assets for the source account type

          2. Verify the asset symbol is correctly specified (e.g., `usdc`, `usdt`)


          **Common causes:**

          - Unsupported asset for the transfer route

          - Incorrect asset symbol'
        target_asset_not_supported: 'This error occurs when the asset specified in the transfer target is not supported for this transfer type.


          **Steps to resolve:**

          1. Check the list of supported assets for the target

          2. Verify the asset symbol is correctly specified (e.g., `usdc`, `usdt`)

          3. Ensure the target can receive this asset type


          **Common causes:**

          - Asset not supported by the target

          - Unsupported conversion between source and target assets'
        target_email_invalid: 'This error occurs when the email address specified as the transfer target is invalid.


          **Steps to resolve:**

          1. Verify the email address format is valid (e.g., `user@example.com`)

          2. Check for typos in the email address

          3. Ensure the email domain is valid


          **Common causes:**

          - Invalid email format

          - Missing @ symbol or domain

          - Typo in the email address'
        target_onchain_address_invalid: 'This error occurs when the onchain address specified as the transfer target is invalid for the specified network.


          **Steps to resolve:**

          1. Ensure the network is supported for the transfer type

          2. Verify the address format matches the target network

          3. Ensure you haven''t mixed up addresses from different networks


          **Common causes:**

          - Network not supported for the transfer type

          - Address format doesn''t match network

          - Address from a different blockchain network'
        transfer_amount_invalid: 'This error occurs when the transfer amount is invalid.


          **Steps to resolve:**

          1. Ensure the amount is a positive number and greater than $1 USD equivalent amount

          2. Verify the amount format is a valid decimal string (e.g., `"100.50"`)

          3. Check the number of decimal places for the asset


          **Common causes:**

          - Zero or negative amount

          - Too many decimal places for the asset

          - Amount below minimum threshold ($1 USD equivalent amount)'
        transfer_asset_not_supported: 'This error occurs when the asset specified for the transfer is not supported.


          **Steps to resolve:**

          1. Check the list of supported assets for transfers

          2. Verify the asset symbol is correctly specified

          3. Ensure the asset is supported for the transfer route (source → target)


          **Common causes:**

          - Asset not supported for transfers

          - Incorrect asset symbol'
        transfer_quote_expired: 'This error occurs when the transfer quote has expired. Quotes are valid for a limited time.


          **Steps to resolve:**

          1. Create a new transfer to obtain a fresh quote

          2. Execute the transfer promptly after creation


          **Common causes:**

          - Too much time elapsed between creating and executing the transfer'
        insufficient_balance: 'This error occurs when the source account does not have enough funds to complete the transfer including fees.


          **Steps to resolve:**

          1. Check the source account balance

          2. Ensure the balance covers both the transfer amount and any fees

          3. Consider using `amountType: "source"` to transfer the maximum available amount minus fees

          4. Add funds to the source account if needed


          **Common causes:**

          - Transfer amount exceeds available balance

          - Not accounting for transfer fees

          - Pending transactions reducing available balance'
        metadata_too_many_entries: 'This error occurs when the transfer metadata contains more entries than allowed.


          **Steps to resolve:**

          1. Reduce the number of metadata entries (maximum 10 allowed)

          2. Consolidate related data into fewer keys

          3. Store additional data externally and reference it with a single metadata entry


          **Limits:**

          - Maximum entries: 10'
        metadata_key_too_long: 'This error occurs when a metadata key exceeds the maximum allowed length.


          **Steps to resolve:**

          1. Shorten the metadata key to 40 characters or less

          2. Use abbreviations or shorter naming conventions

          3. Consider using a key-value structure where the value contains the longer identifier


          **Limits:**

          - Maximum key length: 40 characters'
        metadata_value_too_long: 'This error occurs when a metadata value exceeds the maximum allowed length.


          **Steps to resolve:**

          1. Shorten the metadata value to 500 characters or less

          2. Store longer data externally and reference it with a shorter identifier

          3. Consider compressing or encoding the data if appropriate


          **Limits:**

          - Maximum value length: 500 characters'
        travel_rules_field_missing: 'This error occurs when required travel rule fields are missing from the transfer request.


          **Steps to resolve:**

          1. Include the `travelRule` object in your transfer request

          2. Supply the required missing fields prompted by the error message

          3. Review the travel rule requirements for your jurisdiction


          Note: Required fields may vary by region.'
        asset_mismatch: 'This error occurs when the assets specified in the transfer are incompatible or don''t match expected values.


          **Steps to resolve:**

          1. Ensure the `asset` field matches either the source or target asset

          2. Verify that the source and target assets are compatible for conversion (if different)

          3. Check that the asset symbols are correctly specified


          **Common causes:**

          - Transfer asset doesn''t match source or target

          - Attempting an unsupported asset conversion

          - Typo in asset symbols'
        order_quote_expired: 'This error occurs when attempting to execute an order whose quote has expired.


          **Steps to resolve:**

          1. Create a new order with `execute: false` to get an updated quote.

          2. Execute the new order before the quote expires (check the `expiresAt` field).

          3. Alternatively, create a new order with `execute: true` to skip the quote step and execute immediately.'
        order_already_filled: 'This error occurs when attempting to cancel or modify an order that has already been filled.


          **Steps to resolve:**

          1. Check the current status of the order using `GET /v2/orders/{orderId}`.

          2. A filled order cannot be canceled or re-executed.'
        order_already_canceled: 'This error occurs when attempting to cancel or execute an order that has already been canceled.


          **Steps to resolve:**

          1. Check the current status of the order using `GET /v2/orders/{orderId}`.

          2. Create a new order if you still want to trade.'
        account_not_ready: 'This error occurs when an operation is attempted on an account that is still being provisioned.


          **Steps to resolve:**

          1. Wait a few moments and retry the request

          2. If the error persists, the account may still be completing setup — retry with exponential backoff'
        insufficient_liquidity: 'This error occurs when no swap route is available for the requested token pair or amount.


          **Steps to resolve:**

          1. Try a smaller `fromAmount` — large orders may exceed available liquidity

          2. Try a different token pair

          3. Retry after a short delay; liquidity conditions change with market activity'
        insufficient_allowance: "This error occurs when the taker has not approved the Permit2 contract to spend the `fromToken`\non their behalf. ERC-20 swaps require a Permit2 allowance. Native ETH swaps do not.\n\n**Steps to resolve:**\n1. Submit an ERC-20 `approve` transaction on the `fromToken` contract, granting the Permit2\n   contract (`0x000000000022D473030F116dDEE9F6B43aC78BA3`) an allowance of at least `fromAmount`\n2. Wait for the approval transaction to be confirmed on-chain\n3. Retry the swap\n\n**Example:**\n```typescript lines wrap\n// Approve Permit2 to spend fromToken\nawait walletClient.writeContract({\n  address: fromToken,\n  abi: erc20Abi,\n  functionName: \"approve\",\n  args: [\"0x000000000022D473030F116dDEE9F6B43aC78BA3\", fromAmount],\n});\n```"
        transaction_simulation_failed: 'This error occurs when the pre-broadcast simulation of the swap transaction predicted a revert.

          No transaction was submitted and no gas was spent.


          **Common causes:**

          - The on-chain price moved past the `slippageBps` tolerance between the price estimate and execution

          - Taker balance changed between the price estimate and execution


          **Steps to resolve:**

          1. Retry immediately — prices change quickly and a new quote may succeed

          2. Increase `slippageBps` if retries continue to fail (e.g. from 100 to 200)

          3. For large swaps, consider splitting into smaller amounts to reduce price impact'
        delegation_not_found: "This error occurs when a delegated signing operation is attempted but no active\ndelegation grant exists for the end user (or account).\n\n**Steps to resolve:**\n1. Create a delegation grant using `createDelegationForEndUser` (user-scoped)\n   or `createDelegationForEndUserAccount` (account-scoped) before calling\n   the signing or sending operation\n2. If you previously created a grant, it may have expired or been revoked —\n   in those cases you would receive a `delegation_expired` or\n   `delegation_revoked` error instead\n3. For account-scoped grants, verify the address in the request matches the\n   granted address (EVM addresses are compared case-insensitively;\n   Solana addresses must match exactly)"
        delegation_expired: "This error occurs when the delegation grant used for signing has expired.\nDelegation grants have a limited lifetime set at creation.\n\n**Steps to resolve:**\n1. Create a new delegation grant using `createDelegationForEndUser` or\n   `createDelegationForEndUserAccount`\n2. Retry the signing operation with the new grant active\n3. Consider creating grants with a longer TTL if expiry is frequent"
        delegation_revoked: "This error occurs when the delegation grant has been explicitly revoked.\n\n**Steps to resolve:**\n1. Create a new delegation grant using `createDelegationForEndUser` or\n   `createDelegationForEndUserAccount`\n2. Confirm with the end user before recreating, since revocation is\n   typically intentional"
        delegation_not_authorized: "This error occurs when a delegation grant exists but does not authorize the\nrequested operation.\n\n**Steps to resolve:**\n1. For account-scoped grants, verify the signing address matches the address\n   the grant was created for\n2. Check that the operation is permitted for delegated signing on your project\n3. Create a grant with the correct scope if needed"
        delegation_not_enabled: "This error occurs when delegated signing is attempted on a project that has\nnot enabled the feature.\n\n**Steps to resolve:**\n1. Enable delegated signing in your project configuration via the CDP Portal\n2. Contact support if you believe delegated signing should already be enabled\n   for your project"
        network_mismatch: 'This error occurs when the requested operation specifies a network on which the

          target resource is not deployed or not available.


          **Steps to resolve:**

          1. Use the network the resource was originally created or deployed on

          2. Check the resource metadata to confirm the correct network


          **Common causes:**

          - Specifying `base` for a resource that only exists on `base-sepolia` (or vice versa)

          - Cross-network operation attempted on a resource scoped to a single network'
        already_enabled: 'This error occurs when the requested operation cannot be performed because

          the capability is already in the desired state.


          **Steps to resolve:**

          1. Check the current state of the resource before attempting the operation

          2. No action is needed if the resource is already in the desired state


          **Common causes:**

          - Calling an enable endpoint on a resource that already has the feature enabled'
        payment_session_already_canceled: 'This error occurs when an action is attempted on a payment session that has already been canceled.


          **Steps to resolve:**

          1. Create a new payment session to proceed with the payment flow'
        payment_session_already_authorized: 'This error occurs when attempting to authorize a payment session that has already been authorized.


          **Steps to resolve:**

          1. Check the payment session status — it is already authorized

          2. Proceed to capture, void, or other post-authorization actions as needed'
        payment_session_action_pending: 'This error occurs when another action is already in progress for the payment session.


          **Steps to resolve:**

          1. Wait for the current action to complete before retrying

          2. Check the payment session status to confirm the current action result'
        no_capturable_balance: 'This error occurs when there is no remaining balance available to capture on the payment session.


          **Steps to resolve:**

          1. Verify the payment session status and previously captured amounts

          2. Ensure the session was authorized and has uncaptured funds remaining'
        no_voidable_balance: 'This error occurs when there is no held balance remaining to void on the payment session.


          **Steps to resolve:**

          1. Verify the payment session has an authorized but uncaptured balance

          2. Check whether the session has already been fully captured or voided'
        no_refundable_balance: 'This error occurs when the payment session has no captured amount available to refund.


          **Steps to resolve:**

          1. Verify the payment session has been previously captured

          2. Check that the session has not already been fully refunded'
        entity_not_configured_for_payment_acceptance: 'This error occurs when the entity is not configured to accept payments.


          **Steps to resolve:**

          1. Contact support to enable payment acceptance for the entity'
        entity_not_configured_for_top_up: 'This error occurs when Top-Up is disabled for the entity or required Top-Up configuration is missing or invalid.


          **Steps to resolve:**

          1. Contact support or your Coinbase representative to enable Top-Up or correct the entity''s Top-Up configuration'
        daily_transaction_limit_exceeded: 'This error occurs when the daily transaction limit has been exceeded.


          **Steps to resolve:**

          1. Wait until the next day when the daily limit resets

          2. Contact support for questions about your limit'
        daily_amount_limit_exceeded: 'This error occurs when the daily authorization amount limit has been exceeded.


          **Steps to resolve:**

          1. Wait until the next day when the daily limit resets

          2. Contact support for questions about your limit'
        stale_attestation: "The platform attestation (iOS App Attest assertion or Android Play Integrity token) was\ngenerated against a challenge that has since expired. The request was well-formed, but\nthe challenge is no longer valid.\n\n**Steps to resolve:**\n1. Call [Create Onramp Mobile Challenge](#operation/createOnrampMobileChallenge) to obtain\n   a fresh challenge.\n2. Re-run the platform attestation flow against the new challenge.\n3. Submit the new attestation to\n   [Create Onramp Mobile Session](#operation/createOnrampMobileSession) promptly —\n   challenges are short-lived.\n\n**Common causes:**\n- Too much time elapsed between obtaining the challenge and submitting the attestation."
        moderation_rejected: 'The uploaded image failed content moderation and will not be served.


          **Steps to resolve:**

          1. Upload a different image that complies with content policies.'
        mandate_action_pending: 'This error occurs when an approval or revocation is already in progress for the mandate.

          Get wallet approval options, approve a mandate, get wallet revocation options, revoke

          a mandate, and authorize a payment session with a mandate all return this while an

          action is in flight.


          **Steps to resolve:**

          1. Wait for the in-flight approval or revocation to succeed or fail

          2. Check the mandate `status`, then retry the request'
        mandate_policy_violation: 'This error occurs only when the request breaches the mandate policy: the charge

          exceeds `maxPerAuthorization` or `maxPerPeriod`, or an approval is rejected

          because the payer''s available balance is below `minSetupBalance`.


          **Steps to resolve:**

          1. Lower the charge, raise the mandate policy, or fund the payer above `minSetupBalance`

          2. Retry the request'
        mandate_expired: 'This error occurs when the mandate is past its `expiresAt` and can no longer be used.

          Authorization, approve a mandate, and get wallet approval options return this error.


          **Steps to resolve:**

          1. Create a new mandate if the customer should continue

          2. Do not retry the request against the expired mandate'
        mandate_canceled: 'This error occurs when `canceledAt` is set. Authorization, approve a mandate,

          and get wallet approval options return this. If `revokedAt` is also set, those

          operations return `mandate_revoked` instead.


          **Steps to resolve:**

          1. Create a new mandate if the customer should continue

          2. Do not retry the request against the canceled mandate'
        mandate_revoked: 'This error occurs when the mandate''s on-chain spending allowance has been

          removed (`revokedAt` is set, status `revocation_succeeded`).


          Authorization, approve a mandate, and get wallet approval options return this

          when `revokedAt` is set, including when `canceledAt` is also set. Get wallet

          revocation options and revoke a mandate also return this when the allowance

          was already removed. Cancel a mandate returns this: a fully revoked mandate

          cannot be canceled. Canceling an already-canceled mandate is a no-op and

          returns the mandate.


          **Steps to resolve:**

          1. Create a new mandate if the customer should continue

          2. Do not retry the request against the revoked mandate'
        mandate_invalid_status: 'This error occurs when the mandate''s status does not satisfy the operation,

          and a more specific code does not apply. `errorMessage` names the status the

          operation expected.


          Check the specific codes first: `mandate_canceled`, `mandate_revoked`,

          `mandate_expired`, and `mandate_action_pending`.


          Approve a mandate and get wallet approval options require `created` or

          `approval_failed` after those checks. `approval_succeeded`,

          `revocation_failed`, and any other remaining status return this. Authorize a

          payment session requires `approval_succeeded`.

          Revoke a mandate and get wallet revocation options return this when

          `approvedAt` was never set, so no spending allowance exists. That is separate

          from `mandate_revoked`, which applies only after `revokedAt` is set.


          **Steps to resolve:**

          1. Read `errorMessage` for the status this operation requires

          2. Move the mandate to that status, or create a new mandate'
    MandatePolicyPeriodCap:
      type: object
      title: Mandate Policy Period Cap
      description: One rolling cap over `period` (a trailing window, not a calendar period). Send both `amount` and `period`, or omit the object. The stored amount is capped at the Coinbase ceiling for that period. Enforced atomically at authorization so concurrent charges cannot exceed the cap.
      properties:
        amount:
          type: string
          description: Max total authorizable in the rolling `period`. Capped at the Coinbase ceiling for `period`.
          example: '500.00'
        period:
          $ref: '#/components/schemas/MandatePolicyPeriod'
      required:
      - amount
      - period
      example:
        amount: '500.00'
        period: month
    MandateId:
      type: string
      pattern: ^mandate_[a-f0-9\-]{36}$
      description: The ID of the mandate, a UUID prefixed by `mandate_`.
      example: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
    AcceptanceMandateApprovalInitiatedEvent:
      x-event-type: acceptance.mandate.approval_initiated
      description: The `acceptance.mandate.approval_initiated` event. `data` carries the full `mandate` and the `approval`.
      example:
        eventId: 323e4567-e89b-12d3-a456-426614174002
        timestamp: '2025-06-15T12:04:00Z'
        eventType: acceptance.mandate.approval_initiated
        data:
          mandate:
            mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            asset: usdc
            policy:
              maxPerAuthorization: '50.00'
              maxPerPeriod:
                amount: '500.00'
                period: month
            status: approval_pending
            expiresAt: '2027-06-15T12:00:00.000Z'
            url: https://payments.coinbase.com/mandates/mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
            createdAt: '2025-06-15T12:00:00.000Z'
            updatedAt: '2025-06-15T12:04:00.000Z'
          approval:
            approvalId: approval_5f0e9d8c-7b6a-4321-fedc-ba0987654321
            status: pending
            source:
              address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
              network: base
              asset: usdc
            createdAt: '2025-06-15T12:04:00.000Z'
            updatedAt: '2025-06-15T12:04:00.000Z'
      allOf:
      - $ref: '#/components/schemas/MandateEventBase'
      - type: object
        properties:
          eventType:
            type: string
            description: The type of webhook event.
            enum:
            - acceptance.mandate.approval_initiated
            example: acceptance.mandate.approval_initiated
        required:
        - eventType
    PaymentSourceNetwork:
      type: string
      description: The blockchain network supported for payment session sources. Testnet networks are only available in sandbox environments.
      enum:
      - arbitrum
      - arbitrum-sepolia
      - avalanche
      - base
      - base-sepolia
      - ethereum
      - ethereum-sepolia
      - optimism
      - optimism-sepolia
      - polygon
      - polygon-amoy
      - solana
      - solana-devnet
      example: base
    ApprovalPayload:
      description: "A single payload the customer signs to approve a mandate on a wallet source. Mandates support allowance-style credentials only, since a mandate must be reusable for later debits when the customer is not present. Inspect `type` to determine how to handle `data`:\n\n- `eip2612`: pass `data` to `eth_signTypedData_v4`, return the signature.\n\n- `permit2`: a Permit2 `PermitSingle` (AllowanceTransfer) granting a\n  reusable allowance; pass `data` to `eth_signTypedData_v4`, return the\n  signature. Preceded by a one-time `erc20_approval` of the Permit2 contract\n  when the wallet has not yet approved Permit2 for this asset.\n\n\n- `erc20_approval`: send `data` via `eth_sendTransaction`, return the transaction hash.\n- `solana_subscription`: decode `data.transaction` from base64 and pass the\n  bytes to the Solana Wallet Standard `signTransaction` method (never\n  `signAndSendTransaction`). From the signed transaction, extract the\n  64-byte ed25519 signature for the payer that signed, base58-encode it,\n  and return that string as `OnchainSignedPayload.signature`. Do not\n  submit the signed transaction bytes."
      oneOf:
      - $ref: '#/components/schemas/EIP2612Payload'
      - $ref: '#/components/schemas/Permit2AllowancePayload'
      - $ref: '#/components/schemas/Erc20ApprovalPayload'
      - $ref: '#/components/schemas/SolanaSubscriptionPayload'
      discriminator:
        propertyName: type
        mapping:
          eip2612: '#/components/schemas/EIP2612Payload'
          permit2: '#/components/schemas/Permit2AllowancePayload'
          erc20_approval: '#/components/schemas/Erc20ApprovalPayload'
          solana_subscription: '#/components/schemas/SolanaSubscriptionPayload'
    Asset:
      type: string
      minLength: 1
      maxLength: 42
      description: The symbol of the asset (e.g., eth, usd, usdc, usdt).
      example: usd
    MandateSourceWallet:
      title: Mandate Source Wallet
      description: A blockchain wallet the mandate draws funds from. Extends the shared payment source wallet, requiring `network` and `asset` alongside `address` (the `asset` is what debits against the mandate are drawn in).
      allOf:
      - $ref: '#/components/schemas/PaymentSourceWallet'
      - required:
        - address
        - network
        - asset
      example:
        address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
        network: base
        asset: usdc
    Metadata:
      type: object
      description: Optional metadata as key-value pairs. Use this to store additional structured information on a resource, such as customer IDs, order references, or any application-specific data. Up to 10 key/value pairs may be provided. Keys and values are both strings. Keys must be ≤ 40 characters; values must be ≤ 500 characters.
      additionalProperties:
        type: string
        minLength: 0
        maxLength: 500
      maxProperties: 10
      example:
        customer_id: cust_12345
        order_reference: order-67890
    EIP2612Payload:
      type: object
      title: EIP-2612 Payload
      description: An EIP-2612 Permit typed-data payload. The payer must pass `data` to `eth_signTypedData_v4` and return the resulting signature. Used to set up a mandate's reusable credential; the permit stands in for a live per-authorization signature on later authorizations.
      properties:
        payloadId:
          type: string
          description: The unique identifier of the payload.
          example: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
        type:
          type: string
          description: The payload type.
          enum:
          - eip2612
          example: eip2612
        data:
          allOf:
          - $ref: '#/components/schemas/EIP712Message'
          description: EIP-712 typed data for an EIP-2612 Permit. Pass to `eth_signTypedData_v4`.
          example:
            types:
              EIP712Domain:
              - name: name
                type: string
              - name: version
                type: string
              - name: chainId
                type: uint256
              - name: verifyingContract
                type: address
              Permit:
              - name: owner
                type: address
              - name: spender
                type: address
              - name: value
                type: uint256
              - name: nonce
                type: uint256
              - name: deadline
                type: uint256
            primaryType: Permit
            domain:
              name: USD Coin
              version: '2'
              chainId: 8453
              verifyingContract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            message:
              owner: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
              spender: '0x9Fb909eA400c2b8D99Be292DADf07e63B814527c'
              value: '115792089237316195423570985008687907853269984665640564039457584007913129639935'
              nonce: '0'
              deadline: '1798761600'
      required:
      - payloadId
      - type
      - data
      example:
        payloadId: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
        type: eip2612
        data:
          types:
            EIP712Domain:
            - name: name
              type: string
            - name: version
              type: string
            - name: chainId
              type: uint256
            - name: verifyingContract
              type: address
            Permit:
            - name: owner
              type: address
            - name: spender
              type: address
            - name: value
              type: uint256
            - name: nonce
              type: uint256
            - name: deadline
              type: uint256
          primaryType: Permit
          domain:
            name: USD Coin
            version: '2'
            chainId: 8453
            verifyingContract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          message:
            owner: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
            spender: '0x9Fb909eA400c2b8D99Be292DADf07e63B814527c'
            value: '115792089237316195423570985008687907853269984665640564039457584007913129639935'
            nonce: '0'
            deadline: '1798761600'
    PaymentSourceWallet:
      type: object
      title: Payment Source Wallet
      description: A blockchain wallet address used as a payment source.
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          description: The blockchain address of the payer.
          example: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
        network:
          allOf:
          - $ref: '#/components/schemas/PaymentSourceNetwork'
          description: The blockchain network for the payment.
          example: base
        asset:
          allOf:
          - $ref: '#/components/schemas/Asset'
          description: The asset used for the payment.
          example: usdc
      required:
      - address
      example:
        address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
        network: base
        asset: usdc
    WalletMandateRevocationOption:
      type: object
      title: Wallet Mandate Revocation Option
      description: 'One way the customer can remove the mandate''s spending allowance on-chain: a source and the payloads to sign for it.'
      properties:
        optionId:
          type: string
          description: The unique identifier of the wallet mandate revocation option.
          example: opt_b2c3d4e5-f6a7-8901-bcde-f23456789012
        source:
          allOf:
          - $ref: '#/components/schemas/MandateSourceWallet'
          description: The funding source whose spending allowance this option removes.
          example:
            address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
            network: base
            asset: usdc
        payloads:
          type: array
          description: The payloads the customer must sign to remove the spending allowance.
          items:
            $ref: '#/components/schemas/RevocationPayload'
          example:
          - payloadId: payload_bf3048c1-0957-5gf8-cgf0-ddd33e046225
            type: eip2612
            data:
              types:
                EIP712Domain:
                - name: name
                  type: string
                - name: version
                  type: string
                - name: chainId
                  type: uint256
                - name: verifyingContract
                  type: address
                Permit:
                - name: owner
                  type: address
