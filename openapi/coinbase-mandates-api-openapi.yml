      allOf:
      - $ref: '#/components/schemas/MandateEventBase'
      - type: object
        properties:
          eventType:
            type: string
            description: The type of webhook event.
            enum:
            - acceptance.mandate.revocation_initiated
            example: acceptance.mandate.revocation_initiated
        required:
        - eventType
    Revocation:
      type: object
      description: 'A record of a wallet revocation: the customer removing the mandate''s spending allowance on-chain (see `onchainTransactions`). While it is confirming, the mandate''s `status` is `revocation_pending`; on success it becomes `revocation_succeeded` and the mandate''s `revokedAt` is set, and on failure it becomes `revocation_failed`. This applies regardless of whether the mandate was previously canceled: a revocation on an already-canceled mandate still moves `status` through the `revocation_*` values and sets `revokedAt`.


        To check whether the spending allowance is still active, read the mandate: `revokedAt` is set once the allowance has been removed.'
      properties:
        revocationId:
          allOf:
          - $ref: '#/components/schemas/RevocationId'
          description: The unique identifier of the revocation.
          example: revocation_9d2e7c14-3b8a-4f21-9c66-2a1e5d7b8f03
        mandateId:
          allOf:
          - $ref: '#/components/schemas/MandateId'
          description: The unique identifier of the mandate this revocation applies to.
          example: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        status:
          allOf:
          - $ref: '#/components/schemas/RevocationStatus'
          description: The current status of the revocation attempt.
          example: succeeded
        onchainTransactions:
          type: array
          description: Network transactions that remove the spending allowance on-chain. Empty until the revocation has been submitted to the network.
          items:
            $ref: '#/components/schemas/OnchainTransaction'
          example:
          - transactionHash: '0xdef456789012345678901234567890abcdef1234567890abcdef1234567890ab'
            network: base
        error:
          allOf:
          - $ref: '#/components/schemas/PaymentError'
          description: Details of why the revocation failed. Only present when `status` is `failed`.
          example:
            code: transaction_reverted
            message: The revocation transaction reverted on-chain.
            occurredAt: '2026-08-21T14:12:00.000Z'
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the revocation was created.
          example: '2026-08-21T14:10:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: The UTC ISO 8601 timestamp at which the revocation was last updated.
          example: '2026-08-21T14:12:00.000Z'
      required:
      - revocationId
      - mandateId
      - status
      - createdAt
      - updatedAt
      example:
        revocationId: revocation_9d2e7c14-3b8a-4f21-9c66-2a1e5d7b8f03
        mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
        status: succeeded
        onchainTransactions:
        - transactionHash: '0xdef456789012345678901234567890abcdef1234567890abcdef1234567890ab'
          network: base
        createdAt: '2026-08-21T14:10:00.000Z'
        updatedAt: '2026-08-21T14:12:00.000Z'
    Error:
      description: An error response including the code for the type of error and a human-readable message describing the error.
      type: object
      properties:
        errorType:
          $ref: '#/components/schemas/ErrorType'
        errorMessage:
          description: The error message.
          type: string
          example: Unable to create EVM account
        correlationId:
          description: A unique identifier for the request that generated the error. This can be used to help debug issues with the API.
          type: string
          example: 41deb8d59a9dc9a7-IAD
        errorLink:
          allOf:
          - $ref: '#/components/schemas/Url'
          description: A link to the corresponding error documentation.
          example: https://docs.cdp.coinbase.com/api-reference/v2/errors#invalid-request
        unauthorizedCapabilities:
          description: 'The capability code(s) that were not authorized for the customer on

            this request. Present only when `errorType` is

            `customer_not_authorized`; absent for every other error type.


            Use this list to render onboarding UX for the listed capabilities, or

            fetch `GET /v2/customers/{customerId}` and inspect each entry''s

            `status` / `requirements` to discover what (if anything) can be

            submitted to resolve the block.

            '
          type: array
          items:
            $ref: '#/components/schemas/CapabilityName'
      required:
      - errorType
      - errorMessage
      example:
        errorType: invalid_request
        errorMessage: Invalid request.
        correlationId: 41deb8d59a9dc9a7-IAD
        errorLink: https://docs.cdp.coinbase.com/api-reference/v2/errors#invalid-request
    AcceptanceMandateRevocationSucceededEvent:
      x-event-type: acceptance.mandate.revocation_succeeded
      description: The `acceptance.mandate.revocation_succeeded` event. `data` carries the full `mandate` and the `revocation`. The spending allowance has been removed on-chain, `mandate.revokedAt` is set, and `mandate.status` becomes `revocation_succeeded`. This is terminal. It applies regardless of whether the mandate was previously canceled (`canceledAt` remains set).
