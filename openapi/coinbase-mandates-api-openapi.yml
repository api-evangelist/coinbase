openapi: 3.2.0
info:
  title: Coinbase Developer Platform Mandates API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Mandates
  x-audience: public
  x-slo-tier:
    tier: beta
  description: 'A mandate is a durable, revocable standing authorization to debit a funding `source`. It lets a merchant debit the same source repeatedly without the customer present, which suits recurring payments and usage-based billing. A mandate does not move funds itself; a payment session authorizes against it via **Authorize a payment session with a mandate**, and capture, void, and refund then work as they do for any other session. For the full flow, spending limits, and integration options, see the Recurring Payments guide.


    Access to the Mandates APIs requires enablement by Coinbase.


    **Who does what.** Approving a mandate and revoking its on-chain spending allowance are customer-initiated: the customer signs the payload, so **Approve a mandate with a wallet** and **Revoke a mandate with a wallet** are unauthenticated. Creating, canceling, and reading mandates are merchant actions authenticated with your API key.


    **Canceling vs. revoking.** These are independent. **Cancel a mandate** is an off-chain merchant action and does not touch the on-chain allowance (`canceledAt` is set). **Revoke a mandate with a wallet** removes the on-chain allowance (`revokedAt` is set). A `canceled` mandate can still have a live allowance until the customer revokes it. `status` records only the most recent transition; the timestamps are the durable record.'
paths:
  /v2/mandates:
    post:
      summary: Create a mandate
      description: 'Creates a mandate denominated in `asset`. Optionally set `policy` to cap debits; if omitted, a Coinbase-configured monthly max applies. The response always includes the resolved `policy`.


        Returns the mandate in `created` status with no `source`; it is not yet usable. Next step: have the customer approve it with **Get wallet approval options** then **Approve a mandate with a wallet**, which attaches the `source` and moves the mandate to `approval_succeeded`.


        A mandate''s terms can''t be modified once created. To change them, cancel the mandate and create a new one.'
      operationId: createMandate
      x-audience: public
      tags:
      - Mandates
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMandateRequest'
            example:
              asset: usdc
              policy:
                maxPerAuthorization: '50.00'
                maxPerPeriod:
                  amount: '500.00'
                  period: month
              expiresAt: '2027-06-15T12:00:00.000Z'
              approvalRedirect:
                failureUrl: https://merchant.example.com/mandate/approval/failed
                successUrl: https://merchant.example.com/mandate/approval/success
              revocationRedirect:
                failureUrl: https://merchant.example.com/mandate/revocation/failed
                successUrl: https://merchant.example.com/mandate/revocation/success
              customerDisplay:
                merchantName: Acme Store
      responses:
        '200':
          description: Successfully created mandate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              example:
                mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                asset: usdc
                policy:
                  maxPerAuthorization: '50.00'
                  maxPerPeriod:
                    amount: '500.00'
                    period: month
                status: created
                expiresAt: '2027-06-15T12:00:00.000Z'
                url: https://payments.coinbase.com/mandates/mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                approvalRedirect:
                  failureUrl: https://merchant.example.com/mandate/approval/failed
                  successUrl: https://merchant.example.com/mandate/approval/success
                revocationRedirect:
                  failureUrl: https://merchant.example.com/mandate/revocation/failed
                  successUrl: https://merchant.example.com/mandate/revocation/success
                customerDisplay:
                  merchantName: Acme Store
                createdAt: '2025-06-15T12:00:00.000Z'
                updatedAt: '2025-06-15T12:00:00.000Z'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid mandate policy.
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      summary: List mandates
      description: Returns a paginated list of mandates that the API key has permission to access. Filter by `address` (the funding `source`), `network`, and `status`.
      operationId: listMandates
      x-audience: public
      tags:
      - Mandates
      security:
      - apiKeyAuth: []
      parameters:
      - name: address
        in: query
        required: false
        description: Filter mandates by the customer's wallet address.
        schema:
          $ref: '#/components/schemas/BlockchainAddress'
        example: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
      - name: network
        in: query
        required: false
        description: Filter mandates by the customer's wallet network. Only applies when `address` is also provided.
        schema:
          $ref: '#/components/schemas/PaymentSourceNetwork'
        example: base
      - name: status
        in: query
        required: false
        description: Filter mandates by their latest action, e.g. `approval_succeeded` for mandates whose most recent transition was a successful approval. Note that `status` tracks the latest action, not usability; usability is derived from the `approvedAt`, `canceledAt`, and `revokedAt` timestamps.
        schema:
          $ref: '#/components/schemas/MandateStatus'
        example: approval_succeeded
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Successfully listed mandates.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - mandates
                  properties:
                    mandates:
                      type: array
                      description: The list of mandates.
                      items:
                        $ref: '#/components/schemas/Mandate'
                - $ref: '#/components/schemas/ListResponse'
                example:
                  mandates:
                  - mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                    asset: usdc
                    source:
                      address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                      network: base
                      asset: usdc
                    policy:
                      maxPerAuthorization: '50.00'
                      maxPerPeriod:
                        amount: '500.00'
                        period: month
                    status: approval_succeeded
                    expiresAt: '2027-06-15T12:00:00.000Z'
                    revocationUrl: https://payments.coinbase.com/mandates/mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad/revoke
                    approvalRedirect:
                      failureUrl: https://merchant.example.com/mandate/approval/failed
                      successUrl: https://merchant.example.com/mandate/approval/success
                    revocationRedirect:
                      failureUrl: https://merchant.example.com/mandate/revocation/failed
                      successUrl: https://merchant.example.com/mandate/revocation/success
                    approvedAt: '2025-06-15T12:05:00.000Z'
                    createdAt: '2025-06-15T12:00:00.000Z'
                    updatedAt: '2025-06-15T12:05:00.000Z'
                  nextPageToken: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: Invalid query parameters.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}:
    get:
      summary: Get a mandate
      description: Retrieves a single mandate by its ID, including its current `status`, `policy`, and `source`.
      operationId: getMandate
      x-audience: public
      tags:
      - Mandates
      security:
      - apiKeyAuth: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate.
        schema:
          $ref: '#/components/schemas/MandateId'
      responses:
        '200':
          description: Successfully retrieved mandate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              example:
                mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                asset: usdc
                source:
                  address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                  network: base
                  asset: usdc
                policy:
                  maxPerAuthorization: '50.00'
                  maxPerPeriod:
                    amount: '500.00'
                    period: month
                status: approval_succeeded
                expiresAt: '2027-06-15T12:00:00.000Z'
                revocationUrl: https://payments.coinbase.com/mandates/mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad/revoke
                approvalRedirect:
                  failureUrl: https://merchant.example.com/mandate/approval/failed
                  successUrl: https://merchant.example.com/mandate/approval/success
                revocationRedirect:
                  failureUrl: https://merchant.example.com/mandate/revocation/failed
                  successUrl: https://merchant.example.com/mandate/revocation/success
                approvedAt: '2025-06-15T12:05:00.000Z'
                createdAt: '2025-06-15T12:00:00.000Z'
                updatedAt: '2025-06-15T12:05:00.000Z'
        '404':
          description: Mandate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Mandate with the given ID does not exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/cancel:
    post:
      summary: Cancel a mandate
      description: 'Ends the mandate off-chain. `status` becomes `canceled`, `canceledAt` is set, and new authorizations are blocked immediately; authorizations already in progress are not affected. Cancel can be called from any status except a fully revoked one (`revokedAt` set); canceling an already canceled mandate is a no-op that returns the mandate unchanged.


        Canceling does not touch the on-chain spending allowance, which may still be live afterward. The customer removes it separately with **Revoke a mandate with a wallet**; that later revocation sets `revokedAt` while `canceledAt` remains set.'
      operationId: cancelMandate
      x-audience: public
      tags:
      - Mandates
      security:
      - apiKeyAuth: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate to cancel.
        schema:
          $ref: '#/components/schemas/MandateId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelMandateRequest'
            example:
              reason: Customer canceled their subscription.
      responses:
        '200':
          description: Successfully canceled mandate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              example:
                mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                asset: usdc
                source:
                  address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                  network: base
                  asset: usdc
                policy:
                  maxPerAuthorization: '50.00'
                  maxPerPeriod:
                    amount: '500.00'
                    period: month
                status: canceled
                expiresAt: '2027-06-15T12:00:00.000Z'
                revocationUrl: https://payments.coinbase.com/mandates/mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad/revoke
                approvedAt: '2025-06-15T12:05:00.000Z'
                canceledAt: '2026-08-21T14:02:00.000Z'
                metadata:
                  customer_id: cust_12345
                createdAt: '2025-06-15T12:00:00.000Z'
                updatedAt: '2026-08-21T14:02:00.000Z'
        '404':
          description: Mandate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Mandate with the given ID does not exist.
        '422':
          description: The mandate is fully revoked, or the idempotency key conflicts with a previous request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_revoked:
                  value:
                    errorType: mandate_revoked
                    errorMessage: Mandate has been revoked and cannot be canceled.
                idempotency_error:
                  value:
                    errorType: idempotency_error
                    errorMessage: Idempotency key '8e03978e-40d5-43e8-bc93-6894a57f9324' was already used with a different request payload. Please try again with a new idempotency key.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/revocations:
    get:
      summary: List mandate revocations
      description: Returns all wallet revocations for the mandate, newest first. Each records an attempt to remove the spending allowance on-chain. A `succeeded` entry means the allowance has been removed.
      operationId: listMandateRevocations
      x-audience: public
      tags:
      - Mandates
      security:
      - apiKeyAuth: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate.
        schema:
          $ref: '#/components/schemas/MandateId'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Successfully listed mandate revocations.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - revocations
                  properties:
                    revocations:
                      type: array
                      description: The list of revocations for the mandate, most recent first.
                      items:
                        $ref: '#/components/schemas/Revocation'
                - $ref: '#/components/schemas/ListResponse'
                example:
                  revocations:
                  - revocationId: revocation_1a7f2b93-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                    mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                    status: succeeded
                    onchainTransactions:
                    - transactionHash: '0xdef456789012345678901234567890abcdef1234567890abcdef1234567890ab'
                      network: base
                    createdAt: '2026-08-21T14:10:00.000Z'
                    updatedAt: '2026-08-21T14:12:00.000Z'
                  nextPageToken: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
        '404':
          description: Mandate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Mandate with the given ID does not exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/revocations/{revocationId}:
    get:
      summary: Get a mandate revocation
      description: Retrieves a single revocation by ID.
      operationId: getMandateRevocation
      x-audience: public
      tags:
      - Mandates
      security:
      - apiKeyAuth: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate.
        schema:
          $ref: '#/components/schemas/MandateId'
      - name: revocationId
        in: path
        required: true
        description: The unique identifier of the revocation.
        schema:
          $ref: '#/components/schemas/RevocationId'
      responses:
        '200':
          description: Successfully retrieved mandate revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revocation'
              example:
                revocationId: revocation_1a7f2b93-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                status: succeeded
                onchainTransactions:
                - transactionHash: '0xdef456789012345678901234567890abcdef1234567890abcdef1234567890ab'
                  network: base
                createdAt: '2026-08-21T14:10:00.000Z'
                updatedAt: '2026-08-21T14:12:00.000Z'
        '404':
          description: Mandate or revocation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Revocation with the given ID does not exist for this mandate.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/revocations/wallet:
    post:
      summary: Revoke a mandate with a wallet
      description: '**Customer-initiated.** Removes the mandate''s spending allowance on-chain using the customer''s signed payloads from **Get wallet revocation options**. The customer signs the payloads themselves, so this call is unauthenticated. The mandate must have an active allowance and no approval or revocation in flight.


        Returns a `pending` revocation and moves the mandate to `revocation_pending`. When the network transaction confirms, `revokedAt` is set and `status` becomes `revocation_succeeded`; if it does not complete, `status` becomes `revocation_failed` and a new revocation can be submitted. Follow progress with **Get a mandate revocation** or the `acceptance.mandate.revocation_*` webhooks.


        A canceled mandate can still be revoked: the revocation sets `revokedAt` while `canceledAt` remains set.'
      operationId: revokeWalletMandate
      x-audience: public
      tags:
      - Mandates
      security:
      - unauthenticated: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate to revoke.
        schema:
          $ref: '#/components/schemas/MandateId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRevocationRequest'
            example:
              optionId: opt_b2c3d4e5-f6a7-8901-bcde-f23456789012
              signedPayloads:
              - payloadId: payload_bf3048c1-0957-5gf8-cgf0-ddd33e046225
                signature: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
              reason: Customer requested that the allowance be removed.
      responses:
        '200':
          description: Successfully created mandate wallet revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revocation'
              example:
                revocationId: revocation_1a7f2b93-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                mandateId: mandate_82c879c1-84e1-44ed-a8c2-1ac239cf09ad
                status: pending
                createdAt: '2026-08-21T14:10:00.000Z'
                updatedAt: '2026-08-21T14:10:00.000Z'
        '404':
          description: Mandate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Mandate with the given ID does not exist.
        '409':
          description: An approval or revocation is already in progress for this mandate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_action_pending:
                  value:
                    errorType: mandate_action_pending
                    errorMessage: Another action is already in progress for this mandate.
        '422':
          description: The mandate has no active spending allowance to remove, or the idempotency key conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_invalid_status:
                  value:
                    errorType: mandate_invalid_status
                    errorMessage: Mandate has no spending allowance to remove. An allowance exists only after approval succeeds.
                mandate_revoked:
                  value:
                    errorType: mandate_revoked
                    errorMessage: Mandate has been revoked and has no spending allowance to remove.
                idempotency_error:
                  value:
                    errorType: idempotency_error
                    errorMessage: Idempotency key '8e03978e-40d5-43e8-bc93-6894a57f9324' was already used with a different request payload. Please try again with a new idempotency key.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/revocations/wallet/options:
    get:
      summary: Get wallet revocation options
      description: 'Returns the payloads the customer must sign to remove the mandate''s spending allowance on-chain. The mandate must have an active allowance (approval succeeded, not yet revoked) and no approval or revocation in flight. A canceled mandate can still be revoked while its allowance is live.


        Present the payloads to the customer to sign, then call **Revoke a mandate with a wallet** with the signed payloads.


        This is a stateless read operation and does not modify the mandate. The payloads embed fresh signing data on each call, so sign and submit the payloads from a single response rather than caching them.'
      operationId: getWalletRevocationOptions
      x-audience: public
      tags:
      - Mandates
      security:
      - unauthenticated: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate.
        schema:
          $ref: '#/components/schemas/MandateId'
      responses:
        '200':
          description: Successfully retrieved wallet revocation options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMandateRevocationOptionsResponse'
              examples:
                live_allowance:
                  summary: Spending allowance is active
                  value:
                    options:
                    - optionId: opt_b2c3d4e5-f6a7-8901-bcde-f23456789012
                      source:
                        address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                        network: base
                        asset: usdc
                      payloads:
                      - payloadId: payload_bf3048c1-0957-5gf8-cgf0-ddd33e046225
                        type: eip2612
                        data:
                          types:
                            EIP712Domain:
                            - name: name
                              type: string
                            - name: version
                              type: string
                            - name: chainId
                              type: uint256
                            - name: verifyingContract
                              type: address
                            Permit:
                            - name: owner
                              type: address
                            - name: spender
                              type: address
                            - name: value
                              type: uint256
                            - name: nonce
                              type: uint256
                            - name: deadline
                              type: uint256
                          primaryType: Permit
                          domain:
                            name: USD Coin
                            version: '2'
                            chainId: 8453
                            verifyingContract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                          message:
                            owner: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                            spender: '0x9Fb909eA400c2b8D99Be292DADf07e63B814527c'
                            value: '0'
                            nonce: '1'
                            deadline: '1798761600'
                solana:
                  summary: Solana spending allowance is active
                  description: The mandate has an active Solana subscription. Decode `data.transaction` and pass it to the Solana Wallet Standard `signTransaction` method. The transaction is `revokeDelegation`.
                  value:
                    options:
                    - optionId: opt_d4e5f6a7-b8c9-0123-def0-234567890abc
                      source:
                        address: 9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin
                        network: solana-devnet
                        asset: usdc
                      payloads:
                      - payloadId: payload_8d29f5b3-0e64-5c72-9a31-2b8f0d5e8c98
                        type: solana_subscription
                        data:
                          transaction: AQABAgIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQABAQECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8CBgMBAQAAAAIBAwQAAAAABgIAAAAAAAYDBQEBAAAGBAgAAAAABgUAAAAA6AMAAAAAAAAGBgUBAQEBBgcEAQAAAAYICgMBAQIDBgkCBgAAAAYKAwABAQEGCwMGAQEBBgwDAAABAQAAAAA=
        '404':
          description: Mandate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Mandate with the given ID does not exist.
        '409':
          description: An approval or revocation is already in progress for this mandate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_action_pending:
                  value:
                    errorType: mandate_action_pending
                    errorMessage: Another action is already in progress for this mandate.
        '422':
          description: The mandate never had a spending allowance, or the allowance was already revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_invalid_status:
                  value:
                    errorType: mandate_invalid_status
                    errorMessage: Mandate has no spending allowance to remove. An allowance exists only after approval succeeds.
                mandate_revoked:
                  value:
                    errorType: mandate_revoked
                    errorMessage: Mandate has been revoked and has no spending allowance to remove.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/approvals:
    get:
      summary: List mandate approvals
      description: 'Returns the approvals for a mandate, most recent first. Each approval is an attempt to attach a funding `source`; inspect them to see why a mandate is not yet `approval_succeeded`: a `pending` attempt is still in progress, a `failed` one carries an `error`.'
      operationId: listMandateApprovals
      x-audience: public
      tags:
      - Mandates
      security:
      - apiKeyAuth: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate.
        schema:
          $ref: '#/components/schemas/MandateId'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Successfully listed mandate approvals.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - approvals
                  properties:
                    approvals:
                      type: array
                      description: The list of approvals for the mandate, most recent first.
                      items:
                        $ref: '#/components/schemas/Approval'
                - $ref: '#/components/schemas/ListResponse'
                example:
                  approvals:
                  - approvalId: approval_5f0e9d8c-7b6a-4321-fedc-ba0987654321
                    status: succeeded
                    source:
                      address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                      network: base
                      asset: usdc
                    onchainTransactions:
                    - transactionHash: '0xabc123def456789012345678901234567890abcdef1234567890abcdef123456'
                      network: base
                    createdAt: '2025-06-15T12:04:00.000Z'
                    updatedAt: '2025-06-15T12:05:00.000Z'
                  nextPageToken: eyJsYXN0X2lkIjogImFiYzEyMyIsICJ0aW1lc3RhbXAiOiAxNzA3ODIzNzAxfQ==
        '404':
          description: Mandate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Mandate with the given ID does not exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/approvals/{approvalId}:
    get:
      summary: Get a mandate approval
      description: Retrieves a single approval by its ID, including its current `status`, its `onchainTransactions` once submitted, and, when it failed, its `error`. Poll this after **Approve a mandate with a wallet** to follow a `pending` approval to `succeeded` or `failed`, or consume the mandate webhooks instead.
      operationId: getMandateApproval
      x-audience: public
      tags:
      - Mandates
      security:
      - apiKeyAuth: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate.
        schema:
          $ref: '#/components/schemas/MandateId'
      - name: approvalId
        in: path
        required: true
        description: The unique identifier of the approval.
        schema:
          $ref: '#/components/schemas/ApprovalId'
      responses:
        '200':
          description: Successfully retrieved mandate approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              example:
                approvalId: approval_5f0e9d8c-7b6a-4321-fedc-ba0987654321
                status: succeeded
                source:
                  address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                  network: base
                  asset: usdc
                onchainTransactions:
                - transactionHash: '0xabc123def456789012345678901234567890abcdef1234567890abcdef123456'
                  network: base
                createdAt: '2025-06-15T12:04:00.000Z'
                updatedAt: '2025-06-15T12:05:00.000Z'
        '404':
          description: Mandate or approval not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Approval with the given ID does not exist for this mandate.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/approvals/wallet:
    post:
      summary: Approve a mandate with a wallet
      description: '**Customer-initiated.** Approves a mandate on a wallet source using the customer''s signed payloads from **Get wallet approval options**. The customer signs the payloads themselves, so this call is unauthenticated. The mandate must be in `created` or `approval_failed` status, not expired, and have no approval or revocation in flight.


        Returns a `pending` approval and moves the mandate to `approval_pending`. On success the mandate''s `source` is set and `status` becomes `approval_succeeded`; it can then be used by **Authorize a payment session with a mandate**. On failure `status` becomes `approval_failed` and a new approval can be submitted. Follow progress with **Get a mandate approval** or the `acceptance.mandate.approval_*` webhooks.'
      operationId: approveWalletMandate
      x-audience: public
      tags:
      - Mandates
      security:
      - unauthenticated: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate to approve.
        schema:
          $ref: '#/components/schemas/MandateId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletApprovalRequest'
            example:
              optionId: opt_a1b2c3d4-e5f6-7890-abcd-ef1234567890
              signedPayloads:
              - payloadId: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
                signature: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
      responses:
        '200':
          description: Successfully created mandate wallet approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              example:
                approvalId: approval_5f0e9d8c-7b6a-4321-fedc-ba0987654321
                status: pending
                source:
                  address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                  network: base
                  asset: usdc
                createdAt: '2025-06-15T12:04:00.000Z'
                updatedAt: '2025-06-15T12:04:00.000Z'
        '400':
          description: The mandate is past its expiresAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_expired:
                  value:
                    errorType: mandate_expired
                    errorMessage: Mandate has expired and cannot be approved.
        '404':
          description: Mandate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Mandate with the given ID does not exist.
        '409':
          description: An approval or revocation is already in progress for this mandate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_action_pending:
                  value:
                    errorType: mandate_action_pending
                    errorMessage: Another action is already in progress for this mandate.
        '422':
          description: The mandate is revoked, canceled, or not in a status that accepts approval, or the idempotency key conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_revoked:
                  value:
                    errorType: mandate_revoked
                    errorMessage: Mandate has been revoked and cannot be approved.
                mandate_canceled:
                  value:
                    errorType: mandate_canceled
                    errorMessage: Mandate has been canceled and cannot be approved.
                mandate_invalid_status:
                  value:
                    errorType: mandate_invalid_status
                    errorMessage: Mandate can only be approved from `created` or `approval_failed`.
                idempotency_error:
                  value:
                    errorType: idempotency_error
                    errorMessage: Idempotency key '8e03978e-40d5-43e8-bc93-6894a57f9324' was already used with a different request payload. Please try again with a new idempotency key.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/mandates/{mandateId}/approvals/wallet/options:
    get:
      summary: Get wallet approval options
      description: 'Returns the available wallet approval options for a mandate. The mandate must be in `created` or `approval_failed` status, not expired, and have no approval or revocation in flight.


        Provide one or more customer wallet addresses as query parameters. Each option specifies the network, asset, and payloads the customer must sign to approve the mandate. Present the options to the customer and let them choose one, then call **Approve a mandate with a wallet** with the selected option and its signed payloads.


        This is a stateless read operation and does not modify the mandate. The payloads embed fresh on-chain signing data such as a `nonce` and `deadline`, so sign and submit the payloads from a single response rather than caching them.


        If a requested address has no eligible approval options, it appears in `ineligibleAddresses` with a `code` and `message` instead of being absent from `options`.'
      operationId: getWalletApprovalOptions
      x-audience: public
      tags:
      - Mandates
      security:
      - unauthenticated: []
      parameters:
      - name: mandateId
        in: path
        required: true
        description: The unique identifier of the mandate.
        schema:
          $ref: '#/components/schemas/MandateId'
      - name: addresses
        in: query
        required: true
        description: The customer's wallet addresses to generate approval options for. Provide between 1 and 5 unique addresses, comma-separated (e.g. `?addresses=0xA,0xB`). Each returned option's `source.address` identifies which requested address it applies to. If a requested address has no eligible approval options, it appears in `ineligibleAddresses` with a `code` explaining why.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BlockchainAddress'
          minItems: 1
          maxItems: 5
          uniqueItems: true
        style: form
        explode: false
        example:
        - '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
        - '0xDeF9876543210FeDcBa9876543210FedcBa987654'
      - name: network
        in: query
        required: false
        description: Optional filter to restrict options to a specific blockchain network.
        schema:
          $ref: '#/components/schemas/PaymentSourceNetwork'
        example: base
      - name: asset
        in: query
        required: false
        description: Filter options by asset. Currently, only `usdc` and `usdt` return results.
        schema:
          $ref: '#/components/schemas/Asset'
        examples:
          usdc:
            summary: Filter options for USDC.
            value: usdc
          usdt:
            summary: Filter options for USDT.
            value: usdt
      responses:
        '200':
          description: Successfully retrieved mandate wallet approval options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMandateApprovalOptionsResponse'
              examples:
                success:
                  summary: An eligible wallet approval option is available
                  description: The requested address can back the mandate on at least one (network, asset) combination, so an option appears in `options`. `ineligibleAddresses` is empty.
                  value:
                    options:
                    - optionId: opt_a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      source:
                        address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                        network: base
                        asset: usdc
                      payloads:
                      - payloadId: payload_af2937b0-9846-4fe7-bfe9-ccc22d935114
                        type: eip2612
                        data:
                          types:
                            EIP712Domain:
                            - name: name
                              type: string
                            - name: version
                              type: string
                            - name: chainId
                              type: uint256
                            - name: verifyingContract
                              type: address
                            Permit:
                            - name: owner
                              type: address
                            - name: spender
                              type: address
                            - name: value
                              type: uint256
                            - name: nonce
                              type: uint256
                            - name: deadline
                              type: uint256
                          primaryType: Permit
                          domain:
                            name: USD Coin
                            version: '2'
                            chainId: 8453
                            verifyingContract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                          message:
                            owner: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                            spender: '0x9Fb909eA400c2b8D99Be292DADf07e63B814527c'
                            value: '115792089237316195423570985008687907853269984665640564039457584007913129639935'
                            nonce: '0'
                            deadline: '1798761600'
                    ineligibleAddresses: []
                solana:
                  summary: An eligible Solana wallet approval option is available
                  description: The requested Solana address can back the mandate, so an option appears in `options` with a `solana_subscription` payload. Decode `data.transaction` and pass it to the Solana Wallet Standard `signTransaction` method.
                  value:
                    options:
                    - optionId: opt_c3d4e5f6-a7b8-9012-cdef-1234567890ab
                      source:
                        address: 9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin
                        network: solana-devnet
                        asset: usdc
                      payloads:
                      - payloadId: payload_7c18e4a2-9d53-4b61-8f20-1a6e9c0d4b87
                        type: solana_subscription
                        data:
                          transaction: AQABAgIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQABAQECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8CBgMBAQAAAAIBAwQAAAAABgIAAAAAAAYDBQEBAAAGBAgAAAAABgUAAAAA6AMAAAAAAAAGBgUBAQEBBgcEAQAAAAYICgMBAQIDBgkCBgAAAAYKAwABAQEGCwMGAQEBBgwDAAABAQAAAAA=
                    ineligibleAddresses: []
                none_eligible:
                  summary: No eligible wallet approval option
                  description: The requested address does not hold enough of a supported asset on a supported network to back the mandate. `options` is empty and the address appears in `ineligibleAddresses` with a `code` explaining why. The response is still `200`; the request itself was valid, the result is just an empty set of usable options.
                  value:
                    options: []
                    ineligibleAddresses:
                    - address: '0xAbC1234567890aBcDeF1234567890AbCdEf123456'
                      code: insufficient_funds
                      message: The customer does not have sufficient funds.
                      fundsRequired:
                      - asset: usdc
                        network: base
                        currentBalance: '0.40'
                        requiredBalance: '1.00'
                      - asset: usdc
                        network: ethereum
                        currentBalance: '0.00'
                        requiredBalance: '1.00'
        '400':
          description: Invalid request, or the mandate is past its expiresAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_addresses:
                  value:
                    errorType: invalid_request
                    errorMessage: At least one wallet address is required.
                too_many_addresses:
                  value:
                    errorType: invalid_request
                    errorMessage: A maximum of 5 wallet addresses are allowed.
                duplicate_addresses:
                  value:
                    errorType: invalid_request
                    errorMessage: Duplicate wallet addresses are not allowed.
                mandate_expired:
                  value:
                    errorType: mandate_expired
                    errorMessage: Mandate has expired and cannot be approved.
        '404':
          description: Mandate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: Mandate with the given ID does not exist.
        '409':
          description: An approval or revocation is already in progress for this mandate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_action_pending:
                  value:
                    errorType: mandate_action_pending
                    errorMessage: Another action is already in progress for this mandate.
        '422':
          description: The mandate is revoked, canceled, or not in a status that can be approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mandate_revoked:
                  value:
                    errorType: mandate_revoked
                    errorMessage: Mandate has been revoked and cannot be approved.
                mandate_canceled:
                  value:
                    errorType: mandate_canceled
                    errorMessage: Mandate has been canceled and cannot be approved.
                mandate_invalid_status:
                  value:
                    errorType: mandate_invalid_status
                    errorMessage: Mandate can only be approved from `created` or `approval_failed`.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
webhooks:
  acceptanceMandateCreated:
    post:
      summary: Mandate created
      description: Triggered when a mandate is created and enters `created` status. It is not yet usable; the customer must complete approval before it can be debited.
      operationId: acceptanceMandateCreatedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Mandates
      requestBody:
        description: The `acceptance.mandate.created` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceMandateCreatedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  acceptanceMandateCanceled:
    post:
      summary: Mandate canceled
      description: Triggered when the merchant cancels a mandate. The mandate's `status` becomes `canceled` and `canceledAt` is set. The on-chain spending allowance is unaffected; it is removed only when a wallet revocation sets `mandate.revokedAt`.
      operationId: acceptanceMandateCanceledWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Mandates
      requestBody:
        description: The `acceptance.mandate.canceled` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceMandateCanceledEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  acceptanceMandateApprovalInitiated:
    post:
      summary: Mandate approval initiated
      description: Triggered when a customer submits a mandate approval. The mandate's `status` is `approval_pending` and it is not yet usable. No action is required while the approval is processing; wait for the `approval_succeeded` or `approval_failed` event.
      operationId: acceptanceMandateApprovalInitiatedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Mandates
      requestBody:
        description: The `acceptance.mandate.approval_initiated` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceMandateApprovalInitiatedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  acceptanceMandateApprovalSucceeded:
    post:
      summary: Mandate approval succeeded
      description: Triggered when a mandate approval succeeds. The mandate's `status` becomes `approval_succeeded`, its `source` is set, and it is now usable.
      operationId: acceptanceMandateApprovalSucceededWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Mandates
      requestBody:
        description: The `acceptance.mandate.approval_succeeded` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceMandateApprovalSucceededEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  acceptanceMandateApprovalFailed:
    post:
      summary: Mandate approval failed
      description: Triggered when a mandate approval fails. The mandate's `status` becomes `approval_failed` and it is not usable. Inspect `data.approval.error` and retry by submitting a new approval.
      operationId: acceptanceMandateApprovalFailedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Mandates
      requestBody:
        description: The `acceptance.mandate.approval_failed` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceMandateApprovalFailedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  acceptanceMandateRevocationInitiated:
    post:
      summary: Mandate revocation initiated
      description: Triggered when a wallet revocation is submitted. `mandate.status` becomes `revocation_pending`. This happens regardless of whether the mandate was previously canceled. New authorizations are blocked while in `revocation_pending`. Wait for `revocation_succeeded` or `revocation_failed` before acting.
      operationId: acceptanceMandateRevocationInitiatedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Mandates
      requestBody:
        description: The `acceptance.mandate.revocation_initiated` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceMandateRevocationInitiatedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  acceptanceMandateRevocationSucceeded:
    post:
      summary: Mandate revocation succeeded
      description: 'Triggered when a wallet revocation completes. The spending allowance has been removed on-chain, `mandate.revokedAt` is set, and `mandate.status` becomes `revocation_succeeded`. This is terminal: the allowance is gone and the mandate can no longer be authorized against. It applies regardless of whether the mandate was previously canceled (`canceledAt` remains set).'
      operationId: acceptanceMandateRevocationSucceededWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Mandates
      requestBody:
        description: The `acceptance.mandate.revocation_succeeded` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceMandateRevocationSucceededEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  acceptanceMandateRevocationFailed:
    post:
      summary: Mandate revocation failed
      description: Triggered when a wallet revocation fails. `mandate.status` becomes `revocation_failed`. The spending allowance was not removed, so the mandate remains usable if it was usable before the attempt (`revokedAt` stays unset). Inspect `revocation.error` for the reason, then retry with a new wallet revocation.
      operationId: acceptanceMandateRevocationFailedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Mandates
      requestBody:
        description: The `acceptance.mandate.revocation_failed` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceMandateRevocationFailedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
components:
  schemas:
    ErrorType:
      description: The code that indicates the type of error that occurred. These error codes can be used to determine how to handle the error.
      type: string
      example: invalid_request
