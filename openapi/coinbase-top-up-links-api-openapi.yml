servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: Top-Up Links
  x-audience: public
  x-slo-tier:
    tier: beta
  description: 'A Top-Up Link is a shareable hosted URL that lets a payer add funds to their balance. Create a link with **Create a Top-Up Link** and share the returned `topUpUrl` only with the intended payer. The URL identifies the link but does not authorize a top-up; the payer must authenticate and approve it.


    ## Lifecycle


    The resource is immutable once created. The link expires 24 hours after creation and funds a single purchase: once a purchase succeeds, the link is spent and cannot be used again. A purchase that fails does not consume the link, so the payer can retry until it expires. A link is not bound to a specific payer. There is no GET: the create response and the `acceptance.top_up_link.created` event are the full resource.


    ## Amounts


    - `topUpAmount` is the merchant''s fixed suggested net amount for the

    link''s single purchase. The payer can change it in the hosted flow.

    - `orderTotalAmount` is optional presentation context. It does not

    replace, change, or cap `topUpAmount`.

    - The funds-added event reports the actual net amount credited by the

    purchase that spent the link. It is never cumulative.


    ## Merchant name


    Supply `customerDisplay.merchantName` to choose the merchant name for a link''s hosted page. The supplied value is limited to 128 Unicode code points before surrounding whitespace is removed. If the name is omitted or empty after trimming, the entity''s profile name is used. The create response and creation webhook return the resolved name stored on the immutable link. Later profile changes do not change that name.


    ## Redirects


    When `redirectUrl` is supplied, its origin must exactly match an allowed origin. The query key `toppedUpAmount` is reserved because the hosted flow appends it before redirecting the payer. The redirect does not represent success or failure; `toppedUpAmount` may be zero, a partial amount, or the full `topUpAmount`.


    ## Webhooks


    Subscribers receive `acceptance.top_up_link.created` when the link is created and `acceptance.top_up_link.funds_added` when a purchase credits funds through the link. Because a link funds a single purchase, it produces at most one funds-added event; deliveries can repeat, so deduplicate on `eventId`.'
paths:
  /v2/top-up-links:
    post:
      summary: Create a Top-Up Link
      description: 'Creates a Top-Up Link: a shareable hosted URL that lets a payer add funds to their balance. The resource is immutable once created. The link expires 24 hours after creation and funds a single purchase: once a purchase succeeds, the link is spent and cannot be used again. A purchase that fails does not consume the link, so the payer can retry until it expires. A link is not bound to a specific payer.


        Provide `topUpAmount` and `asset`; `orderTotalAmount`, `redirectUrl`, and `customerDisplay` are optional. When `redirectUrl` is supplied, its origin must exactly match one of the entity''s configured allowed origins, and the URL must not contain a percent-decoded query key exactly equal to `toppedUpAmount`. The response includes the hosted `topUpUrl` to share with the payer. Creating a link is signaled to webhook subscribers by the `acceptance.top_up_link.created` event, and the purchase that spends the link emits an `acceptance.top_up_link.funds_added` event.


        Supply `customerDisplay.merchantName` to override the merchant name on this link''s hosted page. The supplied value must not exceed 128 Unicode code points, including surrounding whitespace. Surrounding whitespace is removed before storage. An omitted or empty name after trimming uses the entity''s profile name. The create response and creation webhook always return the resolved name stored on the link.'
      operationId: createTopUpLink
      x-audience: public
      tags:
      - Top-Up Links
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopUpLinkRequest'
            examples:
              full:
                summary: Full request
                value:
                  topUpAmount: '100.00'
                  orderTotalAmount: '130.45'
                  asset: usdc
                  redirectUrl: https://www.example-merchant.com/checkout/return?orderId=701-3358192-4471016&sig=8a3f
                  customerDisplay:
                    merchantName: Example Merchant
              minimum:
                summary: Minimum request
                value:
                  topUpAmount: '100.00'
                  asset: usdc
      responses:
        '201':
          description: Successfully created Top-Up Link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpLink'
              example:
                topUpLinkId: topUpLink_6f2e9b41-c0f4-4bf8-a4b2-c105f9453a24
                topUpAmount: '100.00'
                asset: usdc
                orderTotalAmount: '130.45'
                redirectUrl: https://www.example-merchant.com/checkout/return?orderId=701-3358192-4471016&sig=8a3f
                customerDisplay:
                  merchantName: Example Merchant
                topUpUrl: https://pay.coinbase.com/top-up/topUpLink_6f2e9b41-c0f4-4bf8-a4b2-c105f9453a24
                expiresAt: '2026-09-12T20:00:00Z'
                createdAt: '2026-09-11T20:00:00Z'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_amount:
                  value:
                    errorType: invalid_request
                    errorMessage: The topUpAmount must be a positive amount with at most two fractional digits.
                invalid_asset:
                  value:
                    errorType: invalid_request
                    errorMessage: The asset must be usdc.
                invalid_merchant_name:
                  value:
                    errorType: invalid_request
                    errorMessage: customerDisplay.merchantName cannot exceed 128 characters
                invalid_redirect_url:
                  value:
                    errorType: invalid_request
                    errorMessage: The redirectUrl must be an absolute HTTPS URL.
                disallowed_redirect_origin:
                  value:
                    errorType: invalid_request
                    errorMessage: The redirectUrl origin does not exactly match any of the entity's allowed origins.
                reserved_redirect_parameter:
                  value:
                    errorType: invalid_request
                    errorMessage: The redirectUrl must not contain a query parameter whose percent-decoded key exactly matches toppedUpAmount (case-sensitive; duplicate occurrences are also rejected).
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden, or the entity is not configured for Top-Up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    errorType: forbidden
                    errorMessage: User forbidden from performing the action.
                entity_not_configured_for_top_up:
                  value:
                    errorType: entity_not_configured_for_top_up
                    errorMessage: Top-Up is disabled for this entity, or required Top-Up settings are missing or invalid. Contact support or your Coinbase representative.
        '409':
          $ref: '#/components/responses/AlreadyExistsError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/EndpointUnavailableError'
webhooks:
  acceptanceTopUpLinkCreated:
    post:
      summary: Top-Up Link created
      description: Triggered when the `acceptance.top_up_link.created` webhook event is emitted. Your API will receive a POST request at the webhook URL you configured. `data.topUpLink` carries the complete immutable Top-Up Link resource as created. The link expires 24 hours after creation, funds a single purchase, and is not bound to a specific payer. `data.topUpLink.customerDisplay.merchantName` contains the resolved name stored at creation, including the entity's profile-name fallback. `orderTotalAmount` and `redirectUrl` are omitted when they were not supplied at creation.
      operationId: acceptanceTopUpLinkCreatedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Top-Up Links
      requestBody:
        description: The `acceptance.top_up_link.created` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceTopUpLinkCreatedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
  acceptanceTopUpLinkFundsAdded:
    post:
      summary: Top-Up Link funds added
      description: Triggered when the `acceptance.top_up_link.funds_added` webhook event is emitted. Your API will receive a POST request at the webhook URL you configured. The event reports the purchase that spent the link. Because a link funds a single purchase, it produces at most one funds-added event; deliveries can repeat, so deduplicate on `eventId`. `toppedUpAmount` is the actual net amount credited by that purchase, denominated in `asset`; it is never cumulative and independent of the link's suggested amounts.
      operationId: acceptanceTopUpLinkFundsAddedWebhook
      security:
      - webhookSignature: []
      x-audience: public
      tags:
      - Top-Up Links
      requestBody:
        description: The `acceptance.top_up_link.funds_added` webhook event payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceTopUpLinkFundsAddedEvent'
      responses:
        '200':
          description: Webhook received and processed successfully.
        '401':
          description: Invalid signature.
