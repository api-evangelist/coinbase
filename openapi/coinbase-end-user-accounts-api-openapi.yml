  /v2/embedded-wallet-api/end-users/{userId}/evm/eip7702/delegation:
    post:
      x-audience: public
      summary: Create EIP-7702 delegation for end user EVM account
      description: 'Creates an EIP-7702 delegation for an end user''s EVM EOA account, upgrading it with smart account capabilities.


        This endpoint:

        - Retrieves delegation artifacts from onchain

        - Signs the EIP-7702 authorization for delegation

        - Assembles and submits a Type 4 transaction

        - Creates an associated smart account object


        The delegation allows the EVM EOA to be used as a smart account, which enables batched transactions and gas sponsorship via paymaster.'
      operationId: createEvmEip7702DelegationWithEndUserAccount
      tags:
      - End User Accounts
      security:
      - endUserAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XWalletAuthOptional'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: userId
        in: path
        required: true
        description: The ID of the end user.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,100}$
          example: e051beeb-7163-4527-a5b6-35e301529ff2
      - $ref: '#/components/parameters/XDeveloperAuth'
      - $ref: '#/components/parameters/ProjectIDOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: The 0x-prefixed address of the EVM account to delegate.
                  example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                  pattern: ^0x[0-9a-fA-F]{40}$
                network:
                  $ref: '#/components/schemas/EvmEip7702DelegationNetwork'
                enableSpendPermissions:
                  type: boolean
                  description: Whether to configure spend permissions for the upgraded, delegated account. When enabled, the account can grant permissions for third parties to spend on its behalf.
                  example: true
                walletSecretId:
                  description: Required when not using delegated signing. The ID of the Temporary Wallet Secret that was used to sign the X-Wallet-Auth Header.
                  type: string
                  pattern: ^[a-zA-Z0-9-]{1,100}$
                  example: e051beeb-7163-4527-a5b6-35e301529ff2
              required:
              - address
              - network
      responses:
        '201':
          description: Delegation operation created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegationOperationId:
                    type: string
                    format: uuid
                    description: The unique identifier for the delegation operation. Use this to poll the operation status.
                    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                required:
                - delegationOperationId
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_network:
                  value:
                    errorType: invalid_request
                    errorMessage: Field 'network' is required.
                    errorLink: https://docs.cdp.coinbase.com/api-reference/v2/errors#invalid-request
                unsupported_network:
                  value:
                    errorType: invalid_request
                    errorMessage: Network 'gnosis' is not supported for EIP-7702.
                    errorLink: https://docs.cdp.coinbase.com/api-reference/v2/errors#invalid-request
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/PaymentMethodRequiredError'
        '403':
          $ref: '#/components/responses/DelegationForbiddenError'
        '404':
          description: EVM account not found.
          content:
