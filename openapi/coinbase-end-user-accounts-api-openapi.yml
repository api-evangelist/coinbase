      - solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
      example: eip155:8453
    CloseBorrowPositionRequest:
      type: object
      description: 'A request to close an end user smart account''s borrow position for the specified borrow product.

        Closing fully repays the position''s outstanding loan and withdraws all remaining collateral back to the smart account, broadcasting a single user operation to settle the position onchain. There is no partial close; use `adjustBorrowPositionWithEndUserAccount` to adjust a position without closing it.'
      example:
        borrowProductId: bp_07fb56c0-9afe-5440-8ff2-5b0e115458df
        walletSecretId: e051beeb-7163-4527-a5b6-35e301529ff2
        useCdpPaymaster: false
        paymasterUrl: https://api.developer.coinbase.com/rpc/v1/base/AbCdEf123456
        paymasterContext:
          policyId: 962b252c-a726-4a37-8d86-333ce0a07299
      properties:
        borrowProductId:
          $ref: '#/components/schemas/BorrowProductId'
        walletSecretId:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,100}$
          description: The ID of the Temporary Wallet Secret that was used to sign the X-Wallet-Auth header.
          example: e051beeb-7163-4527-a5b6-35e301529ff2
        useCdpPaymaster:
          type: boolean
          description: Whether to use the CDP Paymaster for the user operation. When `true`, `paymasterUrl` must not be set.
          example: false
        paymasterUrl:
          allOf:
          - $ref: '#/components/schemas/Url'
          description: 'Paymaster URL to use for the user operation. Must not be set when `useCdpPaymaster` is `true`.

            If `useCdpPaymaster` is `false` and no `paymasterUrl` is set, the smart account must have sufficient funds to cover network fees.'
          example: https://api.developer.coinbase.com/rpc/v1/base/AbCdEf123456
        paymasterContext:
          allOf:
          - $ref: '#/components/schemas/PaymasterContext'
          description: 'Optional paymaster metadata forwarded to the configured paymaster service. Valid only when a paymaster is configured via `useCdpPaymaster: true` or a `paymasterUrl`.'
      required:
      - borrowProductId
      - walletSecretId
      - useCdpPaymaster
    x402V2PaymentPayload:
      type: object
      title: x402V2PaymentPayload
      description: The x402 v2 protocol payment payload. Uses CAIP-2 network identifiers. The `accepted` field carries the full payment requirements; `scheme` and `network` are not top-level fields (they are on the nested `accepted` object).
      properties:
        x402Version:
          allOf:
          - $ref: '#/components/schemas/X402Version'
          description: The x402 protocol version. Must be `2` for this payload shape.
        payload:
          type: object
          description: 'The payload of the payment depending on the x402Version, scheme, and network. Discriminated by scheme-specific fields: exact-EVM/upto-EVM payloads carry a `signature`; exact-Solana carries a `transaction`; batch-settlement carries a `type` discriminator. See `x402BatchSettlementEvmPayload` for the documented batch-settlement variants.'
          x-oneof-no-discriminator: Branches are third-party x402 protocol payload shapes (per scheme/network), not a Coinbase-controlled tag; clients select a branch by field presence as described above, matching the upstream x402 wire format.
          oneOf:
          - $ref: '#/components/schemas/x402ExactEvmPayload'
          - $ref: '#/components/schemas/x402ExactEvmPermit2Payload'
          - $ref: '#/components/schemas/x402ExactSolanaPayload'
          - $ref: '#/components/schemas/x402UptoEvmPermit2Payload'
          - $ref: '#/components/schemas/x402BatchSettlementEvmPayload'
          example:
            signature: '0xf3746613c2d920b5fdabc0856f2aeb2d4f88ee6037b8cc5d04a71a4462f134801234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1b'
            authorization:
              from: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
              to: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
              value: '1000000000000000000'
              validAfter: '1716150000'
              validBefore: '1716150000'
              nonce: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        accepted:
          $ref: '#/components/schemas/x402V2PaymentRequirements'
        resource:
          $ref: '#/components/schemas/x402ResourceInfo'
        extensions:
          type: object
          description: Optional protocol extensions.
          additionalProperties: true
          example:
            bazaar:
              info:
                input:
                  type: http
                  method: GET
              schema: {}
      example:
        x402Version: 2
        accepted:
          scheme: exact
          network: eip155:84532
          asset: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
          amount: '1000'
          payTo: '0x122F8Fcaf2152420445Aa424E1D8C0306935B5c9'
          maxTimeoutSeconds: 60
          extra:
            name: USDC
            version: '2'
        payload:
          signature: '0xf3746613c2d920b5fdabc0856f2aeb2d4f88ee6037b8cc5d04a71a4462f134801234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1b'
          authorization:
            from: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
            to: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
            value: '1000000000000000000'
            validAfter: '1716150000'
            validBefore: '1716150000'
            nonce: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        resource:
          url: https://api.example.com/premium/resource/123
          description: Premium API access for data analysis.
          mimeType: application/json
      required:
      - x402Version
      - accepted
      - payload
    MorphoBlueMarketParams:
      type: object
      description: Morpho Blue's immutable onchain market parameters that uniquely define a borrow product.
      example:
        onchainMarketId: '0x29ae7ac08be3a58e11151fed74701fb8e6ffd8e76b1870cf17ad70f332752d0b'
        loanToken:
          address: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          symbol: USDC
          decimals: 6
        collateralToken:
          address: '0xfcc9cc1209651ed8867332d6f664cf82743a2584'
          symbol: mGLO
          decimals: 18
        oracleAddress: '0x182e072f2c9c58c6f19f144c97986f7496c6a109'
        interestRateModelAddress: '0x46415998764c29ab2a25cbea6254146d50d22687'
        lltvBps: 9150
      properties:
        onchainMarketId:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: The Morpho Blue native bytes32 market ID that uniquely identifies  the underlying market onchain.
          example: '0x29ae7ac08be3a58e11151fed74701fb8e6ffd8e76b1870cf17ad70f332752d0b'
        loanToken:
          $ref: '#/components/schemas/BorrowProductToken'
          description: The token that is borrowed in the product.
        collateralToken:
          $ref: '#/components/schemas/BorrowProductToken'
          description: The token posted as collateral in the product.
        oracleAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The contract address of the oracle used to price the collateral token against the loan token.
          example: '0x182e072f2c9c58c6f19f144c97986f7496c6a109'
        interestRateModelAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: The contract address of the interest rate model that governs the product's borrow rate.
          example: '0x46415998764c29ab2a25cbea6254146d50d22687'
        lltvBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: The liquidation loan-to-value of the product, expressed in basis points. For example, `9150` represents an LLTV of 91.5%.
          example: 9150
      required:
      - onchainMarketId
      - loanToken
      - collateralToken
      - oracleAddress
      - interestRateModelAddress
      - lltvBps
