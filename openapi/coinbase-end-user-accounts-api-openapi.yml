  /v2/embedded-wallet-api/end-users/{userId}/solana/sign/x402-payment:
    post:
      x-audience: public
      summary: Sign x402 payment via end user Solana account
      description: 'Signs an x402 payment payload using the end user''s given Solana account.

        Accepts the full x402 payment required response body from a resource server plus an index into the accepts array selecting which payment option to sign. The paymentRequired envelope''s x402Version, resource, and extensions are carried through into the signed payment payload; only the selected accept entry becomes paymentPayload.accepted.

        Returns a signed payment payload that can be base64-encoded and sent in the PAYMENT-SIGNATURE header of the resource request.

        If acceptsIndex is out of range for paymentRequired.accepts, or the selected accept is not a Solana network payment option, the request fails with 422.'
      operationId: signSolanaX402PaymentWithEndUserAccount
      tags:
      - End User Accounts
      security:
      - endUserAuth: []
      - apiKeyAuth: []
      parameters:
      - name: userId
        in: path
        required: true
        description: The ID of the end user.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,100}$
          example: e051beeb-7163-4527-a5b6-35e301529ff2
      - $ref: '#/components/parameters/XWalletAuthOptional'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XDeveloperAuth'
      - $ref: '#/components/parameters/ProjectIDOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentRequired:
                  allOf:
                  - $ref: '#/components/schemas/x402PaymentRequired'
                  description: The complete x402 payment required response body from the resource server. Top-level fields (x402Version, resource, error, extensions) are preserved in the signed payment payload; acceptsIndex selects which entry from accepts is signed as paymentPayload.accepted.
                acceptsIndex:
                  type: integer
                  minimum: 0
                  description: Zero-based index into paymentRequired.accepts selecting which payment option to sign. Must be less than the length of accepts. The entry at this index must be a Solana network payment option for this endpoint.
                  example: 0
                address:
                  type: string
                  description: The base58 encoded address of the end user's Solana account to sign with.
                  example: HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
                  pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                walletSecretId:
                  type: string
                  description: Required when not using delegated signing. The ID of the Temporary Wallet Secret that was used to sign the X-Wallet-Auth Header.
                  pattern: ^[a-zA-Z0-9-]{1,100}$
                  example: e051beeb-7163-4527-a5b6-35e301529ff2
              required:
              - paymentRequired
              - acceptsIndex
              - address
            examples:
              mainnet_solana:
                summary: Mainnet Solana USDC payment, first accept option
                value:
                  paymentRequired:
                    x402Version: 2
                    resource:
                      url: https://api.example.com/premium/resource/123
                      description: Premium API access for data analysis.
                      mimeType: application/json
                    accepts:
                    - scheme: exact
                      network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
                      amount: '1000000'
                      asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                      payTo: 2wKupLR9q6wXYppw8Gr2NvWxKBUqm4PPJKkQfoxHDBg4
                      maxTimeoutSeconds: 60
                  acceptsIndex: 0
                  address: HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
                  walletSecretId: e051beeb-7163-4527-a5b6-35e301529ff2
              mainnet_base:
                summary: Resource accepting both Base and Solana USDC; pick Solana entry at index 1
                value:
                  paymentRequired:
                    x402Version: 2
                    resource:
                      url: https://api.example.com/premium/resource/123
                      description: Premium API access for data analysis.
                      mimeType: application/json
                    accepts:
                    - scheme: exact
                      network: eip155:8453
                      amount: '1000000'
                      asset: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
                      payTo: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                      maxTimeoutSeconds: 60
                    - scheme: exact
                      network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
                      amount: '1000000'
                      asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                      payTo: 2wKupLR9q6wXYppw8Gr2NvWxKBUqm4PPJKkQfoxHDBg4
                      maxTimeoutSeconds: 60
                  acceptsIndex: 1
                  address: HpabPRRCFbBKSuJr5PdkVvQc85FyxyTWkFM2obBRSvHT
                  walletSecretId: e051beeb-7163-4527-a5b6-35e301529ff2
      responses:
        '200':
          description: Successfully signed x402 payment payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentPayload:
                    allOf:
                    - $ref: '#/components/schemas/x402PaymentPayload'
                    description: The signed x402 payment payload. Base64-encode this and send it in the PAYMENT-SIGNATURE header of the resource request.
                required:
                - paymentPayload
              examples:
                signed_solana_payload:
                  summary: Signed Solana x402 payment payload
                  value:
                    paymentPayload:
