      - TransferStablecoin
      example: custodyCrypto
    EvmEip7702DelegationNetwork:
      type: string
      description: The network for the EIP-7702 delegation.
      enum:
      - base-sepolia
      - base
      - arbitrum
      - optimism
      - polygon
      - ethereum
      - ethereum-sepolia
