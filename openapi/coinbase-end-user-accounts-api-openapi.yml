          description: 'Whether this capability is currently active. For example, an asset with a `collateral` capability and `enabled: false` cannot currently be borrowed against.

            Some venues may temporarily disable an asset''s capability, which will be  reflected in the `enabled` field. This would not affect any user''s existing  borrow positions.'
          example: true
      required:
      - type
      - enabled
