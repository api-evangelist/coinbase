                    errorMessage: At least one of addCollateralAmount, removeCollateralAmount, repayLoanAmount, or borrowLoanAmount must be supplied.
                conflicting_collateral_operations:
                  value:
                    errorType: invalid_request
                    errorMessage: Cannot specify both addCollateralAmount and removeCollateralAmount.
                conflicting_debt_operations:
                  value:
                    errorType: invalid_request
                    errorMessage: Cannot specify both repayLoanAmount and borrowLoanAmount.
                invalid_amount:
                  value:
                    errorType: invalid_request
                    errorMessage: addCollateralAmount must be a valid decimal string.
                conflicting_paymaster:
                  value:
                    errorType: invalid_request
                    errorMessage: Cannot specify both useCdpPaymaster and custom paymasterUrl
                    errorLink: https://docs.cdp.coinbase.com/embedded-wallets/evm-features/smart-accounts#gas-sponsorship-with-paymaster
