    x402V1PaymentPayload:
      type: object
      title: x402V1PaymentPayload
      description: The x402 v1 protocol payment payload. Uses human-readable network names and requires `scheme` and `network` alongside the inner `payload` object.
      properties:
        x402Version:
          allOf:
          - $ref: '#/components/schemas/X402Version'
          description: The x402 protocol version. Must be `1` for this payload shape.
        scheme:
          type: string
          description: The scheme of the payment protocol to use. Currently, the only supported scheme is `exact`.
          enum:
          - exact
          example: exact
        network:
          allOf:
          - $ref: '#/components/schemas/X402V1Network'
          description: The network of the blockchain to send payment on.
          example: base
        payload:
          type: object
          description: The payload of the payment depending on the x402Version, scheme, and network.
          oneOf:
          - $ref: '#/components/schemas/x402ExactEvmPayload'
          - $ref: '#/components/schemas/x402ExactEvmPermit2Payload'
          - $ref: '#/components/schemas/x402ExactSolanaPayload'
          example:
            signature: '0xf3746613c2d920b5fdabc0856f2aeb2d4f88ee6037b8cc5d04a71a4462f134801234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1b'
            authorization:
              from: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
              to: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
              value: '1000000000000000000'
              validAfter: '1716150000'
              validBefore: '1716150000'
              nonce: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
      example:
        x402Version: 1
        scheme: exact
        network: base
        payload:
          signature: '0xf3746613c2d920b5fdabc0856f2aeb2d4f88ee6037b8cc5d04a71a4462f134801234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1b'
          authorization:
            from: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
            to: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
            value: '1000000000000000000'
            validAfter: '1716150000'
            validBefore: '1716150000'
            nonce: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
      required:
      - x402Version
      - scheme
      - network
      - payload
    x402PaymentRequired:
      type: object
      description: The x402 protocol payment required response body, returned by a resource server when a request lacks valid payment. Contains the accepted payment options, optional resource metadata, and an optional error message from the resource server.
      properties:
        x402Version:
          allOf:
          - $ref: '#/components/schemas/X402Version'
          description: The x402 protocol version.
          example: 2
        accepts:
          type: array
          description: The list of payment options the resource server accepts. At least one option must be present.
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/x402PaymentRequirements'
          example:
          - scheme: exact
            network: eip155:8453
            amount: '1000000'
            asset: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
            payTo: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
            maxTimeoutSeconds: 60
          - scheme: exact
            network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
            amount: '1000000'
            asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            payTo: 2wKupLR9q6wXYppw8Gr2NvWxKBUqm4PPJKkQfoxHDBg4
            maxTimeoutSeconds: 60
        resource:
          allOf:
          - $ref: '#/components/schemas/x402ResourceInfo'
          description: Optional metadata about the resource being paid for.
          example:
            url: https://api.example.com/premium/resource/123
            description: Premium API access for data analysis.
            mimeType: application/json
        error:
          type: string
          description: An optional error message from the resource server describing why payment is required.
          example: PAYMENT-SIGNATURE header is required
        extensions:
          type: object
          description: Optional protocol extensions. Unknown keys are forwarded as-is into the signed payment payload.
          additionalProperties: true
          example: {}
      required:
      - x402Version
      - accepts
    BorrowProductSnapshot:
      type: object
      description: The point-in-time at which onchain state, such as a borrow product or borrow position, was captured. This is when the data was last read from the chain.
      example:
        blockNumber: 49573788
        blockHash: '0xd8419d2f10b821985b2a2d8b2f15ab3ffc14dc55bcfb75b0537dabaad4ded07c'
        blockTimestamp: 1785936923
        observedAt: '2026-08-10T20:37:34Z'
      properties:
        blockNumber:
          type: integer
          format: int64
          description: The block number at which the state was observed.
          example: 49573788
        blockHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: The hash of the block at which the state was observed.
          example: '0xd8419d2f10b821985b2a2d8b2f15ab3ffc14dc55bcfb75b0537dabaad4ded07c'
        blockTimestamp:
          type: integer
          format: int64
          description: The onchain block timestamp at which the state was observed in Unix seconds.
          example: 1785936923
        observedAt:
          type: string
          format: date-time
          description: The timestamp at which the state was observed.
          example: '2026-08-10T20:37:34Z'
      required:
      - blockNumber
      - blockHash
      - blockTimestamp
      - observedAt
    BorrowProductAssetCapability:
