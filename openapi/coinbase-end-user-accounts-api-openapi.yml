                      accepted:
                        scheme: exact
                        network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
                        amount: '1000000'
                        asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                        payTo: 2wKupLR9q6wXYppw8Gr2NvWxKBUqm4PPJKkQfoxHDBg4
                        maxTimeoutSeconds: 60
                      payload:
                        transaction: AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAED
                signed_solana_from_multi_network_payload:
                  summary: Signed Solana payload when resource server also accepts Base (index 1 selected)
                  value:
                    paymentPayload:
                      x402Version: 2
