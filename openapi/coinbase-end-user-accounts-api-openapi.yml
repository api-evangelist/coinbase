openapi: 3.2.0
info:
  title: Coinbase Developer Platform End User Accounts API
  description: The Coinbase Developer Platform APIs - leading the world's transition onchain.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
  contact:
    name: Coinbase Developer Platform
    email: cdp@coinbase.com
    url: https://cdp.coinbase.com
servers:
- url: https://api.cdp.coinbase.com/platform
  description: The production server of the CDP APIs.
security:
- apiKeyAuth: []
tags:
- name: End User Accounts
  x-audience: public
  x-slo-tier:
    tier: ga
  description: 'The End User Accounts APIs enable end users to directly create, manage, and use their accounts. They are typically accessed via the CDP Web SDK, which handles end-user authentication and Temporary Wallet Secret management on behalf of the developer. The End User Accounts APIs offer end users full control over their accounts, including the ability to sign transactions and messages, and to export their accounts'' private keys.


    ## Delegated Signing


    Delegated signing allows developers to sign and send transactions on behalf of an end user without requiring the end user to be present at signing time. This is useful for background operations, automated workflows, and scenarios where the developer''s server needs to act on the end user''s behalf.


    To use delegated signing, the end user must first create a short-lived **delegation grant** by authenticating with their access token and Temporary Wallet Secret. The grant specifies an `expiresAt` timestamp that defines how long the developer is authorized to sign on the end user''s behalf.


    Once a delegation grant is active, the developer''s server can use its CDP API key to perform signing operations for that end user. The delegation middleware transparently validates that an active (non-expired, non-revoked) grant exists for the `{project, user}` pair before allowing the operation to proceed.


    **Grant lifecycle:**


    - Delegation grants are scoped to a single project and end user pair.

    - Grants are time-bounded by the `expiresAt` timestamp and are automatically cleaned up after expiration.

    - Grants can be revoked early by either the end user (using their access token and TWS) or the

    developer (using their API key), via the `RevokeDelegationForEndUser` endpoint.

    - Only one active grant can exist per `{project, user}` pair at a given time.'
paths:
  /v2/embedded-wallet-api/evm/borrow-products:
    get:
      x-audience: public
      summary: List borrow products
      description: 'Lists the borrow products available across all supported networks and protocols. If a network and/or protocol query parameter is supplied, then borrow products are filtered and returned accordingly.

        A borrow product is a protocol-native representation of a borrowable market, describing the venue that hosts it, the assets that can be borrowed or posted as collateral, and their collateral and debt capabilities. For example, a Morpho Blue market that lends USDC against cbBTC.'
      operationId: listEvmBorrowProducts
      tags:
      - End User Accounts
      security:
      - endUserAuth: []
      parameters:
      - $ref: '#/components/parameters/ProjectIDOptional'
      - name: network
        in: query
        required: false
        description: The EVM network name to list borrow products for.
        schema:
          $ref: '#/components/schemas/BorrowProductNetwork'
        example: base
      - name: protocol
        in: query
        required: false
        description: The lending protocol whose borrow products to list.
        schema:
          $ref: '#/components/schemas/BorrowProductProtocol'
        example: morpho_blue
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Successfully listed borrow products.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  description: Response containing a list of borrow products.
                  required:
                  - borrowProducts
                  properties:
                    borrowProducts:
                      type: array
                      description: The list of borrow products, optionally filtered by the supplied network and/or protocol.
                      items:
                        $ref: '#/components/schemas/BorrowProduct'
                - $ref: '#/components/schemas/ListResponse'
              examples:
                success:
                  value:
                    borrowProducts:
                    - borrowProductId: bp_07fb56c0-9afe-5440-8ff2-5b0e115458df
                      network: base
                      name: mGLO / USDC
                      venue:
                        venueId: bp_venue_2978db31-f1ff-570f-8329-6e37d6cae04e
                        entrypointAddress: '0xbbbbbbbbbb9cc5e90e3b3af64bdaf62c37eeffcb'
                        name: Morpho Blue base-mainnet
                      assets:
                      - assetId: bp_asset_7426b5c4-a556-5005-8fee-eb156d491aef
                        token:
                          address: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
                          symbol: USDC
                          decimals: 6
                        capabilities:
                        - type: debt
                          enabled: true
