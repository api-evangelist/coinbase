          blockTimestamp: 1785936923
          observedAt: '2026-08-10T20:37:34Z'
        protocolDetails:
          type: morpho_blue
          marketParams:
            onchainMarketId: '0x29ae7ac08be3a58e11151fed74701fb8e6ffd8e76b1870cf17ad70f332752d0b'
