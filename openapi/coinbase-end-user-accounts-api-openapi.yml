    post:
      x-audience: public
      summary: Create a borrow position for an end user smart account
      description: 'Creates a borrow position for a specific borrow product, by posting collateral from an end user smart account and borrowing a loan against it. One position can be opened per borrow product for a given smart account.

        A borrow product is a protocol-native representation of a borrowable market, such as a Morpho Blue market that lends USDC against cbBTC. The `borrowProductId` identifies the product to borrow against, and the `collateralAmount` and `loanAmount` specify the collateral to post and the loan to take, both expressed as decimal strings in standard unit denomination of their respective tokens.

        A user operation is broadcast to open the position onchain. Poll `getUserOperationWithEndUserAccount` with the returned `userOpHash` until it reaches a terminal state. Once the user operation succeeds onchain, use the borrow positions list endpoint to view the user''s active positions.'
      operationId: createBorrowPositionWithEndUserAccount
      tags:
      - End User Accounts
      security:
      - endUserAuth: []
      parameters:
      - $ref: '#/components/parameters/XWalletAuth'
      - name: userId
        in: path
        required: true
        description: The ID of the end user.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,100}$
          example: e051beeb-7163-4527-a5b6-35e301529ff2
      - name: address
        description: The address of the EVM Smart Account to open the borrow position from.
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
      - $ref: '#/components/parameters/ProjectIDOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBorrowPositionRequest'
            examples:
              create_borrow_position:
                value:
                  borrowProductId: bp_07fb56c0-9afe-5440-8ff2-5b0e115458df
                  collateralAmount: '1'
                  loanAmount: '100'
                  walletSecretId: e051beeb-7163-4527-a5b6-35e301529ff2
                  useCdpPaymaster: false
                  paymasterUrl: https://api.developer.coinbase.com/rpc/v1/base/AbCdEf123456
      responses:
        '200':
          description: Successfully created the borrow position and broadcast the user operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvmUserOperation'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    errorType: invalid_request
                    errorMessage: collateralAmount is required and must be a valid decimal string.
                conflicting_paymaster:
                  value:
                    errorType: invalid_request
                    errorMessage: Cannot specify both useCdpPaymaster and custom paymasterUrl
