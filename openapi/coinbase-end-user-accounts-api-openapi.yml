  /v2/embedded-wallet-api/end-users/{userId}/evm/sign/transaction:
    post:
      x-audience: public
      summary: Sign transaction via end user EVM account
      description: 'Signs a transaction with the given end user EVM account.

        The transaction should be serialized as a hex string using RLP.


        The transaction must be an EIP-1559 dynamic fee transaction. The developer is responsible for ensuring that the unsigned transaction is valid, as the API will not validate the transaction.'
      operationId: signEvmTransactionWithEndUserAccount
      tags:
      - End User Accounts
      security:
      - endUserAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XWalletAuthOptional'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: userId
        description: The ID of the end user.
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,100}$
          example: e051beeb-7163-4527-a5b6-35e301529ff2
      - $ref: '#/components/parameters/XDeveloperAuth'
      - $ref: '#/components/parameters/ProjectIDOptional'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: The 0x-prefixed address of the EVM account belonging to the end user.
                  example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                  pattern: ^0x[0-9a-fA-F]{40}$
                transaction:
                  type: string
                  description: The RLP-encoded transaction to sign, as a 0x-prefixed hex string.
                  example: '0xf86b098505d21dba00830334509431415daf58e2c6b7323b4c58712fd92952145da79018080'
                walletSecretId:
                  description: Required when not using delegated signing. The ID of the Temporary Wallet Secret that was used to sign the X-Wallet-Auth Header.
                  type: string
                  pattern: ^[a-zA-Z0-9-]{1,100}$
                  example: e051beeb-7163-4527-a5b6-35e301529ff2
              required:
              - address
              - transaction
      responses:
        '200':
          description: Successfully signed transaction.
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedTransaction:
                    type: string
                    description: The RLP-encoded signed transaction, as a 0x-prefixed hex string.
                    example: '0x1b0c9cf8cd4554c6c6d9e7311e88f1be075d7f25b418a044f4bf2c0a42a93e212ad0a8b54de9e0b5f7e3812de3f2c6cc79aa8c3e1c02e7ad14b4a8f42012c2c01b'
                required:
                - signedTransaction
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                malformed_transaction:
                  value:
                    errorType: malformed_transaction
                    errorMessage: Malformed unsigned transaction.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/PaymentMethodRequiredError'
        '403':
          $ref: '#/components/responses/DelegationForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: EVM account with the given address not found.
        '409':
          $ref: '#/components/responses/AlreadyExistsError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/embedded-wallet-api/end-users/{userId}/evm/send/transaction:
    post:
      x-audience: public
      summary: Send transaction via end user EVM account
      description: 'Signs a transaction with the given end user EVM account and sends it to the indicated supported network. This API handles nonce management and gas estimation, leaving the developer to provide only the minimal set of fields necessary to send the transaction. The transaction should be serialized as a hex string using RLP.


        The transaction must be an EIP-1559 dynamic fee transaction.


        **Transaction fields and API behavior**


        - `to` *(Required)*: The address of the contract or account to send the transaction to.

        - `chainId` *(Ignored)*: The value of the `chainId` field in the transaction is ignored.

        The transaction will be sent to the network indicated by the `network` field in the request body.


        - `nonce` *(Optional)*: The nonce to use for the transaction. If not provided, the API will assign

        a nonce to the transaction based on the current state of the account.


        - `maxPriorityFeePerGas` *(Optional)*: The maximum priority fee per gas to use for the transaction.

        If not provided, the API will estimate a value based on current network conditions.


        - `maxFeePerGas` *(Optional)*: The maximum fee per gas to use for the transaction.

        If not provided, the API will estimate a value based on current network conditions.


        - `gasLimit` *(Optional)*: The gas limit to use for the transaction. If not provided, the API will estimate a value

        based on the `to` and `data` fields of the transaction.


        - `value` *(Optional)*: The amount of ETH, in wei, to send with the transaction.

        - `data` *(Optional)*: The data to send with the transaction; only used for contract calls.

        - `accessList` *(Optional)*: The access list to use for the transaction.'
      operationId: sendEvmTransactionWithEndUserAccount
      tags:
      - End User Accounts
      security:
      - endUserAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XWalletAuthOptional'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: userId
        description: The ID of the end user.
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,100}$
          example: e051beeb-7163-4527-a5b6-35e301529ff2
      - $ref: '#/components/parameters/XDeveloperAuth'
      - $ref: '#/components/parameters/ProjectIDOptional'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: The 0x-prefixed address of the EVM account belonging to the end user.
                  example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
                  pattern: ^0x[0-9a-fA-F]{40}$
                network:
                  type: string
                  description: The network to send the transaction to.
                  enum:
                  - base
                  - base-sepolia
                  - ethereum
                  - ethereum-sepolia
                  - avalanche
                  - polygon
                  - optimism
                  - arbitrum
                  - arbitrum-sepolia
                  - world
                  - world-sepolia
                  example: base-sepolia
                walletSecretId:
                  description: Required when not using delegated signing. The ID of the Temporary Wallet Secret that was used to sign the X-Wallet-Auth Header.
                  type: string
                  pattern: ^[a-zA-Z0-9-]{1,100}$
                  example: e051beeb-7163-4527-a5b6-35e301529ff2
                transaction:
                  type: string
                  description: The RLP-encoded transaction to sign and send, as a 0x-prefixed hex string.
                  example: '0xf86b098505d21dba00830334509431415daf58e2c6b7323b4c58712fd92952145da79018080'
              required:
              - address
              - transaction
              - network
      responses:
        '200':
          description: Successfully signed and sent transaction.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                    description: The hash of the transaction, as a 0x-prefixed hex string.
                    example: '0xf8f98fb6726fc936f24b2007df5cb20e2b8444ff3dfaa2a929335f432a9be2e7'
                required:
                - transactionHash
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                malformed_transaction:
                  value:
                    errorType: malformed_transaction
                    errorMessage: Malformed unsigned transaction.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/PaymentMethodRequiredError'
        '403':
          $ref: '#/components/responses/DelegationForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    errorType: not_found
                    errorMessage: EVM account with the given address not found.
        '409':
          $ref: '#/components/responses/AlreadyExistsError'
        '422':
          $ref: '#/components/responses/IdempotencyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /v2/embedded-wallet-api/end-users/{userId}/evm/{address}/send/{asset}:
    post:
      x-audience: public
      summary: Send USDC on EVM
      description: 'Sends USDC from an end user''s EVM account (EOA or Smart Account) to a recipient address on a supported EVM network. This endpoint simplifies USDC transfers by automatically handling contract resolution, decimal conversion, gas estimation, and transaction encoding.

        The `amount` field accepts human-readable amounts as decimal strings (e.g., "1.5", "25.50").'
      operationId: sendEvmAssetWithEndUserAccount
      tags:
      - End User Accounts
      security:
      - endUserAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XWalletAuthOptional'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: userId
        in: path
        required: true
        description: The ID of the end user.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,100}$
        example: e051beeb-7163-4527-a5b6-35e301529ff2
      - name: address
        description: The 0x-prefixed address of the EVM account (EOA or Smart Account) to send USDC from. The address does not need to be checksummed.
        in: path
        required: true
        schema:
          allOf:
          - $ref: '#/components/schemas/BlockchainAddress'
          pattern: ^0x[0-9a-fA-F]{40}$
        example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
      - name: asset
        in: path
        required: true
        description: The asset to send. Currently only "usdc" is supported.
        schema:
          allOf:
          - $ref: '#/components/schemas/Asset'
          enum:
          - usdc
        example: usdc
      - $ref: '#/components/parameters/XDeveloperAuth'
      - $ref: '#/components/parameters/ProjectIDOptional'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  allOf:
                  - $ref: '#/components/schemas/BlockchainAddress'
                  pattern: ^0x[0-9a-fA-F]{40}$
                  description: The 0x-prefixed address of the recipient.
                  example: '0x1234567890123456789012345678901234567890'
                amount:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: The amount of USDC to send as a decimal string (e.g., "1.5" or "25.50").
                  example: '1.50'
                network:
                  type: string
                  description: The EVM network to send USDC on.
                  enum:
                  - base
                  - base-sepolia
                  - ethereum
                  - ethereum-sepolia
                  - avalanche
                  - polygon
                  - optimism
                  - arbitrum
                  - arbitrum-sepolia
                  - world
                  - world-sepolia
                  example: base-sepolia
                useCdpPaymaster:
                  type: boolean
                  description: Whether to use CDP Paymaster to sponsor gas fees. Only applicable for EVM Smart Accounts. When true, the transaction gas will be paid by the Paymaster, allowing users to send USDC without holding native gas tokens. Ignored for EOA accounts. Cannot be used together with `paymasterUrl`.
                  example: true
                paymasterUrl:
                  allOf:
                  - $ref: '#/components/schemas/Url'
