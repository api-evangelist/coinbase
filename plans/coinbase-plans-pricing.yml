description: Coinbase Advanced Trade uses a maker-taker fee model based on rolling 30-day USD trading
  volume. Fees range from Intro 1 (0.60% maker / 1.20% taker) at sub-$1K volume down to Advanced 8 (0.00%
  maker / 0.05% taker) at $250M+ monthly volume. Stable pairs charge 0.00% maker for 22 designated pairs.
  The public Advanced Trade and Exchange APIs are free to access; trading fees are charged per execution
  rather than per API call.
sources:
  - https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/advanced-trade-fees
  - https://docs.cdp.coinbase.com/advanced-trade/docs/welcome
